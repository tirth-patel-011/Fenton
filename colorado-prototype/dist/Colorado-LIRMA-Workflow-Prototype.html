      next = `<button class="btn ghost" data-a="asBack">Back</button><button class="btn primary" data-a="asNext" ${m.ctr ? "" : "disabled"}>Next: schedule ${ic("arrow", 15)}</button>`;
    } else {
      const h = Q.hh(s, m.hh), c = Q.ctr(s, m.ctr), j = Q.jobOfHh(s, m.hh);
      body = `<div class="grid g-11 tight"><div>
          <label class="field"><span>Target installation date</span><input type="date" value="${m.date}" data-in="field" data-path="modal.date"></label>
          <label class="field"><span>Priority</span><div class="seg">${["Standard", "High", "Urgent"].map((p) => `<button class="${m.priority === p ? "on" : ""}" data-a="asPriority" data-arg="${p}">${p}</button>`).join("")}</div></label>
          <label class="field"><span>Assigned professional</span><select data-in="field" data-path="modal.professional">${c.team.map((t) => `<option ${m.professional === t.name ? "selected" : ""}>${t.name}</option>`).join("")}</select></label>
          <label class="field"><span>Instructions for the contractor</span><textarea rows="4" data-in="field" data-path="modal.instructions">${esc(m.instructions)}</textarea></label></div>
        <div class="card soft"><h4 class="side-h">Summary</h4>${dl([["Job", j.id], ["Household", `${h.name}<br><small>${h.street}, ${h.city}</small>`], ["Contractor", `${c.name} ${scoreBadge(scoreOf(c))}`], ["Programme-funded amount", money(j.funded)], ["Notification", "Push notification + project in RadonSketch"]])}</div></div>`;
      next = `<button class="btn ghost" data-a="asBack">Back</button><button class="btn primary${hl("as-confirm")}" data-a="asConfirm">${ic("send", 15)} Assign job</button>`;
    }
    return `${head}<div class="m-body" data-scroll="as-${m.step}">${body}</div><footer class="m-foot"><button class="btn ghost" data-a="closeModal">Cancel</button><span class="sp"></span>${next}</footer>`;
  }
  function corrModal(m) {
    const s = S(), j = Q.job(s, m.jobId), r = Q.latest(j);
    return `<header class="m-head"><div><h2>Request corrections</h2><p>${hhOf(j).name} · ${j.id} · report v${r.v}</p></div><button class="x" data-a="closeModal" aria-label="Close">${ic("x", 20)}</button></header>
      <div class="m-body"><p class="hint">Select the items the contractor must fix. They'll get a notification in RadonSketch and can resubmit.</p>
        <div class="corr-checks">${CHECKS.map((k) => { const v = r.checks[k.key]; return `<label class="cc ${v}"><input type="checkbox" ${m.keys.includes(k.key) ? "checked" : ""} data-ch="corrKey" value="${k.key}"><span>${k.label}</span><em>${{ pass: "Pass", warn: "Warning", fail: "Fail" }[v] || "—"}</em></label>`; }).join("")}</div>
        <label class="field"><span>Comment to contractor</span><textarea rows="3" data-in="field" data-path="modal.comment">${esc(m.comment)}</textarea></label></div>
      <footer class="m-foot"><button class="btn ghost" data-a="closeModal">Cancel</button><span class="sp"></span><button class="btn warn${hl("corr-send")}" data-a="sendCorr" ${m.keys.length ? "" : "disabled"}>${ic("send", 15)} Send correction request</button></footer>`;
  }
  function hhModal(m) {
    const f = m.f;
    const fld = (k, l, type = "text", extra = "") => `<label class="field"><span>${l}</span><input type="${type}" value="${esc(f[k] || "")}" data-in="field" data-path="modal.f.${k}" ${extra}></label>`;
    return `<header class="m-head"><div><h2>Add household</h2><p>Approved ${esc(C.program.lirmaFull)} household</p></div><button class="x" data-a="closeModal" aria-label="Close">${ic("x", 20)}</button></header>
      <div class="m-body"><div class="form-g">${fld("name", "Household surname")}${fld("phone", "Phone", "tel")}${fld("street", "Street address")}
        <label class="field"><span>City</span><select data-in="field" data-path="modal.f.city">${Object.keys(C.cities).map((c) => `<option ${f.city === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        ${fld("zip", "ZIP code")}${fld("approved", "LIRMA approval date", "date")}${fld("pre", "Pre-mitigation reading (pCi/L)", "number", 'step="0.1"')}
        <label class="field"><span>Foundation type</span><select data-in="field" data-path="modal.f.foundation">${["Basement", "Slab-on-grade", "Crawlspace", "Combination"].map((x) => `<option ${f.foundation === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        ${fld("built", "Year built", "number")}${fld("occ", "Occupants", "number")}</div></div>
      <footer class="m-foot"><button class="btn ghost" data-a="closeModal">Cancel</button><span class="sp"></span><button class="btn primary" data-a="saveHh">${ic("plus", 15)} Add household</button></footer>`;
  }
  function ctrModal(m) {
    const f = m.f;
    const fld = (k, l, type = "text") => `<label class="field"><span>${l}</span><input type="${type}" value="${esc(f[k] || "")}" data-in="field" data-path="modal.f.${k}"></label>`;
    return `<header class="m-head"><div><h2>${m.edit ? "Edit contractor" : "Add contractor"}</h2><p>${m.edit ? f.name : "Approve a new contractor for the programme"}</p></div><button class="x" data-a="closeModal" aria-label="Close">${ic("x", 20)}</button></header>
      <div class="m-body"><div class="form-g">${fld("name", "Company name")}${fld("person", "Responsible person")}${fld("licence", "Colorado licence number")}
        <label class="field"><span>Certification body</span><select data-in="field" data-path="modal.f.body">${["NRPP", "NRSB"].map((x) => `<option ${f.body === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
        ${fld("certNo", "Certification number")}${fld("certExp", "Certification expiry", "date")}${fld("carrier", "Insurance carrier")}${fld("insExp", "Insurance expiry", "date")}${fld("phone", "Phone", "tel")}${fld("email", "Email", "email")}</div>
        <div class="field"><span>Service counties <small class="muted">${f.counties.length} selected</small></span><div class="county-pick">${countyNames.map((c) => `<button class="${f.counties.includes(c) ? "on" : ""}" data-a="ctrCounty" data-arg="${c}">${c}</button>`).join("")}</div></div>
        <div class="field"><span>Team members</span>${f.team.map((t, i) => `<div class="team-row"><input placeholder="Name" value="${esc(t.name)}" data-in="field" data-path="modal.f.team.${i}.name"><input placeholder="Role" value="${esc(t.role)}" data-in="field" data-path="modal.f.team.${i}.role"><input placeholder="Licence number" value="${esc(t.licence)}" data-in="field" data-path="modal.f.team.${i}.licence"></div>`).join("")}<button class="btn ghost sm" data-a="addTeamRow">${ic("plus", 14)} Add team member</button></div>
        <label class="toggle"><input type="checkbox" ${f.invite ? "checked" : ""} data-in="field" data-path="modal.f.invite"><i></i><span><b>Send app invite</b><small>The contractor gets a RadonSketch login linked to the ${esc(C.program.lirma)} programme.</small></span></label></div>
      <footer class="m-foot"><button class="btn ghost" data-a="closeModal">Cancel</button><span class="sp"></span><button class="btn primary" data-a="saveCtr">${m.edit ? "Save changes" : `${ic("plus", 15)} Add contractor`}</button></footer>`;
  }

  /* =========================================================================
     ROUTER
     ========================================================================= */
  function page() {
    const r = U().route;
    switch (r.page) {
      case "dashboard": return dashboard();
      case "map": return mapPage();
      case "jobs": return jobsPage();
      case "households": return householdsPage();
      case "household": return householdPage(r.id);
      case "contractors": return contractorsPage();
      case "contractor": return contractorPage(r.id);
      case "reports": return reportsPage();
      case "report": return reportPage(r.id, r.v);
      case "notifications": return notificationsPage();
      case "settings": return settingsPage();
      default: return dashboard();
    }
  }
  window.PortalPages = { login, page, modal, recommend, attention };

  /* =========================================================================
     ACTIONS
     ========================================================================= */
  const R = () => Pt.render();
  const freshTable = (f = {}, special = null, sort, dir) => ({ q: "", sort: sort || null, dir: dir || "asc", page: 1, f, special });
  const A = {
    go(p) { U().route = { page: p }; U().modal = null; U().menu = null; if (p === "contractor") U().ctrTab = "details"; R(); },
    signIn() { U().route = { page: "dashboard" }; R(); Pt.toast(`Welcome back, ${C.signedInUser.name.split(" ")[0]}.`); },
    signOut() { U().route = { page: "login" }; U().menu = null; U().modal = null; R(); },
    help() { Pt.toast("Help centre and programme guidance would open here (sample)."); },
    userMenu() { U().menu = U().menu ? null : "user"; R(); },
    period(p) { U().period = p; R(); },
    customFrom(v) { U().custom.from = v; R(); },
    customTo(v) { U().custom.to = v; R(); },
    dashGo(arg) {
      const [pg, q] = arg.split("|");
      if (pg === "reports") { U().reportTab = q; U().route = { page: "reports" }; }
      else if (pg === "jobs") { const [k, v] = q.split("="); U().tables.jobs = k === "special" ? freshTable({}, v, "sched", "asc") : freshTable({ [k]: v }, null, "sched", "asc"); U().route = { page: "jobs" }; }
      else if (pg === "contractors") { const [, v] = q.split("="); U().tables.contractors = freshTable({}, v, "score", "asc"); U().route = { page: "contractors" }; }
      U().modal = null; R();
    },
    dashCounty(label) { const county = label.replace(" County", ""); U().map.f = { ...U().map.f, county }; U().map.applied = { ...U().map.f }; U().route = { page: "map" }; R(); },
    // tables
    tblSort(arg) { const [k, c] = arg.split("|"), t = U().tables[k]; if (t.sort === c) t.dir = t.dir === "asc" ? "desc" : "asc"; else { t.sort = c; t.dir = "asc"; } R(); },
    tblPage(arg) { const [k, n] = arg.split("|"); U().tables[k].page = +n; R(); },
    tblReset(k) { const t = U().tables[k]; t.f = {}; t.q = ""; t.page = 1; t.special = null; R(); },
    tblF(v, el) { const t = U().tables[el.dataset.key]; t.f[el.dataset.f] = v; t.page = 1; R(); },
    tblSpecialClear(k) { U().tables[k].special = null; R(); },
    // map
    mapLayer(l) { U().map.layer = l; R(); },
    mapF(v, el) { U().map.f[el.dataset.f] = v; if (el.dataset.f === "zip" && !v) U().map.f.radius = ""; R(); },
    mapSearch() { U().map.applied = { ...U().map.f }; U().map.sel = null; R(); },
    mapReset() { U().map.f = { zip: "", radius: "", county: "", ctr: "", status: "", band: "" }; U().map.applied = {}; U().map.sel = null; if (Pt.MAPS.main) Pt.MAPS.main._county = "__"; R(); },
    mapClearCounty() { U().map.f.county = ""; U().map.applied.county = ""; R(); },
    mapClose() { U().map.sel = null; R(); },
    // navigation to records
    openJob(id) { U().modal = { type: "job", id, tab: "details", act: "all" }; U().noteDraft = ""; R(); },
    jobTab(t) { U().modal.tab = t; R(); },
    actFilter(v) { U().modal.act = v; R(); },
    replayTrack() { U().modal.trackNonce = (U().modal.trackNonce || 0) + 1; R(); },
    closeModal() { U().modal = null; R(); },
    modalBack() { U().modal = null; R(); },
    openHousehold(id) { U().route = { page: "household", id }; U().modal = null; R(); },
    openContractor(id) { U().route = { page: "contractor", id }; U().ctrTab = "details"; U().modal = null; U().noteDraft = ""; R(); },
    ctrTab(t) { U().ctrTab = t; R(); },
    metricsRange(r) { U().metricsRange = r; R(); },
    projToggle(v) { U().projToggle = v; R(); },
    calNav(arg) { const [k, d] = arg.split("|"), cal = U().cal[k]; if (+d === 0) { const p = Dt.parts(S().now); cal.y = p.y; cal.m = p.m; } else { cal.m += +d; if (cal.m < 1) { cal.m = 12; cal.y--; } if (cal.m > 12) { cal.m = 1; cal.y++; } } R(); },
    ctrStatus(v, el) { const c = Q.ctr(S(), el.dataset.id); c.status = v; R(); Pt.toast(`${c.name} is now ${v}.`); },
    // reports
    reportTab(t) { U().reportTab = t; R(); },
    openReport(arg) { const [id, v] = arg.split("|"); U().route = { page: "report", id, v: +v }; U().modal = null; R(); },
    pdf(id) { Pt.toast(`Report PDF for ${id} downloaded (sample file).`); },
    approve(id) {
      const s = S(), j = Q.job(s, id), c = ctrOf(j), before = scoreOf(c);
      Ops.approve(s, id, s.now);
      Ops.notify(s, { at: s.now, type: "approve", text: `Report approved for ${hhOf(j).name} (v${Q.latest(j).v})`, jobId: id, unread: false });
      if (U().modal && U().modal.type === "job") U().modal = null;
      if (U().route.page === "report") U().route.v = Q.latest(j).v;
      const after = scoreOf(c);
      Pt.toast(`Report approved — ${hhOf(j).name} is now Approved.${after !== before ? ` ${c.name} compliance ${before}% → ${after}%.` : ""}`);
    },
    openCorr(id) { const r = Q.latest(Q.job(S(), id)); U().modal = { type: "corr", jobId: id, keys: CHECKS.filter((k) => r.checks[k.key] !== "pass").map((k) => k.key), comment: "" }; R(); },
    corrKey(v, el) { const m = U().modal; m.keys = el.checked ? [...new Set([...m.keys, v])] : m.keys.filter((k) => k !== v); R(); },
    sendCorr() {
      const s = S(), m = U().modal, j = Q.job(s, m.jobId);
      Ops.requestCorrections(s, m.jobId, m.keys, m.comment, s.now);
      U().modal = null;
      Pt.toast(`Corrections requested — ${ctrOf(j).name} has been notified in RadonSketch.`, "warn");
    },
    // assign flow
    openAssign(arg) {
      const m = { type: "assign", step: 1, hh: null, ctr: null, q: "", date: Dt.addDays(today(), 7), priority: "Standard", instructions: "", professional: "" };
      if (arg && arg.startsWith("hh:")) { const id = arg.slice(3), j = Q.jobOfHh(S(), id); if (j.status === "unassigned") { m.hh = id; m.step = 2; } }
      if (arg && arg.startsWith("ctr:")) m.presetCtr = arg.slice(4);
      U().modal = m; R();
    },
    reassign(jobId) { const j = Q.job(S(), jobId); U().modal = { type: "assign", step: 2, hh: j.hh, ctr: null, reassign: jobId, date: j.sched ? Dt.date(j.sched) : Dt.addDays(today(), 7), priority: j.priority, instructions: j.instructions, professional: "" }; R(); },
    asHh(id) { const m = U().modal; m.hh = id; R(); },
    asCtr(id) { const m = U().modal; m.ctr = id; R(); },
    asNext() {
      const m = U().modal, s = S();
      if (m.step === 1 && m.presetCtr) m.ctr = m.presetCtr;
      if (m.step === 2) { const c = Q.ctr(s, m.ctr), j = Q.jobOfHh(s, m.hh); m.professional = m.professional || (c.team[1] || c.team[0]).name; if (!m.instructions) m.instructions = j.instructions || ""; }
      m.step++; R();
    },
    asBack() { U().modal.step--; R(); },
    asPriority(p) { U().modal.priority = p; R(); },
    asConfirm() {
      const s = S(), m = U().modal, j = m.reassign ? Q.job(s, m.reassign) : Q.jobOfHh(s, m.hh), c = Q.ctr(s, m.ctr);
      Ops.assign(s, j.id, m.ctr, { date: m.date, priority: m.priority, instructions: m.instructions, professional: m.professional, at: s.now });
      Ops.notify(s, { at: s.now, type: "assign", text: `${j.id} assigned to ${c.name} — ${Q.hh(s, j.hh).name}`, jobId: j.id, unread: false });
      m.success = j.id; R();
    },
    assignAnother() { A.openAssign(); },
    // notes
    addNote(arg) {
      const [kind, id] = arg.split("|"), text = (U().noteDraft || "").trim();
      if (!text) { Pt.toast("Write a note first.", "warn"); return; }
      const n = { by: C.signedInUser.name, at: S().now, text };
      (kind === "job" ? Q.job(S(), id).notes : Q.ctr(S(), id).notes).push(n);
      if (kind === "job") Ops.event(Q.job(S(), id), S().now, "programme", "note", "Internal note added", text.slice(0, 90));
      U().noteDraft = ""; Pt.toast("Note added.");
    },
    // households & contractors forms
    openAddHh() { U().modal = { type: "hh", f: { name: "", street: "", city: "Denver", zip: "", phone: "", approved: today(), pre: "", foundation: "Basement", built: "", occ: "" } }; R(); },
    saveHh() {
      const f = U().modal.f;
      if (!f.name || !f.street) { Pt.toast("Enter a household surname and street address.", "warn"); return; }
      const h = Ops.addHousehold(S(), f);
      U().modal = null; U().route = { page: "household", id: h.id };
      Pt.toast(`${h.name} added and an unassigned job created.`);
    },
    openAddCtr() { U().modal = { type: "ctr", f: { name: "", person: "", licence: "", body: "NRPP", certNo: "", certExp: "", carrier: "", insExp: "", phone: "", email: "", counties: [], team: [{ name: "", role: "Licensed Mitigation Professional", licence: "" }, { name: "", role: "Installer", licence: "" }], invite: true } }; R(); },
    editCtr(id) { const c = Q.ctr(S(), id); U().modal = { type: "ctr", edit: id, f: { name: c.name, person: c.person, licence: c.licence, body: c.cert.body, certNo: c.cert.number, certExp: c.cert.expiry, carrier: c.insurance.carrier, insExp: c.insurance.expiry, phone: c.phone, email: c.email, counties: c.counties.slice(), team: c.team.map((t) => ({ ...t })), invite: false } }; R(); },
    ctrCounty(c) { const f = U().modal.f; f.counties = f.counties.includes(c) ? f.counties.filter((x) => x !== c) : [...f.counties, c]; R(); },
    addTeamRow() { U().modal.f.team.push({ name: "", role: "Installer", licence: "" }); R(); },
    saveCtr() {
      const s = S(), m = U().modal, f = m.f;
      if (!f.name) { Pt.toast("Enter a company name.", "warn"); return; }
      if (m.edit) {
        const c = Q.ctr(s, m.edit);
        Object.assign(c, { name: f.name, person: f.person, licence: f.licence, phone: f.phone, email: f.email, counties: f.counties, team: f.team.filter((t) => t.name) });
        c.cert = { ...c.cert, body: f.body, number: f.certNo, expiry: f.certExp || c.cert.expiry }; c.insurance = { carrier: f.carrier, expiry: f.insExp || c.insurance.expiry };
        U().modal = null; Pt.toast(`${c.name} updated.`); return;
      }
      const city = C.cities[Object.keys(C.cities).find((k) => f.counties.includes(C.cities[k].county)) || "Denver"];
      const id = `CTR-${String(s.contractors.length + 1).padStart(2, "0")}`;
      s.contractors.push({ id, name: f.name, status: "Pending", score: null, historyChecks: 0, histChecks: { passed: 0, total: 0 }, person: f.person || "—", licence: f.licence || "Pending", cert: { body: f.body, number: f.certNo || "Pending", expiry: f.certExp || "2027-12-31" }, insurance: { carrier: f.carrier || "Pending", expiry: f.insExp || "2027-12-31" }, licenceExpiry: "2027-12-31", base: { city: "Colorado", lat: city.lat, lng: city.lng, address: "—" }, counties: f.counties.length ? f.counties : ["Denver"], phone: f.phone || "—", email: f.email || "—", team: f.team.filter((t) => t.name).length ? f.team.filter((t) => t.name) : [{ name: f.person || "—", role: "Owner", licence: f.licence || "—" }], hist: { completed: 0, avgReduction: null, onTime: null }, firstJob: null, lastActivity: s.now, notes: [], trend: [], events: [] });
      U().modal = null; U().route = { page: "contractor", id }; U().ctrTab = "details";
      Pt.toast(`${f.name} added as Pending.${f.invite ? " RadonSketch app invite sent." : ""}`);
    },
    // notifications & settings
    openNotif(id) {
      const s = S(), n = s.notifications.find((x) => x.id === id); n.unread = false;
      const job = n.jobId ? Q.job(s, n.jobId) : n.job ? s.jobs.find((j) => hhOf(j).surname === n.job) : null;
      if (job) { U().modal = { type: "job", id: job.id, tab: n.type === "report" || n.type === "resubmit" ? "report" : "activity", act: "all" }; R(); return; }
      if (n.contractor) { U().route = { page: "contractor", id: n.contractor }; U().ctrTab = "credentials"; R(); return; }
      R();
    },
    markAllRead() { S().notifications.forEach((n) => (n.unread = false)); Pt.toast("All notifications marked as read."); },
    saveSettings() { Pt.toast("Programme details saved."); },
    thrGood(v) { C.thresholds.good = Math.min(+v || 70, C.thresholds.great - 1); R(); Pt.toast(`POOR band now below ${C.thresholds.good}%.`); },
    thrGreat(v) { C.thresholds.great = Math.max(+v || 90, C.thresholds.good + 1); R(); Pt.toast(`GREAT band now ${C.thresholds.great}% and above.`); },
    inviteUser() { Pt.toast("Invitation form would open here — roles: Program Coordinator, Reviewer/Inspector, Read-only."); },
  };
  window.PortalActions = A;
})();

</script>
  <script>
/* shared/phone.js */
/* ===========================================================================
   RadonSketch mobile app screens (workflow prototype). Rendered from the same
   store as the portal so both sides always agree.
   ps = phone state: { screen, notif, ... }
   =========================================================================== */
(function () {
  const C = window.CONFIG, { Dt, Q, STATUS, CHECKS } = window.Store, { ic, esc, plan } = window.UI;

  const statusbar = (S) => {
    const p = Dt.parts(S.now), h = p.hh % 12 || 12;
    return `<div class="sbar"><span>${h}:${String(p.mm).padStart(2, "0")}</span><span class="sbar-ic">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.3A10.6 10.6 0 0 0 8 .4 10.6 10.6 0 0 0 .5 3.4l1.3 1.3A8.8 8.8 0 0 1 8 2.2zm0 3.6c1.4 0 2.7.6 3.7 1.5L13 6a7 7 0 0 0-10 0l1.3 1.3c1-1 2.3-1.5 3.7-1.5zm0 3.6c-.6 0-1.1.2-1.5.6L8 11.6l1.5-1.6c-.4-.4-.9-.6-1.5-.6z"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.8" fill="currentColor"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" fill="currentColor" opacity=".45"/></svg></span></div>`;
  };

  const photoThumb = (i) => { const hue = [28, 205, 150, 45, 0, 190, 260, 110][i]; return `<span class="pl-th"><svg viewBox="0 0 52 40"><rect width="52" height="40" fill="hsl(${hue} 18% 78%)"/><rect y="27" width="52" height="13" fill="hsl(${hue} 14% 66%)"/><rect x="22" y="4" width="7" height="30" rx="2" fill="#f4f4f2"/><rect x="19" y="14" width="13" height="8" rx="2" fill="#3a3f46"/></svg></span>`; };

  const SCREENS = {
    lock(S, ps, d) {
      const p = Dt.parts(S.now), h = p.hh % 12 || 12;
      const N = {
        assigned: ["New LIRMA job assigned", `${d.hh.name}, ${d.hh.city}. Tap to view.`],
        corrections: ["Corrections requested", `${d.hh.name}: system label photo missing. Tap to fix and resubmit.`],
        approved: ["Report approved", `${d.hh.name} — ${C.program.name} approved report v${(Q.latest(d.job) || { v: 1 }).v}.`],

    },
    projects(S, ps, d) {
      const st = d.job.status;
      const pill = { assigned: d.job.acceptedAt ? ["Accepted", ""] : ["New", "new"], scheduled: ["Scheduled", ""], inprogress: ["In progress", "warn"], submitted: ["In review", ""], corrections: ["Corrections", "warn"], approved: ["Approved", "ok"], closed: ["Closed", "ok"] }[st] || ["New", "new"];
      const lirma = st === "unassigned" ? "" : `<div class="proj tone-lirma"><div class="proj-card"><span class="lirma-badge">${ic("shield", 12)} LIRMA · ${esc(C.program.name)}</span>

      const mine = [["Ortega Residence", "Draft", "green", "Slab", "06 Nov, 2026 at 10:24 am"], ["Pine Ridge Duplex", "Submitted", "peach", "Crawlspace", "03 Nov, 2026 at 04:51 pm"], ["Hollow Creek Home", "Exported", "green", "Basement", "29 Oct, 2026 at 09:12 am"]];
      return { tab: true, html: `<div class="ph-h"><h1>My Projects</h1><div class="ph-h-act"><span class="cbtn">${ic("search", 20)}</span><span class="cbtn">${ic("filter", 20)}</span></div></div>
        <div class="pad">${lirma}${mine.map(([n, s, t, f, c]) => `<div class="proj tone-${t}"><div class="proj-card"><div class="proj-top"><span class="proj-name">${n}</span><span class="pill-grey">${s}</span></div><div class="proj-tags"><span class="tag">USA</span><span class="tag">Residential</span><span class="tag">${f}</span></div></div><div class="proj-foot">Created ${c}</div></div>`).join("")}</div>` };
    },
    project(S, ps, d) {
      const accepted = !!d.job.acceptedAt;

        <div class="st-line ${accepted ? "ok" : ""}">${ic(accepted ? "check-circle" : "bell", 16)} ${accepted ? `Accepted ${Dt.time(d.job.acceptedAt)} · programme notified` : `Assigned by ${esc(C.program.name)} · ${Dt.dt(d.job.assignedAt)}`}</div>
        <div class="p-card"><h3>${d.hh.name}</h3>${kv([["Address", `${d.hh.street}<br>${d.hh.city}, CO ${d.hh.zip}`], ["Phone", d.hh.phone], ["Occupants", d.hh.occ], ["Foundation", d.hh.foundation], ["Year built", d.hh.built], ["Pre-mitigation", `<b>${d.hh.pre.toFixed(1)} pCi/L</b>`]])}</div>
        <div class="p-card"><h3>Programme job</h3>${kv([["Job ID", d.job.id], ["Target date", d.job.targetDate ? Dt.short(d.job.targetDate) : "—"], ["Professional", d.job.professional], ["Funded", `$${d.job.funded.toLocaleString("en-US")}`]])}</div>
        <div class="p-card"><h3>Instructions</h3><p style="font-size:14px;line-height:1.5;color:#4A4038">${esc(d.job.instructions)}</p></div></div>`,
        foot: `<span class="p-btn ${accepted ? "done" : ""}">${accepted ? ic("check", 18) + " Accepted" : "Accept Job"}</span><span class="p-btn ${accepted ? "" : "sec"}">${ic("calendar", 18)} Schedule Visit</span>` };
    },
    schedule(S, ps, d) {
      const days = [10, 11, 12, 13, 14, 16, 17].map((n) => `2026-11-${n}`);
      return { theme: "white", html: `${nav("Schedule visit")}<div class="pad"><p style="font-size:14px;color:#5A5048;margin:2px 0 12px">${d.hh.name} · ${d.hh.city}</p>
        <div class="sec-l">November 2026</div>
        <div class="date-strip">${days.map((x) => `<span class="ds ${x === C.demo.visitDate ? "on" : ""}"><small>${Dt.DAYS[Dt.dow(x)].slice(0, 3)}</small><b>${+x.slice(8)}</b></span>`).join("")}</div>
        <div class="sec-l">Arrival window</div>
        <div class="slots">${["08:00–12:00", "10:00–14:00", "12:00–16:00", "13:00–17:00"].map((w, i) => `<span class="slot ${i === 0 ? "on" : i === 3 ? "off" : ""}">${Dt.hm(w.slice(0, 5))} – ${Dt.hm(w.slice(-5))}</span>`).join("")}</div>
        <div class="p-card" style="margin-top:14px">${kv([["Household", "Notified by text"], ["Programme", `${C.program.name} updated`], ["Timezone", C.timezone]])}</div></div>`,
        foot: `<span class="p-btn">Confirm visit · Thu 12 Nov</span>` };
    },
    scheduled(S, ps, d) {
      return { theme: "white", html: `<div class="big-ok"><span class="okc">${ic("check", 36)}</span><h2>Visit scheduled</h2><p><b>${Dt.long(d.job.sched)}</b><br>${Dt.hm(d.job.window.slice(0, 5))} – ${Dt.hm(d.job.window.slice(-5))}</p>
        <p>${d.hh.name} has been notified and the visit is on the ${esc(C.program.name)} schedule.</p></div><div class="pad">${lirmaStrip()}</div>`, foot: `<span class="p-btn sec">Back to project</span>` };
    },
    checkin(S, ps, d) {
      const inn = !!d.job.checkIn;
      return { theme: "white", html: `${nav("On site")}<div class="pad">
        <div class="loc-card"><div class="loc-map"><svg viewBox="0 0 360 180"><rect width="360" height="180" fill="#E9EDE4"/><path d="M0 120H360M150 0V180M0 40H360" stroke="#fff" stroke-width="14"/><path d="M260 0V180" stroke="#fff" stroke-width="9"/><rect x="168" y="58" width="74" height="46" rx="4" fill="#DCD6CC"/><circle cx="205" cy="81" r="36" fill="rgba(29,95,173,.12)"/>
          <path d="M205 82c0 0-11-12.5-11-21a11 11 0 1 1 22 0c0 8.5-11 21-11 21z" fill="#E08A00" stroke="#fff" stroke-width="2"/><circle cx="214" cy="96" r="8" fill="#1D5FAD" stroke="#fff" stroke-width="3"/></svg></div>
          <div class="loc-b"><b>${d.hh.street}</b>${d.hh.city}, CO ${d.hh.zip}<br><span style="color:#2E9E5B;font-weight:600">${ic("map-pin", 14)} You're at the household · 0.02 mi away</span></div></div>
        ${inn ? `<div class="st-line ok">${ic("check-circle", 16)} Checked in at ${Dt.time(d.job.checkIn)} — location shared with the programme while on site</div>` : `<div class="st-line">${ic("map-pin", 16)} Confirm your location to check in</div>`}
        <div class="p-card">${kv([["Job", d.job.id], ["Visit", `${Dt.wdm(d.job.sched)} · ${d.job.window}`], ["Professional", d.job.professional]])}</div></div>`,
        foot: inn ? `<span class="p-btn">${ic("grid", 18)} Start Diagnostic</span>` : `<span class="p-btn">${ic("map-pin", 18)} Check in</span>` };
    },
    diag(S, ps, d) {
      return { html: `${nav(d.hh.name)}${lirmaStrip()}${seg("Diagnostic")}<div class="pad"><div class="canvas">${plan({ mode: "diag" })}</div>

        <p style="font-size:12.5px;color:#8A7F75;margin-top:8px">Pre-mitigation reading ${d.hh.pre.toFixed(1)} pCi/L · 6 test points</p></div>`,
        foot: `<span class="p-btn done">${ic("check", 18)} Diagnostic complete</span>` };
    },
    builder(S, ps, d) {
      const fixed = ps.fixed;
      const live = CHECKS.map((k) => ({ ...k, v: k.key === "clearance" ? (fixed ? "pass" : "warn") : k.key === "label" || k.key === "posttest" ? "pending" : "pass" }));
      const order = live.slice().sort((a, b) => ({ warn: 0, pass: 1, pending: 2 }[a.v] - { warn: 0, pass: 1, pending: 2 }[b.v]));
      const n = (v) => live.filter((x) => x.v === v).length;
      return { html: `${nav(d.hh.name)}${lirmaStrip()}${seg("Radon Builder")}<div class="pad"><div class="canvas">${plan({ mode: "build", fixed })}</div>
        <div class="comp-p"><header><b>Compliance · ${C.standard}</b><div class="comp-sum"><span class="ok">${n("pass")} passed</span>${n("warn") ? `<span class="warn">${n("warn")} warning</span>` : ""}<span class="pend">${n("pending")} pending</span></div></header>
        ${order.slice(0, 5).map((k) => `<div class="ck ${k.v} ${fixed && k.key === "clearance" ? "fixed" : ""}"><span class="ck-i">${ic(k.v === "pass" ? "check" : k.v === "warn" ? "alert" : "clock", 14)}</span><span><b>${k.label}</b>
          ${k.key === "clearance" ? `<small>${fixed ? "Vent moved — 14 ft from nearest window" : "Vent termination 8 ft from window — minimum 10 ft"}</small>${fixed ? "" : `<br><span class="mv-btn">Move vent</span>`}` : ""}</span></div>`).join("")}</div></div>`,
        foot: `<span class="p-btn ${fixed ? "" : "sec"}">${fixed ? ic("check", 18) + " Design compliant" : "Resolve warning to continue"}</span>` };
    },
    photos(S, ps, d) {
      const added = ps.labelAdded;
      const rows = window.UI.PHOTOS.map(([k, cap], i) => (k === "label" && !added ? `<div class="pl-row miss"><span class="pl-th">${ic("camera", 18)}</span><span>${cap} — not captured</span>${ic("alert", 18, "")}</div>` : `<div class="pl-row ${k === "label" ? "new" : ""}">${photoThumb(i)}<span>${cap}</span><span class="okk">${ic("check-circle", 18)}</span></div>`));
      return { theme: "white", html: `${nav("Installation photos")}${lirmaStrip()}<div class="pad">
        <div class="st-line ${added ? "ok" : "warn"}">${ic(added ? "check-circle" : "alert", 16)} ${added ? "8 of 8 required photos" : "7 of 8 required photos — 1 missing"}</div>
        <div class="photo-list">${rows.join("")}</div>
        <div class="post-card"><b>Post-mitigation reading</b><div class="pc-row">${d.job.post != null ? `<b>${d.job.post.toFixed(1)}</b><small>pCi/L · 48-hour test</small>` : `<span style="color:#8A5A00;font-weight:600">${ic("clock", 15)} Due within programme timeframe</span>`}</div>
          <small>Optional now — required before the job can be closed.</small></div></div>`,
        foot: `<span class="p-btn">${ic("upload", 18)} ${added ? "Photos uploaded" : "Upload photos & check out"}</span>` };
    },
    postreading(S, ps, d) {
      return { theme: "white", html: `${nav("Post-mitigation reading")}${lirmaStrip()}<div class="pad">
        <div class="p-card"><h3>Short-term test</h3>${kv([["Device", "Continuous radon monitor"], ["Started", "12 Nov 2026, 2:10 PM"], ["Ended", "14 Nov 2026, 2:10 PM"], ["Duration", "48 hours"]])}</div>
        <div class="post-card"><b>Result</b><div class="pc-row"><b>${(d.job.post || C.demo.post).toFixed(1)}</b><small>pCi/L</small></div><small style="color:#2E9E5B;font-weight:600">${Math.round((1 - (d.job.post || C.demo.post) / d.hh.pre) * 100)}% reduction from ${d.hh.pre.toFixed(1)} pCi/L · below ${C.actionLevel} pCi/L</small></div></div>`,
        foot: `<span class="p-btn">${ic("file", 18)} Generate report</span>` };
    },
    report(S, ps, d) {
      const keys = CHECKS.map((k) => ({ ...k, f: k.key === "label" && !ps.labelAdded }));
      const passed = keys.filter((k) => !k.f).length;
      return { theme: "white", html: `${nav("Report preview")}${lirmaStrip()}<div class="pad"><div class="rep-prev">
        <div class="rp-h"><span>${esc(C.program.name)} · LIRMA report</span><span>v${ps.labelAdded ? 2 : 1}</span></div>
        <div class="rp-t">${d.hh.name}</div><div class="rp-s">${d.hh.street}, ${d.hh.city} · ${d.job.id}</div>
        <div class="rp-g"><div><span>Pre</span><b>${d.hh.pre.toFixed(1)}</b></div><div><span>Post</span><b>${(d.job.post || C.demo.post).toFixed(1)}</b></div><div><span>Reduction</span><b>${Math.round((1 - (d.job.post || C.demo.post) / d.hh.pre) * 100)}%</b></div></div>
        ${plan({ mode: "build", fixed: true, labels: false })}
        <b style="font-size:11px">Compliance · ${C.standard} — ${passed} of 10 passed</b>
        <div class="rp-c">${keys.map((k) => `<span><i class="${k.f ? "f" : ""}">${k.f ? "!" : "✓"}</i>${k.label.split("(")[0]}</span>`).join("")}</div></div></div>`,
        foot: `<span class="p-btn">${ic("send", 18)} Submit to ${esc(C.program.name)}</span>` };
    },
    syncing() { return { theme: "white", html: `<div class="big-ok" style="padding-top:150px"><span class="spin"></span><h2>Syncing report…</h2><p>Uploading report, photos and compliance checks to ${esc(C.program.name)}.</p></div>` }; },
    synced(S, ps, d) {
      const r = Q.latest(d.job), res = r ? Q.result(r) : { text: "" };
      return { theme: "white", html: `<div class="big-ok"><span class="okc">${ic("check", 36)}</span><h2>${r && r.v > 1 ? `Report resubmitted (v${r.v})` : `Submitted to ${esc(C.program.name)}`}</h2>
        <div class="sync-ok">${ic("sync", 16)} Synced · report v${r ? r.v : 1} · ${res.text}</div><p>Your report is in the programme's review queue. You'll be notified when it's reviewed.</p></div><div class="pad">${lirmaStrip()}</div>`, foot: `<span class="p-btn sec">Back to projects</span>` };
    },
    corrections(S, ps, d) {
      const r = Q.latest(d.job);
      return { theme: "white", html: `${nav("Corrections")}${lirmaStrip()}<div class="pad">
        <div class="corr-box"><b>${ic("alert", 15)} Corrections requested</b><p>${esc(r && r.comment ? r.comment : "System label photo missing.")}</p><small style="color:#8A7F75">${esc(C.program.name)} · ${r && r.reviewedAt ? Dt.dt(r.reviewedAt) : ""}</small></div>
        <div class="photo-list">${window.UI.PHOTOS.map(([k, cap], i) => (k === "label" ? (ps.labelAdded ? `<div class="pl-row new">${photoThumb(i)}<span>${cap} — added</span><span class="okk">${ic("check-circle", 18)}</span></div>` : `<div class="pl-row miss"><span class="pl-th">${ic("camera", 18)}</span><span>${cap} — required</span></div>`) : "")).join("")}
          ${window.UI.PHOTOS.filter(([k]) => k !== "label").slice(0, 3).map(([k, cap], i) => `<div class="pl-row">${photoThumb(i)}<span>${cap}</span><span class="okk">${ic("check-circle", 18)}</span></div>`).join("")}</div></div>`,
        foot: `<span class="p-btn ${ps.labelAdded ? "" : "sec"}">${ic("refresh", 18)} Resubmit report</span>` };
    },
  };

  function render(S, ps) {
    const D = C.demo, job = Q.job(S, D.jobId), hh = Q.hh(S, D.householdId);
    const scr = SCREENS[ps.screen](S, ps, { job, hh });
    return `<div class="ps th-${scr.theme || "cream"}">${statusbar(S)}<div class="pbody" data-k="${ps.screen}">${scr.html}</div>
      ${scr.foot ? `<div class="pfoot">${scr.foot}</div>` : ""}${scr.tab ? tabbar() : ""}<div class="home-ind"></div></div>`;
  }
  window.Phone = { render };
})();

</script>
  <script>
/* workflow/workflow.js */
/* ===========================================================================
   Workflow prototype — portal (left) + RadonSketch app (right), 14 steps.
   Every step is rebuilt from the sample data, so Back / Next / Reset are
   deterministic and statuses, counters, pins and scores match on both sides.
   A step can have several timed "stages" (e.g. warning → fixed).
   =========================================================================== */
(function () {
  const C = window.CONFIG, { Dt, Q, Ops, CHECKS } = window.Store;
  const D = C.demo, JOB = D.jobId, HH = D.householdId, CTR = D.contractorId;

  const checksWith = (fails) => { const o = {}; CHECKS.forEach((k) => (o[k.key] = fails.includes(k.key) ? "fail" : "pass")); return o; };
  const jobModal = (tab, hl) => ({ route: { page: "dashboard" }, modal: { type: "job", id: JOB, tab, act: "all" }, highlight: hl || [] });
  const ctrName = C.contractors.find((c) => c.id === CTR).name;
  const hhName = C.households.find((h) => h.id === HH).name + " Household";

  // keep the rest of the sample world plausible as the demo clock moves forward
  function advanceWorld(S) {
    if (Dt.date(S.now) <= C.today) return;
    S.jobs.forEach((j) => {
      if (j.id === JOB || Q.hh(S, j.hh).surname === "Whitcomb") return;
      if (j.status === "scheduled" && j.sched && Dt.ms(j.sched) < Dt.ms(S.now)) Ops.checkIn(S, j.id, Dt.addMin(j.sched, 6), 0.02);
      if (j.status === "inprogress" && j.checkIn && !j.checkOut && Dt.date(j.checkIn) < Dt.date(S.now)) Ops.checkOut(S, j.id, `${Dt.date(j.checkIn)} 15:10`);
    });
  }

  const STEPS = [
    { title: "Approved household waiting for a contractor", focus: "portal",
      caption: `The programme coordinator starts the day on the dashboard. “Approved households waiting to be assigned” shows ${hhName} in Pueblo is ready for a contractor.`,
      stages: [{ now: "2026-11-10 09:10", ui: () => ({ route: { page: "dashboard" }, highlight: ["attn-unassigned"] }), phone: { screen: "lock" } }] },
    { title: "Assign the job to the recommended contractor", focus: "portal",
      caption: `The coordinator assigns the job. ${ctrName} is recommended: ${BEFORE_SCORE}% compliance, in the service area and 2 miles away.`,
      stages: [
        { now: "2026-11-10 09:11", ui: () => ({ route: { page: "jobs" }, modal: { type: "assign", step: 2, hh: HH, ctr: CTR, date: "2026-11-17", priority: "Standard", instructions: D.instructions, professional: D.professional }, highlight: ["as-ctr-" + CTR] }), phone: { screen: "lock" }, dur: 2600 },
        { now: "2026-11-10 09:12", ui: () => ({ route: { page: "jobs" }, modal: { type: "assign", step: 3, hh: HH, ctr: CTR, date: "2026-11-17", priority: "Standard", instructions: D.instructions, professional: D.professional }, highlight: ["as-confirm"] }) },
      ] },
    { title: "The contractor is notified on their phone", focus: "both",
      caption: "As soon as the job is assigned, the contractor gets a push notification from RadonSketch.",
      stages: [{ now: "2026-11-10 09:13", mutate: (S) => Ops.assign(S, JOB, CTR, { date: "2026-11-17", priority: "Standard", instructions: D.instructions, professional: D.professional, at: "2026-11-10 09:12" }),
        ui: () => ({ route: { page: "jobs" }, modal: { type: "assign", step: 3, hh: HH, ctr: CTR, date: "2026-11-17", priority: "Standard", success: JOB } }), phone: { screen: "lock", notif: "assigned" } }] },
    { title: "Project created automatically — job accepted", focus: "both",
      caption: "The project is already in RadonSketch with the household's details from the programme. The contractor accepts, and the portal's activity log shows Assigned → Accepted.",
      stages: [
        { now: "2026-11-10 09:15", ui: () => jobModal("activity"), phone: { screen: "projects" }, dur: 2200 },
        { now: "2026-11-10 09:41", mutate: (S) => Ops.accept(S, JOB, "2026-11-10 09:41"), ui: () => jobModal("activity", ["activity"]), phone: { screen: "project" } },
      ] },
    { title: "The contractor schedules the visit", focus: "both",
      caption: "The contractor picks Thursday 12 November, 8 AM–12 PM. The visit appears on the contractor's Schedule calendar in the portal.",
      stages: [
        { now: "2026-11-10 09:43", ui: () => ({ route: { page: "contractor", id: CTR }, ctrTab: "schedule" }), phone: { screen: "schedule" }, dur: 2400 },
        { now: "2026-11-10 09:44", mutate: (S) => Ops.schedule(S, JOB, D.visitDate, "08:00–12:00", "2026-11-10 09:44"), ui: () => ({ route: { page: "contractor", id: CTR }, ctrTab: "schedule", highlight: ["cal-" + JOB] }), phone: { screen: "scheduled" } },
      ] },
    { title: "On site: contractor checks in", focus: "both",
      caption: "On the day, the contractor checks in. Contractor Tracking shows them arriving at the household, and the map pin turns In Progress.",
      stages: [
        { now: "2026-11-12 08:05", ui: () => ({ route: { page: "map" }, map: { layer: "both", f: {}, applied: {}, sel: { type: "household", id: HH } } }), phone: { screen: "checkin" }, dur: 2200 },
        { now: "2026-11-12 08:06", mutate: (S) => Ops.checkIn(S, JOB, "2026-11-12 08:06", 0.02), ui: () => jobModal("tracking"), phone: { screen: "checkin" }, dur: 4600 },
        { now: "2026-11-12 08:07", ui: () => ({ route: { page: "map" }, map: { layer: "both", f: {}, applied: {}, sel: { type: "household", id: HH } } }), phone: { screen: "checkin" } },
      ] },
    { title: "Diagnostic completed", focus: "both",
      caption: "The contractor records the diagnostic: six test points with sub-slab pressure readings. The portal's activity log updates straight away.",
      stages: [{ now: "2026-11-12 09:19", mutate: (S) => Ops.diagnostic(S, JOB, "2026-11-12 09:18"), ui: () => jobModal("activity", ["activity"]), phone: { screen: "diag" } }] },
    { title: "Radon Builder: compliance warning, then fixed", focus: "both",
      caption: `Live ${C.standard} checks flag the vent: 8 ft from a window, minimum 10 ft. The contractor moves it, the check turns green, and the portal's live compliance updates.`,
      stages: [
        { now: "2026-11-12 10:05", mutate: (S) => Ops.design(S, JOB, "2026-11-12 10:03", true), ui: () => jobModal("details", ["live"]), phone: { screen: "builder", fixed: false }, dur: 2800 },
        { now: "2026-11-12 10:12", mutate: (S) => Ops.resolveWarning(S, JOB, "2026-11-12 10:12"), ui: () => jobModal("details", ["live"]), phone: { screen: "builder", fixed: true } },
      ] },
    { title: "Installation photos uploaded", focus: "both",
      caption: "The contractor uploads the installation photos (7 of the 8 required; the system label photo was missed) and checks out. The post-mitigation test is due within the programme timeframe.",
      stages: [
        { now: "2026-11-12 13:49", mutate: (S) => Ops.photos(S, JOB, "2026-11-12 13:48", 7), ui: () => jobModal("activity", ["activity"]), phone: { screen: "photos" }, dur: 2200 },
        { now: "2026-11-12 14:06", mutate: (S) => Ops.checkOut(S, JOB, "2026-11-12 14:05"), ui: () => jobModal("activity", ["activity"]), phone: { screen: "photos" } },
      ] },
    { title: "Report generated and submitted", focus: "both",
      caption: "After the 48-hour post-mitigation test (1.6 pCi/L), RadonSketch generates the report. It syncs straight into Reports → Pending Review, marked “Synced from RadonSketch”.",
      stages: [
        { now: "2026-11-14 14:20", mutate: (S) => { const j = Q.job(S, JOB); j.post = D.post; Ops.event(j, "2026-11-14 14:15", "contractor", "activity", "Post-mitigation reading recorded", `${D.post} pCi/L after a 48-hour test (${Math.round((1 - D.post / Q.hh(S, HH).pre) * 100)}% reduction).`); }, ui: () => jobModal("details"), phone: { screen: "postreading" }, dur: 2200 },
        { now: "2026-11-14 16:18", ui: () => jobModal("details"), phone: { screen: "report" }, dur: 2000 },
        { now: "2026-11-14 16:20", mutate: (S) => Ops.submit(S, JOB, "2026-11-14 16:20", checksWith(["label"])), ui: () => ({ route: { page: "reports" }, reportTab: "pending", highlight: ["row-" + JOB, "nav-reports"] }), phone: { screen: "synced" } },
      ] },
    { title: "Reviewer requests corrections", focus: "portal",
      caption: "A reviewer opens the report: 9 of 10 checks passed. They request corrections for the missing system label photo, and the contractor is notified.",
      stages: [
        { now: "2026-11-16 09:12", ui: () => ({ route: { page: "report", id: JOB, v: 1 }, highlight: ["rv-sum"] }), phone: { screen: "projects" }, dur: 2600 },
        { now: "2026-11-16 09:14", ui: () => ({ route: { page: "report", id: JOB, v: 1 }, modal: { type: "corr", jobId: JOB, keys: ["label"], comment: COMMENT }, highlight: ["corr-send"] }), phone: { screen: "projects" }, dur: 2600 },
        { now: "2026-11-16 09:15", mutate: (S) => Ops.requestCorrections(S, JOB, ["label"], COMMENT, "2026-11-16 09:15", "Sam Whitfield"), ui: () => ({ route: { page: "report", id: JOB, v: 1 }, toasts: [{ text: `Corrections requested — ${ctrName} has been notified in RadonSketch.`, kind: "warn" }] }), phone: { screen: "projects" } },
      ] },
    { title: "Contractor fixes and resubmits (v2)", focus: "app",
      caption: "The contractor sees the correction request, adds the system label photo and resubmits. Version 2 syncs to the portal for review.",
      stages: [
        { now: "2026-11-16 09:16", ui: () => ({ route: { page: "report", id: JOB, v: 1 } }), phone: { screen: "lock", notif: "corrections" }, dur: 2200 },
        { now: "2026-11-16 10:58", ui: () => ({ route: { page: "report", id: JOB, v: 1 } }), phone: { screen: "corrections", labelAdded: true }, dur: 2400 },
        { now: "2026-11-16 11:02", mutate: (S) => Ops.submit(S, JOB, "2026-11-16 11:02", checksWith([])), ui: () => ({ route: { page: "reports" }, reportTab: "pending", highlight: ["row-" + JOB] }), phone: { screen: "synced" } },
      ] },
    { title: "Report approved — job Approved", focus: "portal",
      caption: "The reviewer checks v2 (10 of 10) and approves it. The job moves to Approved and its map pin turns green.",
      stages: [
        { now: "2026-11-16 14:28", ui: () => ({ route: { page: "report", id: JOB, v: 2 }, highlight: ["approve", "rv-sum"] }), phone: { screen: "synced" }, dur: 2600 },
        { now: "2026-11-16 14:30", mutate: (S) => Ops.approve(S, JOB, "2026-11-16 14:30", "Sam Whitfield"), ui: () => ({ route: { page: "map" }, map: { layer: "both", f: {}, applied: {}, sel: { type: "household", id: HH } }, toasts: [{ text: `Report approved — ${hhName} is now Approved.` }] }), phone: { screen: "lock", notif: "approved" } },
      ] },
    { title: "Dashboard and compliance score update", focus: "portal",
      caption: `Dashboard counters update automatically, and ${ctrName}'s compliance score rises from ${BEFORE_SCORE}% to 95% with the approved report.`,
      stages: [
        { now: "2026-11-16 14:35", ui: (S) => { const done = (X) => X.jobs.filter((j) => (j.status === "approved" || j.status === "closed") && j.approvedAt && j.approvedAt.startsWith("2026-11")).length; return { route: { page: "dashboard" }, highlight: ["kpi-completed", "avgred", "totals"], toasts: [{ text: `Dashboard updated — Completed this month ${done(window.Store.build())} → ${done(S)}; average reduction and programme totals refreshed.` }] }; }, phone: { screen: "projects" }, dur: 3200 },
        { now: "2026-11-16 14:36", ui: (S) => ({ route: { page: "contractor", id: CTR }, ctrTab: "details", highlight: ["ctr-gauge"], toasts: [{ text: `${ctrName} compliance score ${BEFORE_SCORE}% → ${Q.score(S, Q.ctr(S, CTR))}%.` }] }), phone: { screen: "projects" } },
      ] },
  ];

  /* ---------- engine ---------- */
  let cur = 0, stage = 0, epoch = 0, lastPhone = null;
  const $ = (s) => document.querySelector(s);
  function stateAt(n, k) {
    const S = window.Store.build();
    for (let i = 0; i <= n; i++) {
      const last = i < n ? STEPS[i].stages.length - 1 : k;
      for (let j = 0; j <= last; j++) { const st = STEPS[i].stages[j]; S.now = st.now; advanceWorld(S); if (st.mutate) st.mutate(S); }
    }
    return S;
  }
  const inherit = (n, k, key) => { for (let j = k; j >= 0; j--) if (STEPS[n].stages[j][key] !== undefined) return STEPS[n].stages[j][key]; return undefined; };
  function pathOf(ui) {
    const r = ui.route || { page: "dashboard" };
    return { dashboard: "/dashboard", jobs: "/jobs", map: "/map", reports: "/reports", contractor: `/contractors/${r.id}`, report: `/reports/${r.id}/v${r.v}` }[r.page] || "/" + r.page;
  }
  function show(n, k) {
    const my = ++epoch;
    cur = n; stage = k;
    const S = stateAt(n, k), step = STEPS[n];
    const ui = Object.assign({ highlight: [] }, inherit(n, k, "ui")(S));
    window.Portal.reset(S, ui);
    window.Portal.render();
    $("#url").innerHTML = `<b>${C.portal.url}</b>${pathOf(ui)}`;
    requestAnimationFrame(() => {
      const target = window.Portal.root.querySelector(".modal .hl") || window.Portal.root.querySelector(".hl");
      if (target && !target.closest(".sb")) {
        const id = "hl-scroll-" + Math.random().toString(36).slice(2, 7);
        target.setAttribute("data-scroll-target", id);
        window.Portal.scrollTo(`[data-scroll-target="${id}"]`, true);
      }
    });
    const ps = inherit(n, k, "phone");
    const sig = JSON.stringify(ps);
    $("#phone-screen").innerHTML = window.Phone.render(S, ps);
    if (sig === lastPhone) { const b = $("#phone-screen .pbody"); if (b) b.style.animation = "none"; }
    lastPhone = sig;
    $("#wf-portal").classList.toggle("dim", step.focus === "app");
    $("#wf-phone").classList.toggle("dim", step.focus === "portal");
    $("#wf-count").textContent = `Step ${n + 1} of ${STEPS.length}${step.stages.length > 1 ? ` · ${k + 1}/${step.stages.length}` : ""}`;
    $("#wf-title").textContent = step.title;
    $("#wf-text").textContent = step.caption;
    $("#wf-prev").disabled = n === 0;
    $("#wf-next").disabled = n === STEPS.length - 1 && k === step.stages.length - 1;
    $("#wf-next").innerHTML = n === STEPS.length - 1 ? "Journey complete" : "Next step &rarr;";
    $("#wf-dots").innerHTML = STEPS.map((s, i) => `<button class="${i === n ? "on" : i < n ? "past" : ""}" data-step="${i}" title="${s.title}"></button>`).join("");
    if (k < step.stages.length - 1) setTimeout(() => { if (my === epoch) show(n, k + 1); }, step.stages[k].dur || 2400);
  }
  const next = () => { if (cur < STEPS.length - 1) show(cur + 1, 0); else if (stage < STEPS[cur].stages.length - 1) show(cur, STEPS[cur].stages.length - 1); };
  const prev = () => { if (cur > 0) show(cur - 1, 0); };

  function fit() { const s = Math.min(innerWidth / 1440, innerHeight / 900); $("#stage").style.transform = `translate(-50%, -50%) scale(${s})`; }
  window.addEventListener("resize", fit);
  document.addEventListener("DOMContentLoaded", () => {
    Object.entries(C.colors).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
    $("#wf-disclaimer").textContent = C.disclaimer;
    $("#wf-sub").textContent = `${C.program.name} · ${C.portal.name} + RadonSketch app`;
    window.Portal.mount($("#portal"), { embedded: true, store: window.Store.build(), route: { page: "dashboard" } });
    $("#wf-next").addEventListener("click", next);
    $("#wf-prev").addEventListener("click", prev);
    $("#wf-reset").addEventListener("click", () => show(0, 0));
    $("#wf-dots").addEventListener("click", (e) => { const b = e.target.closest("[data-step]"); if (b) show(+b.dataset.step, 0); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
    });
    fit();
    show(0, 0);
  });
  window.Workflow = { show, STEPS };
})();

</script>
