  <style>
/* ===========================================================================
   LIRMA Installation Tracker — shared design tokens and components
   Colours: Colorado palette (overridable from CONFIG.colors in data.js)
   =========================================================================== */
:root {
  --co-navy: #13294B; --co-navy-2: #1D3A63; --co-blue: #1D5FAD; --co-blue-dark: #164B8A; --co-blue-soft: #E8F0FA;
  --co-gold: #F2B705; --co-red: #C8102E;
  --bg: #F3F5F8; --surface: #FFFFFF; --line: #E2E7EE; --line-2: #EEF1F5;
  --ink: #18212F; --ink-2: #485467; --muted: #6E7A8C;
  --ok: #2E9E5B; --ok-soft: #E3F4EA; --warn: #C27A00; --warn-soft: #FDF1DB; --bad: #D64545; --bad-soft: #FCE7E7;
  --poor: #D64545; --good: #E0A100; --great: #2E9E5B;
  --rs-orange: #E26A1B; --rs-orange-dk: #C9580E; --rs-orange-soft: #FCEBDD; --rs-cream: #FDF8F1; --rs-ink: #1A1410; --rs-muted: #8A7F75; --rs-line: #EEE6DC;
  --rs-mint: #BFE7D4; --rs-peach: #F8D9A9;
  --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; font-size: 14px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button[disabled] { cursor: not-allowed; opacity: .5; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p, dl, dd { margin: 0; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; letter-spacing: -.01em; }
.muted { color: var(--muted); } .bad { color: var(--bad) !important; } .hi { color: var(--warn); }
.sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-weight: 400; }
.link { color: var(--co-blue); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slideL { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes pulseHl { 0%, 100% { box-shadow: 0 0 0 0 rgba(242, 183, 5, 0); } 50% { box-shadow: 0 0 0 6px rgba(242, 183, 5, .45); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- portal root ---------- */
.ptl { position: relative; height: 100%; overflow: hidden; background: var(--bg); }
.app { display: grid; grid-template-columns: 252px 1fr; height: 100%; }
.disclaimer { position: absolute; left: 12px; bottom: 10px; width: 228px; z-index: 60; display: flex; align-items: flex-start; gap: 6px; font-size: 10.5px; line-height: 1.35; font-weight: 600; color: #C9D3E2; background: rgba(255, 255, 255, .07); border: 1px dashed rgba(255, 255, 255, .35); padding: 5px 9px; border-radius: 8px; pointer-events: none; }
.disclaimer .ic { margin-top: 1px; }
.ptl:has(.login) .disclaimer { left: 50%; transform: translateX(-50%); width: auto; bottom: 16px; border-radius: 999px; }

/* sidebar */
.sb { background: var(--co-navy); color: #D5DEEA; display: flex; flex-direction: column; min-height: 0; }
.sb-brand { display: grid; gap: 10px; padding: 14px 14px 14px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.sb-plate { background: #fff; border-radius: 8px; padding: 8px 10px; display: flex; justify-content: center; }
.sb-name { padding: 0 4px; }
.sb-name b { display: block; color: #fff; font-size: 14.5px; line-height: 1.2; }
.sb-name span { display: block; font-size: 11.5px; color: var(--co-gold); font-weight: 600; margin-top: 3px; letter-spacing: .01em; }
.sb-nav { padding: 12px 10px; display: grid; gap: 2px; overflow-y: auto; }
.sb-nav button { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #C9D3E2; transition: background .15s; }
.sb-nav button:hover { background: var(--co-navy-2); color: #fff; }
.sb-nav button.on { background: rgba(255, 255, 255, .1); color: #fff; font-weight: 600; }
.sb-nav button.on::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--co-gold); }
.sb-nav em { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; background: var(--co-gold); color: var(--co-navy); padding: 1px 7px; border-radius: 999px; }
.sb-foot { margin-top: auto; padding: 14px 18px 64px; border-top: 1px solid rgba(255, 255, 255, .08); display: grid; gap: 6px; }
.sb-foot > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: #8FA0B8; }
.sb-foot small { font-size: 11px; color: #8FA0B8; }

/* logos (real file or labelled placeholder) */
.logo { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.logo .logo-ph { display: none; }
.logo.missing .logo-ph { display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; height: 100%; border: 1.5px dashed currentColor; border-radius: 8px; font-size: 9.5px; font-weight: 700; line-height: 1.2; padding: 4px; text-transform: uppercase; letter-spacing: .03em; opacity: .85; }
.sb-logo { width: 100%; height: 32px; color: var(--co-navy); }
.sb-rs { width: auto; height: auto; color: #fff; }
.login-logo { width: 330px; height: 54px; color: var(--co-blue); margin: 4px auto 14px; }
.login-rs { width: auto; height: auto; color: var(--ink); }
.logo.sm { width: 200px; height: 32px; color: var(--co-navy); }
.integ-logo { width: auto; height: auto; color: var(--ink); }

/* top bar */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tb { flex: none; display: flex; align-items: center; height: 60px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); gap: 16px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); min-width: 0; }
.crumbs button { color: var(--co-blue); font-weight: 500; }
.crumbs b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-date { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-right: 8px; white-space: nowrap; }
.tb-ic { position: relative; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
.tb-ic:hover { background: var(--bg); }
.tb-ic em { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--co-red); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; border: 2px solid #fff; }
.tb-user { position: relative; }
.tb-user > button { display: flex; align-items: center; gap: 10px; padding: 5px 8px 5px 5px; border-radius: 10px; }
.tb-user > button:hover { background: var(--bg); }
.av { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--co-blue-soft); color: var(--co-blue); display: inline-grid; place-items: center; font-weight: 700; font-size: 12.5px; }
.av.sm { width: 28px; height: 28px; font-size: 11px; } .av.sq { border-radius: 9px; } .av.xl { width: 64px; height: 64px; font-size: 22px; border-radius: 16px; background: var(--co-navy); color: #fff; }
.tu-n b { display: block; font-size: 13px; line-height: 1.2; } .tu-n small { display: block; font-size: 11.5px; color: var(--muted); }
.menu { position: absolute; right: 0; top: 48px; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 30px -10px rgba(16, 24, 40, .25); padding: 6px; min-width: 180px; animation: rise .15s var(--ease); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; font-size: 13.5px; }
.menu button:hover { background: var(--bg); }

/* content */
.content { flex: 1; overflow-y: auto; padding: 22px 28px 60px; animation: fadeIn .2s var(--ease); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.page-head.tight { margin-bottom: 12px; }
.page-head h1 { font-size: 24px; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
.btns { display: flex; gap: 8px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--co-blue); font-weight: 600; font-size: 13px; margin-bottom: 10px; }
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.grid.tight { gap: 12px; margin-bottom: 12px; }
.g-21 { grid-template-columns: 2fr 1fr; } .g-12 { grid-template-columns: 1fr 1fr; } .g-11 { grid-template-columns: 1fr 1fr; } .g-3, .g-111 { grid-template-columns: repeat(3, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card.soft { background: #F8FAFC; box-shadow: none; }
.card.center { display: grid; justify-items: center; align-content: center; gap: 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 0 12px; }
.card-h h3 { font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
.card-h h3 small { font-size: 12px; color: var(--muted); font-weight: 500; }
.side-h { font-size: 13px; margin-bottom: 10px; }
.empty { display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--muted); padding: 26px 16px; font-size: 13px; }
.empty b { color: var(--ink-2); }
.empty.sm { padding: 10px; }
.hl { animation: pulseHl 1.6s ease-in-out infinite; outline: 2px solid var(--co-gold); outline-offset: 2px; border-radius: 10px; }
tr.hl { outline-offset: -2px; background: #FFF8E1 !important; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 13.5px; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn.primary { background: var(--co-blue); color: #fff; } .btn.primary:hover { background: var(--co-blue-dark); }
.btn.ghost { background: #fff; border: 1px solid #CFD7E2; color: var(--ink); } .btn.ghost:hover { border-color: #9EABBD; }
.btn.success { background: var(--ok); color: #fff; } .btn.warn { background: #fff; border: 1.5px solid var(--warn); color: #9A5F00; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; } .btn.xs { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.block { display: flex; width: 100%; }
.seg { display: inline-flex; background: #E9EEF4; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { padding: 6px 13px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button.on { background: #fff; color: var(--co-blue); box-shadow: var(--shadow); }
.seg.sm button { padding: 4px 10px; font-size: 12px; } .seg.mb { margin-bottom: 12px; }

/* badges */
.st-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--c) 82%, #000); background: color-mix(in srgb, var(--c) 13%, #fff); white-space: nowrap; }
.st-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.score-badge { display: inline-flex; padding: 2px 9px; border-radius: 6px; font-weight: 700; font-size: 12.5px; }
.score-badge.big { font-size: 14px; padding: 3px 10px; }
.b-poor { background: var(--bad-soft); color: #B22B2B; } .b-good { background: #FFF4D6; color: #8A6100; } .b-great { background: var(--ok-soft); color: #1F7A45; } .b-none { background: #EEF1F5; color: var(--muted); }
.band-pill { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 5px; }
.ctr-st { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.ctr-st.active { background: var(--ok-soft); color: #1F7A45; } .ctr-st.suspended { background: var(--bad-soft); color: #B22B2B; } .ctr-st.pending { background: #FFF4D6; color: #8A6100; }
.cred { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.cred.valid { background: var(--ok-soft); color: #1F7A45; } .cred.soon { background: #FFF4D6; color: #8A6100; } .cred.expired { background: var(--bad-soft); color: #B22B2B; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #EEF2F7; color: var(--ink-2); }
.sync-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--rs-orange-dk); background: var(--rs-orange-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.sync-badge.sm { font-size: 10.5px; padding: 1px 6px; margin-top: 3px; display: inline-flex; }
td .sync-badge.sm { display: flex; width: max-content; }
.ver { font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #EEF2F7; color: var(--ink-2); }
.rv-st { display: inline-flex; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.rv-st.pending { background: #EAEAFB; color: #4545B8; } .rv-st.corr { background: var(--bad-soft); color: #B22B2B; } .rv-st.ok { background: var(--ok-soft); color: #1F7A45; }
.comp { font-weight: 700; font-size: 12.5px; padding: 2px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.comp.ok { background: var(--ok-soft); color: #1F7A45; } .comp.warn { background: #FFF4D6; color: #8A6100; } .comp.bad { background: var(--bad-soft); color: #B22B2B; }
.comp.live { background: #EEF2F7; color: var(--ink-2); font-weight: 600; }
.role { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--co-blue-soft); color: var(--co-blue-dark); }
.onsite { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #9A5F00; background: var(--warn-soft); padding: 2px 8px; border-radius: 999px; }

/* definition lists */
.dl { display: grid; grid-template-columns: minmax(120px, 40%) 1fr; gap: 9px 14px; font-size: 13.5px; }
.dl dt { color: var(--muted); } .dl dd { font-weight: 500; } .dl dd small { color: var(--muted); font-weight: 400; }

/* dashboard */
.period { display: flex; align-items: center; gap: 4px; background: #E9EEF4; border-radius: 10px; padding: 3px; }
.period button { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.period button.on { background: #fff; color: var(--co-blue); box-shadow: var(--shadow); }
.period input { height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; font-size: 12.5px; background: #fff; }
.period span { font-size: 12px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "ic l" "v v" "s s"; gap: 4px 10px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.kpi:hover { border-color: #A8B7CC; transform: translateY(-1px); }
.kpi-ic { grid-area: ic; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--co-blue-soft); color: var(--co-blue); }
.kpi-l { grid-area: l; font-size: 12.5px; font-weight: 600; color: var(--ink-2); line-height: 1.25; }
.kpi b { grid-area: v; font-size: 28px; letter-spacing: -.02em; margin-top: 6px; }
.kpi small { grid-area: s; color: var(--muted); font-size: 11.5px; }
.k-corr .kpi-ic, .k-low .kpi-ic { background: var(--bad-soft); color: var(--bad); } .k-awaiting .kpi-ic { background: #EAEAFB; color: #4545B8; } .k-ongoing .kpi-ic { background: var(--warn-soft); color: var(--warn); } .k-completed .kpi-ic { background: var(--ok-soft); color: var(--ok); }
.attn { display: grid; gap: 6px; }
.attn-i { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line-2); background: #FBFCFD; transition: background .15s; }
.attn-i:hover { background: #F2F6FB; }
.attn-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.t-blue .attn-ic { background: var(--co-blue-soft); color: var(--co-blue); } .t-amber .attn-ic { background: var(--warn-soft); color: var(--warn); } .t-red .attn-ic { background: var(--bad-soft); color: var(--bad); }
.attn-t { flex: 1; min-width: 0; } .attn-t b { display: block; font-size: 13.5px; } .attn-t small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attn-i em { font-style: normal; font-weight: 800; font-size: 16px; min-width: 32px; text-align: center; padding: 2px 8px; border-radius: 8px; background: #EEF2F7; }
.t-red em { background: var(--bad-soft); color: var(--bad); } .t-amber em { background: var(--warn-soft); color: var(--warn); } .t-blue em { background: var(--co-blue-soft); color: var(--co-blue); }
.attn-i.zero { opacity: .55; } .attn-i.zero em { background: #EEF2F7; color: var(--muted); }
.today-list { display: grid; gap: 6px; }
.td-i { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line-2); }
.td-i:hover { background: #F6F8FB; }
.td-t { width: 64px; font-weight: 700; font-size: 13px; color: var(--co-blue); }
.td-b { flex: 1; min-width: 0; } .td-b b { display: block; font-size: 13.5px; } .td-b small { color: var(--muted); font-size: 12px; }
.mini-map { height: 250px; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); }
.mini-map.short { height: 230px; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; } .legend i { width: 9px; height: 9px; border-radius: 50%; }
.chart-bars { display: flex; align-items: flex-end; gap: 4px; padding-top: 18px; }
.cb { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; padding-bottom: 20px; }
.cb i { display: block; width: 70%; max-width: 34px; border-radius: 5px 5px 0 0; min-height: 2px; transition: height .3s var(--ease); }
.cb-v { font-size: 11.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 3px; }
.cb-l { position: absolute; bottom: 0; font-size: 11px; color: var(--muted); white-space: nowrap; }
.chart-hbars { display: grid; gap: 7px; }
.hb { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; font-size: 12.5px; text-align: left; padding: 2px 0; }
.hb-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.hb-t { height: 12px; background: #EEF2F7; border-radius: 6px; overflow: hidden; } .hb-t i { display: block; height: 100%; border-radius: 6px; }
.hb b { text-align: right; }
button.hb:hover .hb-l { color: var(--co-blue); }
.big-num { text-align: center; padding: 6px 0 14px; border-bottom: 1px solid var(--line-2); }
.big-num b { display: block; font-size: 46px; letter-spacing: -.03em; color: var(--ok); line-height: 1.05; }
.big-num span { font-weight: 600; color: var(--ink-2); } .big-num small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.totals { display: grid; gap: 10px; margin-top: 12px; }

/* gauge */

.g-val { font-size: 25px; font-weight: 800; text-anchor: middle; fill: var(--ink); }
.g-band { margin-top: -2px; font-size: 12px; font-weight: 800; letter-spacing: .1em; padding: 3px 12px; border-radius: 999px; }
.g-scale { display: flex; gap: 8px; margin-top: 8px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }

/* tables */
.tbl-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.tbl-tools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #FBFCFD; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 11px; border: 1px solid #CFD7E2; border-radius: 8px; background: #fff; min-width: 230px; color: var(--muted); }
.search input { border: 0; outline: 0; flex: 1; background: none; color: var(--ink); min-width: 0; }
.search.wide { width: 100%; }
.flt { display: grid; gap: 3px; } .flt span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.tbl-extra { margin-left: auto; }

.special-chip button { margin-left: 4px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; } .special-chip button:hover { background: #F7E8BC; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fff; }
.tbl th.sortable { cursor: pointer; } .tbl th.sortable:hover { color: var(--ink); }
.srt { display: inline-flex; margin-left: 4px; opacity: .35; vertical-align: -1px; } .srt.asc, .srt.desc { opacity: 1; color: var(--co-blue); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl td .mono, .tbl td.mono { white-space: nowrap; }
.tbl td b { font-weight: 600; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr.clickable { cursor: pointer; } .tbl tr.clickable:hover td { background: #F6F9FD; }
.tbl .num { text-align: right; } .tbl .right { text-align: right; }
.tbl.mini td, .tbl.mini th { padding: 9px 8px; }
.tbl-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); background: #FBFCFD; }
.pager { display: flex; gap: 4px; }
.pager button { min-width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 600; display: grid; place-items: center; }
.pager button.on { background: var(--co-blue); border-color: var(--co-blue); color: #fff; }
.ctr-cell { display: flex; align-items: center; gap: 10px; }

/* tabs */

.tabs button { padding: 10px 14px; font-weight: 600; font-size: 13.5px; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }

.tabs button.on { color: var(--co-blue); border-bottom-color: var(--co-blue); }

.tab-body { animation: fadeIn .2s var(--ease); }

/* map view */
.map-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.map-filters label { display: grid; gap: 3px; } .map-filters label span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.map-filters select { height: 38px; border: 1px solid #CFD7E2; border-radius: 8px; padding: 0 6px; background: #fff; width: 136px; }

.map-filters .btn { margin-left: auto; } .map-filters .btn + .btn { margin-left: 0; }
.map-area { display: grid; grid-template-columns: 1fr; gap: 12px; height: calc(100vh - 262px); min-height: 460px; }
.map-area.with-panel { grid-template-columns: 1fr 360px; }

.map-wrap { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #E5E9EF; }
.map-slot, .co-map { width: 100%; height: 100%; }
.co-map { position: relative; z-index: 0; isolation: isolate; }
.map-wrap, .mini-map, .track-map { isolation: isolate; }
.map-legend { position: absolute; left: 12px; bottom: 12px; z-index: 500; display: grid; gap: 3px; background: rgba(255, 255, 255, .95); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 11.5px; box-shadow: var(--shadow); }

.map-legend span { display: flex; align-items: center; gap: 6px; } .map-legend i { width: 10px; height: 10px; border-radius: 50%; }
.map-legend .lg-ctr i { background: #13294B; border: 2px solid #fff; box-shadow: 0 0 0 2px #E08A00; }
.map-count { position: absolute; left: 12px; top: 12px; z-index: 500; background: rgba(255, 255, 255, .95); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow); }
.county-strip { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 500; display: flex; align-items: center; gap: 14px; background: var(--co-navy); color: #fff; padding: 8px 10px 8px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .5); white-space: nowrap; animation: rise .2s var(--ease); }
.county-strip em { font-style: normal; font-weight: 800; color: var(--co-gold); }
.county-strip button { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: rgba(255, 255, 255, .12); }
.map-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; overflow-y: auto; display: grid; gap: 14px; align-content: start; animation: slideL .22s var(--ease); }
.mp-head { display: flex; justify-content: space-between; gap: 10px; }
.mp-head small { color: var(--muted); font-size: 11.5px; } .mp-head h3 { font-size: 18px; margin: 2px 0 6px; }
.x { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; } .x:hover { background: var(--bg); color: var(--ink); }
.mp-read, .readings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mp-read div, .readings div { background: #F6F8FB; border-radius: 9px; padding: 10px 12px; }
.mp-read span, .readings span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.mp-read b, .readings b { font-size: 22px; letter-spacing: -.02em; } .mp-read small, .readings small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.mp-ctr { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.mp-ctr.none { color: var(--muted); font-size: 13px; }
.mp-ctr-h { display: flex; align-items: center; gap: 10px; } .mp-ctr-h div { flex: 1; } .mp-ctr-h b { display: block; font-size: 13.5px; } .mp-ctr-h small { color: var(--muted); }
.mp-gauge { display: flex; justify-content: center; }
.mp-h { font-size: 13px; display: flex; align-items: center; gap: 6px; } .mp-h em { font-style: normal; font-size: 11px; background: #EEF2F7; padding: 1px 7px; border-radius: 999px; }
.mp-jobs { display: grid; gap: 6px; }
.mp-jobs button { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; text-align: left; }
.mp-jobs button:hover { background: #F6F9FD; } .mp-jobs b { display: block; font-size: 13px; } .mp-jobs small { font-size: 11.5px; color: var(--muted); }

/* CoMap — Leaflet */
.co-map .leaflet-container, .co-map.leaflet-container { font-family: var(--font); background: #E5E9EF; }
.co-leaf-icon { background: none; border: 0; }

.co-ctr-pin { width: 30px; height: 30px; border-radius: 50%; background: #13294B; border: 2.5px solid #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
.co-ctr-pin.active { box-shadow: 0 0 0 3px #E08A00, 0 2px 6px rgba(0, 0, 0, .35); }
.co-ctr-pin.sel { transform: scale(1.18); box-shadow: 0 0 0 3px var(--co-gold), 0 2px 8px rgba(0, 0, 0, .4); }
.co-cluster { width: 36px; height: 36px; border-radius: 50%; background: rgba(19, 41, 75, .25); display: grid; place-items: center; }
.co-cluster span { width: 28px; height: 28px; border-radius: 50%; background: #13294B; color: #fff; font-weight: 700; font-size: 12.5px; display: grid; place-items: center; border: 2px solid #fff; }
.co-county-lbl span { display: block; text-align: center; font-size: 9.5px; font-weight: 700; color: #3E4C62; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
.co-reset { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; background: #fff; border: 2px solid rgba(0, 0, 0, .2); border-radius: 6px; color: #13294B; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: none; }
.co-reset:hover { background: #F2F5F9; }
.co-live-dot { width: 22px; height: 22px; border-radius: 50%; background: #1D5FAD; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(29, 95, 173, .5); animation: livePulse 1.6s infinite; }
@keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(29, 95, 173, .55); } 100% { box-shadow: 0 0 0 16px rgba(29, 95, 173, 0); } }
.leaflet-control-attribution { font-size: 10.5px; }
/* CoMap — offline SVG fallback */
.co-svgmap { position: relative; background: #DCE1E8; user-select: none; touch-action: none; }
.co-svg { width: 100%; height: 100%; display: block; cursor: grab; }
.co-svg:active { cursor: grabbing; }
.co-svg-out { fill: #B9C0CA; }
.co-svg-state { fill: #F5F2EA; }

.co-svg-outline { fill: none; stroke: #13294B; stroke-width: var(--sw2, 2); }
.co-svg-labels text { font-size: var(--lbl, 7px); font-weight: 700; fill: #556377; text-anchor: middle; text-transform: uppercase; letter-spacing: .02em; pointer-events: none; }
.co-svg-radius { pointer-events: none; }
.co-svg-pin { cursor: pointer; }
.co-svg-pin.cluster .co-svg-cl-o { fill: rgba(19, 41, 75, .25); } .co-svg-pin.cluster .co-svg-cl-i { fill: #13294B; stroke: #fff; stroke-width: 2; }
.co-svg-pin.cluster text { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; }
.co-svg-ctr { fill: #13294B; stroke: #fff; stroke-width: 2.5; } .co-svg-pin.ctr.active .co-svg-ctr { stroke: #E08A00; stroke-width: 4; }
.co-svg-ctrls { position: absolute; top: 10px; right: 10px; z-index: 5; display: grid; gap: 6px; justify-items: end; }
.co-svg-ctrls button { width: 34px; height: 34px; border-radius: 6px; background: #fff; border: 2px solid rgba(0, 0, 0, .2); font-size: 18px; font-weight: 700; color: #13294B; display: grid; place-items: center; }
.co-svg-ctrls button.co-reset { width: auto; display: inline-flex; font-size: 12px; }
.co-svg-attr { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: #4A5568; background: rgba(255, 255, 255, .8); padding: 1px 6px; border-radius: 4px; }

/* plan drawings */

.pl-tag { fill: #fff; stroke: #AFC4E6; stroke-width: 1.2; } .pl-tp .pl-tag-t { font-size: 9px; font-weight: 700; fill: #2F63B7; }

.pl-fan circle { fill: #1A1410; } .pl-fan path { stroke: #fff; stroke-width: 2; transform: rotate(45deg); }
.pl-vent circle { fill: #2B8C9A; stroke: #fff; stroke-width: 2; } .pl-vent path { fill: none; stroke: #fff; stroke-width: 1.8; }
.pl-r-warn { fill: rgba(217, 142, 4, .08); stroke: #D98E04; stroke-width: 1.5; stroke-dasharray: 5 4; }

.pl-lbl { font-size: 9.5px; font-weight: 700; fill: #4A4038; }
.pl-scale path { stroke: #9A8E83; stroke-width: 1.5; fill: none; } .pl-scale text { font-size: 9px; fill: #9A8E83; font-weight: 600; }

/* report document */
.rdoc { background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 24px -12px rgba(16, 24, 40, .35); padding: 26px 30px; display: grid; gap: 18px; font-size: 13px; }
.rd-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 3px solid var(--co-navy); }
.rd-ttl { flex: 1; } .rd-ttl b { display: block; font-size: 16px; color: var(--co-navy); } .rd-ttl span { font-size: 12px; color: var(--muted); }
.rd-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.rd-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 18px; }
.rd-meta span, .rd-read span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.rd-meta b { display: block; font-size: 13.5px; } .rd-meta small { display: block; color: var(--muted); font-size: 11.5px; }
.rd-read { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rd-read div { background: #F6F8FB; border-radius: 8px; padding: 10px 14px; }
.rd-read b { font-size: 26px; letter-spacing: -.02em; } .rd-read small { display: block; font-size: 11.5px; color: var(--muted); }
.rd-read .red b { color: var(--ok); } .rd-read .red.bad b { color: var(--bad); }
.rdoc h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--co-navy); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rd-std { font-size: 11px; text-transform: none; letter-spacing: 0; background: var(--co-blue-soft); color: var(--co-blue-dark); padding: 2px 8px; border-radius: 6px; }
.rd-res { margin-left: auto; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.rd-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.rd-two section { border: 1px solid var(--line-2); border-radius: 8px; padding: 10px; }
.rd-cap { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.rd-checks { width: 100%; border-collapse: collapse; }
.rd-checks td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.rd-checks td:first-child { width: 24px; color: var(--muted); font-size: 12px; } .rd-checks td:nth-child(2) { width: 26px; }
.rd-checks b { display: block; font-size: 13px; font-weight: 600; } .rd-checks small { color: var(--muted); font-size: 11.5px; }
.rd-checks .rc-st { text-align: right; font-weight: 700; font-size: 12px; }
.rd-checks tr.pass .ic, .rd-checks tr.pass .rc-st { color: var(--ok); } .rd-checks tr.warn .ic, .rd-checks tr.warn .rc-st { color: var(--warn); }
.rd-checks tr.fail { background: #FFF6F6; } .rd-checks tr.fail .ic, .rd-checks tr.fail .rc-st { color: var(--bad); } .rd-checks tr.pending .rc-st { color: var(--muted); }
.ph-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ph-tile { display: grid; gap: 5px; }
.ph-img { position: relative; aspect-ratio: 3 / 2; border-radius: 6px; overflow: hidden; background: #DDE2E8; }
.ph-img svg { width: 100%; height: 100%; display: block; }
.ph-n { position: absolute; left: 6px; bottom: 5px; font-size: 9.5px; color: #fff; background: rgba(0, 0, 0, .45); padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; }
.ph-cap { font-size: 11.5px; color: var(--ink-2); font-weight: 500; }
.ph-tile.missing .ph-img { display: grid; place-items: center; align-content: center; gap: 4px; background: #FFF6F6; border: 1.5px dashed var(--bad); color: var(--bad); font-size: 11px; font-weight: 700; }
.ph-tile.missing .ph-cap { color: var(--bad); }
.rd-bom { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.rd-bom th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.rd-bom td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); } .rd-bom td:last-child, .rd-bom th:last-child { text-align: right; }
.rd-bom .tot td { font-weight: 700; border-bottom: 0; }
.rd-sign { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.rd-sign span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.rd-sign b { display: block; font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 22px; font-weight: 400; color: var(--co-navy); }
.rd-sign small { color: var(--muted); font-size: 11.5px; } .rd-gen { font-size: 11px; color: var(--muted); }

/* report viewer */
.rv-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
.rv-side { position: sticky; top: 0; display: grid; gap: 12px; }
.rv-side .card { display: grid; gap: 10px; } .rv-side h3 { font-size: 18px; }
.rv-vers { display: flex; gap: 6px; }
.rv-vers button { flex: 1; padding: 6px; border: 1px solid var(--line); border-radius: 8px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; display: grid; gap: 1px; justify-items: center; }
.rv-vers button small { font-family: var(--font); font-weight: 500; font-size: 11px; color: var(--muted); }
.rv-vers button.on { border-color: var(--co-blue); background: var(--co-blue-soft); color: var(--co-blue); }

/* ===========================================================================

   =========================================================================== */

/* Pop-ups: always fit the window; header, tabs and footer stay put, only the body scrolls */

.modal { max-height: 100%; min-height: 0; overflow: hidden; }
.m-job { height: min(820px, 100%); }
.m-head, .modal .tabs, .steps, .m-foot { flex: none; }
.m-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

/* Tab bars: one row, no stray scrollbar, underline sits on the divider */
.tabs { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border-bottom: 0; box-shadow: inset 0 -1px 0 var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { height: 42px; padding: 0 14px; margin-bottom: 0; border-bottom: 2px solid transparent; }
.tabs button.on { border-bottom-color: var(--co-blue); }

/* Controls: same height, radius and border everywhere */
.btn { height: var(--ctl); border-radius: var(--ctl-r); }
.btn.sm { height: var(--ctl-sm); } .btn.xs { height: var(--ctl-xs); }
.btn.ghost, .btn.warn { border-width: 1px; }
.btn.warn { border-color: #E3A33A; }
.search, .ta, .status-sel { height: var(--ctl); border-radius: var(--ctl-r); border-color: var(--ctl-border); }
.flt select, .flt input, .map-filters select,
.field input:not([type="checkbox"]):not([type="radio"]), .field select,
.team-row input, .thr input, .gk-in input { height: var(--ctl); border: 1px solid var(--ctl-border); border-radius: var(--ctl-r); padding: 0 11px; background: #fff; }
.field textarea, .note-add textarea, .i-fb { border: 1px solid var(--ctl-border); border-radius: var(--ctl-r); padding: 9px 11px; }
.flt span, .map-filters label > span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; line-height: 14px; }
.field > span { line-height: 16px; }

/* Segmented controls share the control height */
.seg, .period { height: var(--ctl); padding: 3px; align-items: stretch; box-sizing: border-box; }
.seg button, .period button { display: inline-flex; align-items: center; padding: 0 13px; }
.seg.sm { height: var(--ctl-sm); } .seg.sm button { padding: 0 10px; }
.period input { height: 100%; }
.period span { display: inline-flex; align-items: center; }

/* Table toolbar: every control has a label and lines up on one baseline */
.tbl-tools { align-items: flex-end; gap: 10px 12px; }
.flt-search { flex: 1 1 260px; max-width: 360px; }
.flt-search .search { min-width: 0; width: 100%; }
.tbl-extra:empty { display: none; }

/* Status pills and badges: one height */
.st-badge, .rv-st, .comp, .score-badge, .cred, .ctr-st, .role, .ver, .oc-tag, .band-pill, .sync-badge, .onsite, .chip, .rec-tag {
  height: var(--pill); display: inline-flex; align-items: center; line-height: 1; padding-top: 0; padding-bottom: 0; box-sizing: border-box; vertical-align: middle; white-space: nowrap; }
.score-badge.big { height: 26px; }
.sync-badge.sm { height: 18px; }
td .sync-badge.sm { margin-top: 4px; }

/* Dashboard KPI cards: label (2 lines max), value + icon, note — values line up across cards */
.kpi { grid-template-columns: 1fr auto; grid-template-areas: "l l" "v ic" "s s"; align-items: center; align-content: start; gap: 6px 10px; padding: 14px 14px 12px; }
.kpi-l { min-height: calc(2 * 1.25em); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; align-self: start; }
.kpi b { margin-top: 0; line-height: 1.1; }
.kpi small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Assign pop-up: list groups */
.opt-group { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin: 6px 2px 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.opt-group em { font-style: normal; font-size: 11px; background: #EEF2F7; padding: 1px 7px; border-radius: 999px; letter-spacing: 0; }
.opt-group small { width: 100%; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
.opt-group.muted-g { margin-top: 18px; }
.opt-list + .opt-group { margin-top: 18px; }

/* Messages appear at the top so they never cover pop-up buttons */
.toasts { left: 50%; right: auto; top: 12px; bottom: auto; transform: translateX(-50%); justify-items: center; }
.toast { max-width: 560px; }

.card-h { min-height: 24px; }
.flt-search .search input { height: auto; border: 0; padding: 0; max-width: none; min-width: 0; width: 100%; background: none; border-radius: 0; }
.tbl-tools .flt select { width: 168px; max-width: none; }
.tbl-tools .flt input[type="date"] { width: 148px; max-width: none; }
.card-h { min-height: 32px; align-items: center; }
.rv-side .card > .rv-st, .mp-head .st-badge, .mp-head .ctr-st { justify-self: start; width: max-content; }
.vh .rv-st { flex: none; }
.m-body > .search.wide { margin-bottom: 14px; }

/* RadonSketch brand: supplied app icon (as an app tile) + name */
.rs-brand { display: inline-flex; align-items: center; justify-content: flex-start; gap: 9px; width: auto; height: auto; line-height: 1; text-transform: none; letter-spacing: 0; }
.rs-brand img { width: 30px; height: 30px; max-width: none; max-height: none; border-radius: 7px; flex: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
.rs-brand b { font-size: 18px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.sb-foot .rs-brand b { color: #fff; }
.sb-foot .rs-brand img { box-shadow: none; }
.login-pw .rs-brand img { width: 24px; height: 24px; border-radius: 6px; }
.login-pw .rs-brand b { font-size: 16px; color: var(--ink); }
.integ .rs-brand img { width: 44px; height: 44px; border-radius: 10px; }
.integ .rs-brand b { display: none; }
.app-ic-img { object-fit: cover; background: #fff; padding: 0; }
.sb-foot > .rs-brand { text-transform: none; letter-spacing: 0; font-size: inherit; color: #fff; margin: 2px 0; }
.sb-foot { padding-bottom: 84px; gap: 8px; }
.zip-ta .ta { width: 170px; }
.zip-ta .ta-list { min-width: 240px; }
.hint-t { color: #9A5F00; font-weight: 600; }
.zip-ta .ta { width: 150px; }
@media (max-width: 1560px) { .mf-acts small { display: none; } }

   operation that changes a job. Shared by the portal and the workflow demo so
   statuses, counters, pins and scores stay consistent everywhere.
   All times are America/Denver wall-clock strings: "YYYY-MM-DD HH:MM".
   =========================================================================== */
(function () {
  const C = window.CONFIG;
  const STATUS = {};
  C.statuses.forEach((s, i) => (STATUS[s.key] = { ...s, order: i }));
  const CHECKS = C.checks;

  /* ---------- dates ---------- */
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const Dt = {
    norm: (s) => (s || "").replace("T", " "),
    parts(s) { const [d, t = "00:00"] = Dt.norm(s).split(" "); const [y, m, dd] = d.split("-").map(Number); const [hh, mm] = t.split(":").map(Number); return { y, m, d: dd, hh, mm }; },
    ms(s) { const p = Dt.parts(s); return Date.UTC(p.y, p.m - 1, p.d, p.hh, p.mm); },
    fromMs(ms, withTime) { const iso = new Date(ms).toISOString(); return withTime ? iso.slice(0, 10) + " " + iso.slice(11, 16) : iso.slice(0, 10); },
    date: (s) => Dt.norm(s).slice(0, 10),
    addDays: (s, n) => Dt.fromMs(Dt.ms(Dt.date(s)) + n * 864e5),
    addMin: (s, n) => Dt.fromMs(Dt.ms(s) + n * 6e4, true),
    diffDays: (a, b) => Math.round((Dt.ms(Dt.date(b)) - Dt.ms(Dt.date(a))) / 864e5),
    diffMin: (a, b) => Math.round((Dt.ms(b) - Dt.ms(a)) / 6e4),
    dow: (s) => new Date(Dt.ms(Dt.date(s))).getUTCDay(),
    long(s) { const p = Dt.parts(s); return `${DAYS[Dt.dow(s)]}, ${p.d} ${MONTHS[p.m - 1]} ${p.y}`; },
    short(s) { if (!s) return "—"; const p = Dt.parts(s); return `${p.d} ${MONTHS[p.m - 1].slice(0, 3)} ${p.y}`; },
    dm(s) { const p = Dt.parts(s); return `${p.d} ${MONTHS[p.m - 1].slice(0, 3)}`; },
    wdm(s) { const p = Dt.parts(s); return `${DAYS[Dt.dow(s)].slice(0, 3)} ${p.d} ${MONTHS[p.m - 1].slice(0, 3)}`; },
    time(s) { if (!s) return "—"; const p = Dt.parts(s); const h = p.hh % 12 || 12; return `${h}:${String(p.mm).padStart(2, "0")} ${p.hh < 12 ? "AM" : "PM"}`; },
    hm: (t) => Dt.time("2000-01-01 " + t),
    dt(s) { return s ? `${Dt.short(s)}, ${Dt.time(s)}` : "—"; },
    month: (m) => MONTHS[m - 1], MONTHS, DAYS,
    rel(s, now) {
      const d = Dt.diffMin(s, now);
      if (d < 1) return "just now";
      if (d < 60) return `${d} min ago`;
      if (d < 60 * 24 && Dt.date(s) === Dt.date(now)) return `${Math.round(d / 60)} h ago`;
      const days = Dt.diffDays(s, now);
      if (days === 1) return "yesterday";
      if (days < 7) return `${days} days ago`;
      return Dt.short(s);
    },
  };

  /* ---------- helpers ---------- */
  function rng(seed) {
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h += 0x6d2b79f5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const miles = (a, b) => {
    const R = 3958.8, toR = Math.PI / 180, dLat = (b[0] - a[0]) * toR, dLng = (b[1] - a[1]) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  };
  const band = (score) => {
    if (score == null) return { key: "none", label: "No data" };
    if (score < C.thresholds.good) return { key: "poor", label: "POOR" };
    if (score < C.thresholds.great) return { key: "good", label: "GOOD" };
    return { key: "great", label: "GREAT" };
  };
  const OPEN = ["assigned", "scheduled", "inprogress", "submitted", "corrections"];
  const DONE = ["approved", "closed"];
  const FOUNDATION = { "basement": "Basement", "slab-on-grade": "Slab-on-grade", "crawlspace": "Crawlspace", "combination": "Combination" };

  /* ---------- build ---------- */
  function build() {
    const S = { now: `${C.today} ${C.nowTime}`, households: [], contractors: [], jobs: [], notifications: [], seq: 159, readNotes: {} };
    S.contractors = C.contractors.map((c) => ({ ...JSON.parse(JSON.stringify(c)), notes: (c.notes || []).map((n) => ({ ...n })), events: [] }));
    const sorted = C.households.slice().sort((a, b) => a.approved.localeCompare(b.approved) || a.id.localeCompare(b.id));
    sorted.forEach((h, i) => {
      const city = C.cities[h.city], r = rng(h.id);
      const hh = {
        id: h.id, name: `${h.name} Household`, surname: h.name, street: h.street, city: h.city, county: city.county, zip: h.zip,
        lat: +(city.lat + (r() - 0.5) * 0.07).toFixed(5), lng: +(city.lng + (r() - 0.5) * 0.09).toFixed(5),
        phone: `(${city.area}) 555-01${String(10 + i).padStart(2, "0")}`, approved: h.approved, pre: h.pre,
        foundation: FOUNDATION[h.foundation] || h.foundation, built: h.built, occ: h.occ, sump: h.foundation !== "slab-on-grade",
      };
      S.households.push(hh);
      S.jobs.push(makeJob(S, h, hh, h.job || `LIRMA-2026-${String(119 + i).padStart(4, "0")}`, r));
    });
    S.seq = 119 + sorted.length;
    // calibrate each contractor's earlier-check history so the computed score equals the target in CONFIG
    S.contractors.forEach((c) => {
      const t = sampleChecks(S, c.id);
      if (c.score == null) { c.histChecks = { passed: 0, total: 0 }; return; }
      const total = c.historyChecks;
      c.histChecks = { total, passed: Math.round((c.score / 100) * (total + t.total)) - t.passed };
    });
    S.notifications = C.notifications.map((n, i) => ({ ...n, id: "N" + i }));
    return S;
  }

  function makeJob(S, src, hh, id, r) {
    const st = src.status, ord = STATUS[st].order;
    const ctr = src.ctr ? C.contractors.find((c) => c.id === src.ctr) : null;
    const job = {
      id, hh: hh.id, ctr: src.ctr || null, status: st, demo: !!src.demo,
      createdAt: `${src.approved} 10:${String(5 + Math.floor(r() * 50)).padStart(2, "0")}`,
      assignedAt: null, acceptedAt: null, scheduledAt: null, sched: null, window: null, checkIn: null, checkOut: null,
      post: src.post == null ? null : src.post, priority: r() < 0.2 ? "High" : "Standard",
      funded: 1650 + Math.round(r() * 9) * 100, professional: null, photos: 0, live: {},
      instructions: ["Call household 30 minutes before arrival.", "Side gate access — code provided by occupant.", "Occupant has limited mobility; keep pathways clear.", "Please confirm the sump pit location on arrival.", "Spanish-speaking household — interpreter line available."][Math.floor(r() * 5)],
      reports: [], notes: [], events: [], approvedAt: null, closedAt: null,
    };
    if (src.demo) { job.instructions = C.demo.instructions; job.funded = C.demo.funded; }
    const ev = (at, actor, icon, title, desc) => job.events.push({ at, actor, icon, title, desc });
    ev(job.createdAt, "programme", "plus", "Job created", `Household approved for ${C.program.lirma} on ${Dt.short(src.approved)}; installation job opened.`);
    if (ord >= STATUS.assigned.order && ctr) {
      job.assignedAt = `${Dt.addDays(src.approved, 3)} 09:${String(10 + Math.floor(r() * 40)).padStart(2, "0")}`;
      const team = ctr.team;
      job.professional = (team[1] || team[0]).name;
      ev(job.assignedAt, "programme", "user-check", "Assigned to contractor", `Assigned to ${ctr.name} by ${r() < 0.6 ? "Jordan Reyes" : "Sam Whitfield"}.`);
      ev(Dt.addMin(job.assignedAt, 1), "system", "bell", "Contractor notified", `Push notification sent to ${ctr.name} in the RadonSketch app.`);
      ev(Dt.addMin(job.assignedAt, 1), "system", "phone", "Project created in RadonSketch app", `Project “${hh.name}” created with household details from the programme.`);
    }
    if (ord >= STATUS.scheduled.order) {
      job.acceptedAt = Dt.addMin(job.assignedAt, 95 + Math.floor(r() * 200));
      ev(job.acceptedAt, "contractor", "check-circle", "Job accepted", `${ctr.name} accepted the job.`);
      job.sched = src.sched;
      const t = src.sched.slice(11), endH = String(+t.slice(0, 2) + 4).padStart(2, "0");
      job.window = `${t}–${endH}:${t.slice(3)}`;
      job.scheduledAt = Dt.addMin(job.acceptedAt, 20);
      ev(job.scheduledAt, "contractor", "calendar", "Visit scheduled", `Visit booked for ${Dt.wdm(job.sched)}, ${Dt.hm(t)}–${Dt.hm(endH + ":" + t.slice(3))}.`);
    }
    if (ord >= STATUS.inprogress.order) {
      job.checkIn = src.checkedIn || Dt.addMin(job.sched, 4 + Math.floor(r() * 9));
      ev(job.checkIn, "contractor", "map-pin", "Contractor checked in", `${job.professional} checked in on site — 0.0${1 + Math.floor(r() * 4)} mi from the household.`);
      const diag = Dt.addMin(job.checkIn, 70);
      if (Dt.ms(diag) <= Dt.ms(S.now) || ord > STATUS.inprogress.order) {
        ev(diag, "contractor", "grid", "Diagnostic completed (6 test points)", "Sub-slab pressure field test recorded in RadonSketch.");
        ev(Dt.addMin(job.checkIn, 110), "contractor", "layers", "System design created", "Radon Builder design saved with live compliance checks.");
        CHECKS.forEach((c) => (job.live[c.key] = c.key === "posttest" || c.key === "label" ? "pending" : "pass"));
      }
      const done = src.installDone || (ord > STATUS.inprogress.order ? `${Dt.date(job.sched)} ${String(13 + Math.floor(r() * 3)).padStart(2, "0")}:${String(Math.floor(r() * 50) + 10)}` : null);
      if (done) {
        job.photos = (src.failKeys || []).includes("label") ? 7 : 8;
        ev(Dt.addMin(done, -15), "contractor", "camera", `Installation photos uploaded (${job.photos})`, job.photos < 8 ? "1 required photo not captured." : "All required photos captured.");
        job.checkOut = done;
        ev(done, "contractor", "log-out", "Contractor checked out", `Time on site ${fmtDur(Dt.diffMin(job.checkIn, done))}.`);
      }
    }
    if (ord >= STATUS.submitted.order) {
      const failKeys = src.failKeys || [];
      const v1At = src.submittedOn || `${Dt.addDays(job.sched, 6)} 15:${String(10 + Math.floor(r() * 40))}`;
      const finalChecks = genChecks(job, hh, ctr, r, DONE.includes(st) ? [] : null);
      if (st === "submitted" && !src.resubmittedOn) {
        job.reports.push(rep(1, v1At, src.failKeys ? withFails(finalChecks, failKeys) : finalChecks, "pending"));
      } else if (st === "submitted" && src.resubmittedOn) {
        job.reports.push(rep(1, v1At, withFails(finalChecks, failKeys), "corrections", src.correctionsOn, failKeys));
        job.reports.push(rep(2, src.resubmittedOn, allPass(finalChecks), "pending"));
      } else if (st === "corrections") {
        job.reports.push(rep(1, v1At, withFails(finalChecks, failKeys), "corrections", src.correctionsOn, failKeys));
      } else {
        const v = r() < 0.3 ? 2 : 1;
        if (v === 2) {
          job.reports.push(rep(1, v1At, withFails(finalChecks, ["label"]), "corrections", Dt.addMin(v1At, 60 * 40), ["label"]));
          job.reports.push(rep(2, Dt.addMin(v1At, 60 * 70), finalChecks, "approved", `${src.approvedOn} 14:20`));
        } else job.reports.push(rep(1, v1At, finalChecks, "approved", `${src.approvedOn} 14:20`));
        job.approvedAt = `${src.approvedOn} 14:20`;
      }
      job.reports.forEach((rp) => {
        ev(rp.at, "contractor", "upload", rp.v === 1 ? "Report generated and synced" : "Report resubmitted", `Report v${rp.v} synced from RadonSketch — ${result(rp).text}.`);
        if (rp.status === "corrections" || (rp.reviewedAt && rp.status === "corrections")) ev(rp.reviewedAt, "programme", "alert", "Corrections requested", `Reviewer requested: ${rp.failKeys.map(checkLabel).join("; ")}.`);
      });
      if (job.approvedAt) ev(job.approvedAt, "programme", "award", "Report approved", `Report v${job.reports[job.reports.length - 1].v} approved by ${r() < 0.5 ? "Sam Whitfield" : "Avery Lin"}.`);
      if (st === "closed") { job.closedAt = `${Dt.addDays(src.approvedOn, 9)} 10:00`; ev(job.closedAt, "programme", "archive", "Job closed", "Post-mitigation follow-up complete; job closed."); }
      Object.assign(job.live, job.reports[job.reports.length - 1].checks);
    }
    if (src.id === "HH-2026-0359") job.notes.push({ by: "Sam Whitfield", at: "2026-10-26 10:07", text: "Manometer photo shows no reading. Asked contractor to re-photograph with the fan running." });
    if (src.id === "HH-2026-0390") job.notes.push({ by: "Jordan Reyes", at: "2026-11-06 07:30", text: "Visit missed on 4 Nov — no check-in. Called Red Willow, left voicemail." });
    if (src.id === "HH-2026-0376") job.notes.push({ by: "Avery Lin", at: "2026-11-02 14:25", text: "Approved, but post-mitigation reading 4.6 pCi/L is above the action level. Long-term follow-up test requested." });
    job.bom = makeBom(hh, r);
    return job;
  }
  function rep(v, at, checks, status, reviewedAt, failKeys) {
    return { v, at, checks: { ...checks }, status, reviewedAt: reviewedAt || null, failKeys: failKeys || [], comment: failKeys && failKeys.length ? `Please address: ${failKeys.map(checkLabel).join("; ")}.` : "" };
  }
  function genChecks(job, hh, ctr, r, forcePass) {
    const out = {};
    const p = forcePass ? 0 : Math.max(0, (90 - (ctr.score || 80)) / 100);
    CHECKS.forEach((c) => {
      let s = "pass";
      if (c.key === "posttest") s = job.post != null ? "pass" : "warn";
      else if (r() < p) s = r() < 0.5 ? "fail" : "warn";
      out[c.key] = s;
    });
    if (forcePass && ctr.score < C.thresholds.good) out.label = "warn"; // accepted with a minor warning
    return out;
  }
  const withFails = (checks, keys) => { const o = { ...checks }; keys.forEach((k) => (o[k] = "fail")); return o; };
  const allPass = (checks) => { const o = { ...checks }; Object.keys(o).forEach((k) => (o[k] = "pass")); return o; };
  const checkLabel = (k) => (CHECKS.find((c) => c.key === k) || { label: k }).label;
  function result(report) {
    const vals = CHECKS.map((c) => report.checks[c.key]);
    const passed = vals.filter((v) => v === "pass").length;
    return { passed, total: CHECKS.length, warn: vals.filter((v) => v === "warn").length, fail: vals.filter((v) => v === "fail").length, text: `${passed} of ${CHECKS.length} checks passed` };
  }
  function makeBom(hh, r) {
    const items = [
      { item: "Inline radon fan (≈ 60 W)", qty: "1", cost: 289 },
      { item: '3" Schedule 40 PVC pipe', qty: `${22 + Math.floor(r() * 16)} ft`, cost: 52 + Math.round(r() * 24) },
      { item: '3" PVC elbows and fittings', qty: `${4 + Math.floor(r() * 3)}`, cost: 21 + Math.round(r() * 10) },
      { item: "U-tube manometer", qty: "1", cost: 18.5 },
      { item: "Polyurethane sealant", qty: `${2 + Math.floor(r() * 3)} tubes`, cost: 24 + Math.round(r() * 12) },
      { item: "System label set", qty: "1", cost: 9.5 },
      { item: "Exterior rain cap", qty: "1", cost: 12 },
    ];
    if (hh.sump) items.push({ item: "Sealed sump cover", qty: "1", cost: 89 });
    return { items, total: items.reduce((s, i) => s + i.cost, 0) };
  }
  function fmtDur(min) { const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${m} min` : `${m} min`; }

  /* ---------- selectors ---------- */
  function sampleChecks(S, ctrId) {
    let passed = 0, total = 0;
    S.jobs.filter((j) => j.ctr === ctrId && DONE.includes(j.status)).forEach((j) => {
      const r = result(j.reports[j.reports.length - 1]); passed += r.passed; total += r.total;
    });
    return { passed, total };
  }
  const Q = {
    hh: (S, id) => S.households.find((h) => h.id === id),
    job: (S, id) => S.jobs.find((j) => j.id === id),
    jobOfHh: (S, hhId) => S.jobs.find((j) => j.hh === hhId),
    ctr: (S, id) => S.contractors.find((c) => c.id === id),
    jobsOf: (S, ctrId) => S.jobs.filter((j) => j.ctr === ctrId),
    score(S, c) {
      if (c.score == null && !c.histChecks.total) { const t = sampleChecks(S, c.id); if (!t.total) return null; return Math.round((t.passed / t.total) * 100); }
      const t = sampleChecks(S, c.id);
      return Math.round(((c.histChecks.passed + t.passed) / (c.histChecks.total + t.total)) * 100);
    },
    openJobs: (S, ctrId) => S.jobs.filter((j) => j.ctr === ctrId && OPEN.includes(j.status)),
    stats(S, c) {
      const js = Q.jobsOf(S, c.id);
      const done = js.filter((j) => DONE.includes(j.status));
      const red = done.filter((j) => j.post != null).map((j) => (1 - j.post / Q.hh(S, j.hh).pre) * 100);
      const avgRed = c.hist.avgReduction == null && !red.length ? null
        : Math.round(((c.hist.avgReduction || 0) * c.hist.completed + red.reduce((a, b) => a + b, 0)) / Math.max(1, c.hist.completed + red.length));
      const evs = js.flatMap((j) => j.events.filter((e) => e.actor === "contractor")).sort((a, b) => b.at.localeCompare(a.at));
      return {
        completed: c.hist.completed + done.length,
        inProgress: js.filter((j) => j.status === "inprogress").length,
        scheduled: js.filter((j) => j.status === "scheduled" || j.status === "assigned").length,
        corrections: js.filter((j) => j.status === "corrections").length,
        avgReduction: avgRed, onTime: c.hist.onTime,
        lastActivity: evs[0] ? evs[0].at : Dt.norm(c.lastActivity),
        open: js.filter((j) => OPEN.includes(j.status)).length,
      };
    },
    location(S, c) {
      const active = S.jobs.find((j) => j.ctr === c.id && j.status === "inprogress" && j.checkIn && !j.checkOut && Dt.date(j.checkIn) === Dt.date(S.now));
      if (active) { const h = Q.hh(S, active.hh); return { lat: h.lat + 0.0006, lng: h.lng + 0.0009, active: true, job: active }; }
      return { lat: c.base.lat, lng: c.base.lng, active: false };
    },
    latest: (job) => job.reports[job.reports.length - 1] || null,
    result, checkLabel,
    reduction(S, job) { const h = Q.hh(S, job.hh); return job.post == null ? null : Math.round((1 - job.post / h.pre) * 100); },
    credStatus(S, date) {
      const d = Dt.diffDays(S.now, date);
      if (d < 0) return { key: "expired", label: "Expired", days: d };
      if (d <= C.credentialWarnDays) return { key: "soon", label: "Expiring soon", days: d };
      return { key: "valid", label: "Valid", days: d };
    },
    credentials(S, c) {
      return [
        { kind: "Colorado radon mitigation licence", number: c.licence, expiry: c.licenceExpiry },
        { kind: `${c.cert.body} certification`, number: c.cert.number, expiry: c.cert.expiry },
        { kind: "Business liability insurance", number: c.insurance.carrier, expiry: c.insurance.expiry },
      ].map((x) => ({ ...x, st: Q.credStatus(S, x.expiry) }));
    },
    unread: (S) => S.notifications.filter((n) => n.unread).length,
  };

  /* ---------- operations (used by portal actions and the workflow demo) ---------- */
  const Ops = {
    event(job, at, actor, icon, title, desc) { job.events.push({ at, actor, icon, title, desc }); },
    notify(S, n) { S.notifications.unshift({ id: "N" + Math.random().toString(36).slice(2, 8), unread: true, ...n }); },
    newJobId(S) { const id = `LIRMA-2026-${String(S.seq).padStart(4, "0")}`; S.seq++; return id; },
    assign(S, jobId, ctrId, o = {}) {
      const job = Q.job(S, jobId), c = Q.ctr(S, ctrId), at = o.at || S.now, reassign = !!job.ctr && job.ctr !== ctrId;
      job.ctr = ctrId; job.status = "assigned"; job.assignedAt = at; job.acceptedAt = null; job.sched = null; job.window = null;
      job.professional = o.professional || (c.team[1] || c.team[0]).name;
      if (o.priority) job.priority = o.priority;
      if (o.instructions != null) job.instructions = o.instructions;
      job.targetDate = o.date || null;
      Ops.event(job, at, "programme", "user-check", reassign ? "Reassigned to contractor" : "Assigned to contractor", `Assigned to ${c.name} by ${C.signedInUser.name}.${o.date ? ` Target date ${Dt.short(o.date)}.` : ""}`);
      Ops.event(job, Dt.addMin(at, 0), "system", "bell", "Contractor notified", `Push notification sent to ${c.name} in the RadonSketch app.`);
      Ops.event(job, Dt.addMin(at, 0), "system", "phone", "Project created in RadonSketch app", `Project “${Q.hh(S, job.hh).name}” created with household details from the programme.`);
      return job;
    },
    accept(S, jobId, at) { const job = Q.job(S, jobId); job.acceptedAt = at; Ops.event(job, at, "contractor", "check-circle", "Job accepted", `${Q.ctr(S, job.ctr).name} accepted the job.`); },
    schedule(S, jobId, date, window, at) {
      const job = Q.job(S, jobId); job.status = "scheduled"; job.sched = `${date} ${window.slice(0, 5)}`; job.window = window; job.scheduledAt = at;
      Ops.event(job, at, "contractor", "calendar", "Visit scheduled", `Visit booked for ${Dt.wdm(date)}, ${Dt.hm(window.slice(0, 5))}–${Dt.hm(window.slice(-5))}.`);
    },
    checkIn(S, jobId, at, distMi) {
      const job = Q.job(S, jobId); job.status = "inprogress"; job.checkIn = at; job.checkInDist = distMi;
      Ops.event(job, at, "contractor", "map-pin", "Contractor checked in", `${job.professional} checked in on site — ${distMi} mi from the household.`);
    },
    diagnostic(S, jobId, at) { Ops.event(Q.job(S, jobId), at, "contractor", "grid", "Diagnostic completed (6 test points)", "Sub-slab pressure field test recorded in RadonSketch."); },
    design(S, jobId, at, warn) {

    if (G.status === "loading" || G.status === "ready") return;
    if (G.loaded()) { G.status = "ready"; emit(); return; }
    G.status = "loading"; G.reason = ""; emit();
    window.__lirmaGoogleReady = async () => {
      try {
        await Promise.all(["maps", "marker", "places"].map((l) => google.maps.importLibrary(l)));
        if (G.status !== "loading") return;
        clearTimeout(timer);
        G.status = "ready"; emit();
      } catch (e) { G.fail("Google Maps libraries could not load: " + ((e && e.message) || e)); }
    };

    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(G.key())}&v=weekly&loading=async&libraries=maps,marker,places&callback=__lirmaGoogleReady`;
    s.async = true;
    s.onerror = () => G.fail("Couldn't reach Google Maps — check the internet connection.");
    document.head.appendChild(s);
    timer = setTimeout(() => G.fail("Google Maps didn't respond within 15 seconds."), 15000);
  };

  /* ---------- Places API (New) ---------- */
  const coRect = () => { const [[s, w], [n, e]] = window.CoMap.bounds; return { south: s, west: w, north: n, east: e }; };
  let token = null;
  const placeErr = (e) => {
    const msg = (e && (e.message || e.toString())) || "Unknown error";
    return new Error(/not been used|disabled|PERMISSION_DENIED|not authorized|API key/i.test(msg)
      ? `Places request refused — enable “Places API (New)” for this key in Google Cloud and allow it in the key's API restrictions. (${msg})`
      : `Places search failed: ${msg}`);
  };
  // kind: "place" (any address or place) · "address" (street addresses) · "zip" (postal codes)
  G.suggest = async (input, kind) => {
    const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary("places");
    if (!token) token = new AutocompleteSessionToken();
    const base = { input, sessionToken: token, includedRegionCodes: ["us"], locationRestriction: coRect() };
    const types = { zip: ["postal_code"], address: ["street_address", "premise", "subpremise"] }[kind];
    let res;
    try { res = await AutocompleteSuggestion.fetchAutocompleteSuggestions(types ? { ...base, includedPrimaryTypes: types } : base); }
    catch (e) {
      if (!types) throw placeErr(e);
      try { res = await AutocompleteSuggestion.fetchAutocompleteSuggestions(base); } catch (e2) { throw placeErr(e2); }
    }
    return (res.suggestions || []).filter((s) => s.placePrediction).slice(0, 6).map((s) => {
      const p = s.placePrediction;
      return { pred: p, main: p.mainText ? p.mainText.text : p.text.text, secondary: p.secondaryText ? p.secondaryText.text : "", text: p.text.text };
    });
  };
  G.resolve = async (pred) => {
    const place = pred.toPlace();
    try { await place.fetchFields({ fields: ["displayName", "formattedAddress", "location", "addressComponents", "types"] }); }
    catch (e) { throw placeErr(e); }
    token = null; // a selection ends the autocomplete session (billing best practice)
    const comps = place.addressComponents || [];
    const comp = (t, short) => { const c = comps.find((x) => (x.types || []).includes(t)); return c ? (short ? c.shortText : c.longText) : ""; };
    const lat = place.location.lat(), lng = place.location.lng();
    const geoCounty = window.CoMap.countyAt(lat, lng);
    return {
      lat, lng, formatted: place.formattedAddress || "", name: place.displayName || "",
      street: [comp("street_number"), comp("route")].filter(Boolean).join(" "),
      city: comp("locality") || comp("postal_town") || comp("sublocality") || comp("administrative_area_level_3") || comp("neighborhood"),
      zip: comp("postal_code"), state: comp("administrative_area_level_1", true),
      county: geoCounty || comp("administrative_area_level_2").replace(/ County$/, ""),
      inColorado: comp("administrative_area_level_1", true) === "CO" && window.CoMap.inColorado(lat, lng),
      types: place.types || [],
    };
  };

  window.GMaps = G;
})();

  /* ---------- table engine (search · filters · sort · pagination) ---------- */
  Portal.table = function (key, def) {
    const UI = Portal.UI;

    const sel = (f) => `<label class="flt"><span>${f.label}</span><select data-ch="tblF" data-key="${key}" data-f="${f.key}">
      <option value="">All</option>${f.options.map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${t.f[f.key] === v ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select></label>`;
    const range = def.dateRange ? `<label class="flt"><span>From</span><input type="date" data-ch="tblF" data-key="${key}" data-f="from" value="${t.f.from || ""}"></label><label class="flt"><span>To</span><input type="date" data-ch="tblF" data-key="${key}" data-f="to" value="${t.f.to || ""}"></label>` : "";
    const sp = t.special && def.specials ? `<div class="special-chip">${ic("filter", 14)} Showing: ${def.specials[t.special].label}<button data-a="tblSpecialClear" data-arg="${key}" aria-label="Clear">${ic("x", 14)}</button></div>` : "";
    const pg = [];

    return `<div class="tbl-card">
      ${def.noToolbar ? "" : `<div class="tbl-tools">
        <label class="flt flt-search"><span>Search</span><div class="search">${ic("search", 16)}<input type="search" placeholder="${def.placeholder || "Search"}" value="${esc(t.q)}" data-in="tblQ" data-key="${key}" data-fk="${key}-q"></div></label>
        ${(def.filters || []).filter((f) => !f.hidden).map(sel).join("")}${range}
        ${(def.filters || []).length || def.dateRange ? `<button class="btn ghost" data-a="tblReset" data-arg="${key}">Reset</button>` : ""}
        <div class="tbl-extra">${def.extra || ""}</div></div>${sp}`}
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${def.cols.map((c) => `<th class="${c.cls || ""}${c.sort ? " sortable" : ""}" ${c.sort ? `data-a="tblSort" data-arg="${key}|${c.key}"` : ""}>${c.label}${c.sort ? `<span class="srt ${t.sort === c.key ? t.dir : ""}">${ic(t.sort === c.key && t.dir === "desc" ? "chev-down" : "chev-up", 12)}</span>` : ""}</th>`).join("")}</tr></thead>
      <tbody>${shown.length ? shown.map((r) => `<tr ${def.rowAction ? `data-a="${def.rowAction}" data-arg="${esc(def.rowArg(r))}" class="clickable${def.rowHl && def.rowHl(r) ? " hl" : ""}"` : ""}>${def.cols.map((c) => `<td class="${c.cls || ""}">${c.render(r)}</td>`).join("")}</tr>`).join("")
        : `<tr><td colspan="${def.cols.length}"><div class="empty">${ic("search", 20)}<b>No matching records</b><span>Try a different search or clear the filters.</span></div></td></tr>`}</tbody></table></div>
      <div class="tbl-foot"><span>${rows.length ? `Showing ${(t.page - 1) * per + 1}–${Math.min(t.page * per, rows.length)} of ${rows.length}` : "0 results"}</span>
        <div class="pager"><button data-a="tblPage" data-arg="${key}|${t.page - 1}" ${t.page === 1 ? "disabled" : ""}>${ic("chev-left", 14)}</button>${pg.join("")}<button data-a="tblPage" data-arg="${key}|${t.page + 1}" ${t.page === pages ? "disabled" : ""}>${ic("chev-right", 14)}</button></div></div></div>`;
  };

  /* ---------- maps glue ---------- */
  Portal.mapSlot = function (key, opts, data) {
    Portal.pending[key] = { opts, ...data };
    return `<div class="map-slot" data-map-slot="${key}"></div>`;
  };
  function attachMaps() {
    Object.entries(Portal.pending).forEach(([key, d]) => {
      const slot = Portal.root.querySelector(`[data-map-slot="${key}"]`);
      if (!slot) return;

    return p;
  }

  const TA = { items: {}, idx: {}, timers: {}, seq: {}, kind: {} };
  Portal.taBox = function (key, kind, { placeholder = "", value = "", attrs = "" } = {}) {
    TA.kind[key] = kind;
    return `<div class="ta" data-ta-box="${key}">${ic("search", 15)}<input class="ta-in" type="search" data-ta="${key}" data-kind="${kind}" data-fk="ta-${key}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false" aria-autocomplete="list" ${attrs}>
      <div class="ta-list" data-ta-list="${key}" hidden></div></div>`;
  };
  const taList = (key, html) => { const el = Portal.root.querySelector(`[data-ta-list="${key}"]`); if (!el) return; el.innerHTML = html; el.hidden = !html; };
  const taFoot = `<div class="ta-foot">powered by <b><span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span></b></div>`;
  function taRender(key) {
    const items = TA.items[key] || [], idx = TA.idx[key] || 0, foot = TA.kind[key] === "colorado-zip" ? "" : taFoot;
    taList(key, items.length
      ? items.map((it, i) => `<button type="button" class="ta-i ${i === idx ? "on" : ""}" data-a="taPick" data-arg="${key}|${i}">${ic("map-pin", 15)}<span><b>${esc(it.main)}</b><small>${esc(it.secondary)}</small></span></button>`).join("") + foot

  }

  function zipInput(key, q) {

    const items = Object.keys(Z).filter((z) => z.startsWith(d)).sort().slice(0, 8)
      .map((z) => ({ main: z, secondary: `${Z[z][2]} County`, local: { zip: z, lat: Z[z][0], lng: Z[z][1], county: Z[z][2] } }));

    const el = Portal.root.querySelector(sel);

    sc.scrollTo({ top: sc.scrollTop + top / scale - 16, behavior: smooth ? "smooth" : "auto" });
  };
  Portal.freshUI = freshUI;
  window.Portal = Portal;

  function zipCenter(zip) {
    const z = window.CO_ZIPS && window.CO_ZIPS[zip];

    const hs = S().households.filter((h) => h.zip === zip);
    if (!hs.length) return null;
    return [hs.reduce((a, h) => a + h.lat, 0) / hs.length, hs.reduce((a, h) => a + h.lng, 0) / hs.length];
  }
  function mapFiltered() {
    const s = S(), a = U().map.applied;

    // ZIP: households in that ZIP. ZIP + radius: those, plus any household within the radius of the ZIP's centre.
    const inZip = (lat, lng, zip) => !a.zip || zip === a.zip || (!!a.radius && !!zc && miles(zc, [lat, lng]) <= +a.radius);
    const jobs = s.jobs.filter((j) => {
      const h = hhOf(j), c = ctrOf(j);
      return inZip(h.lat, h.lng, h.zip) && (!a.county || h.county === a.county) && (!a.ctr || j.ctr === a.ctr) && (!a.status || j.status === a.status) && (!a.band || (c && band(scoreOf(c)).key === a.band));
    });
    const ctrs = s.contractors.filter((c) => {
      const l = Q.location(s, c);
      return (!a.ctr || c.id === a.ctr) && (!a.band || band(scoreOf(c)).key === a.band) && (!a.county || c.counties.includes(a.county) || Q.openJobs(s, c.id).some((j) => hhOf(j).county === a.county)) && (!a.zip || (zCounty && c.counties.includes(zCounty)) || (!!a.radius && !!zc && miles(zc, [l.lat, l.lng]) <= +a.radius));
    });
    return { jobs, ctrs };
  }

    const G = window.CoMap.usingGoogle(), place = m.place;

    else {
      const key = "f:" + JSON.stringify([a.zip || "", a.radius || "", a.county || "", a.ctr || "", a.status || "", a.band || "", m.layer, m.viewNonce || 0]);
      const hhPts = m.layer !== "contractors" ? jobs.map((j) => [hhOf(j).lat, hhOf(j).lng]) : [];
      const fit = (pts, maxZoom) => {
        const la = pts.map((p) => p[0]), lo = pts.map((p) => p[1]), b = [[Math.min(...la), Math.min(...lo)], [Math.max(...la), Math.max(...lo)]];
        return b[1][0] - b[0][0] < 0.02 && b[1][1] - b[0][1] < 0.02 ? { key, type: "point", lat: (b[0][0] + b[1][0]) / 2, lng: (b[0][1] + b[1][1]) / 2, zoom: maxZoom } : { key, type: "bounds", bounds: b, maxZoom };

    }
    return `<div class="page-head tight"><div><h1>Map View</h1><p>Every ${esc(C.program.lirma)} household and contractor in Colorado — live from RadonSketch.</p></div>
        <div class="seg">${[["households", "Households"], ["contractors", "Contractors"], ["both", "Both"]].map(([k, l]) => `<button class="${m.layer === k ? "on" : ""}" data-a="mapLayer" data-arg="${k}">${l}</button>`).join("")}</div></div>
      <div class="map-filters">
        <label class="zip-ta"><span>ZIP code</span>${Pt.taBox("zip", "colorado-zip", { placeholder: "Any Colorado ZIP", value: U().ta.zip != null ? U().ta.zip : f.zip, attrs: 'inputmode="numeric" maxlength="5"' })}</label>

        <label><span>County</span>${opt("county", countyNames, "All 64 counties")}</label>
        <label><span>Contractor</span>${opt("ctr", s.contractors.map((c) => [c.id, c.name]), "All contractors")}</label>
        <label><span>Job status</span>${opt("status", statusOpts, "All statuses")}</label>

        <div class="mf-acts"><small class="muted">Filters apply instantly</small><button class="btn ghost" data-a="mapReset">Reset</button></div>
      </div>
      <div class="map-area ${sel ? "with-panel" : ""}">
        <div class="map-wrap">${Pt.mapSlot("main", { labels: true }, {

            view,

          ${active && !shown ? `<div class="map-empty">${ic("search", 18)}<div><b>No results for these filters</b><small>Try a larger radius or fewer filters.</small></div><button class="btn ghost sm" data-a="mapReset">Reset filters</button></div>` : ""}
          ${G ? `<div class="map-search">${Pt.taBox("place", "place", { placeholder: "Search a Colorado address or place…", value: U().ta.place || "" })}</div>`
            : `<button class="map-search off" data-a="go" data-arg="settings">${ic(window.GMaps && window.GMaps.status === "failed" ? "alert" : "search", 15)} ${window.GMaps && window.GMaps.status === "failed" ? "Google Maps unavailable — see Settings" : window.GMaps && window.GMaps.status === "loading" ? "Connecting to Google Maps…" : "Connect Google Maps in Settings to search real addresses"}</button>`}
