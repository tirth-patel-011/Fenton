<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadonSketch × KSU Radon Courses — Partnership Prototype</title>
<style>
/* =========================================================================
   RadonSketch × Partner — Partnership Prototype
   Partner accent: change --partner-accent below (or CONFIG.partner.accent in app.js)
   ========================================================================= */
:root {
  --partner-accent: #512888;
  --partner-soft: color-mix(in srgb, var(--partner-accent) 9%, #fff);
  --partner-mid: color-mix(in srgb, var(--partner-accent) 22%, #fff);
  --partner-dark: color-mix(in srgb, var(--partner-accent) 80%, #000);

  --rs-orange: #E26A1B;
  --rs-orange-dk: #C9580E;
  --rs-orange-soft: #FCEBDD;
  --rs-cream: #FDF8F1;
  --rs-ink: #1A1410;
  --rs-ink-2: #4A4038;
  --rs-muted: #8A7F75;
  --rs-line: #EEE6DC;
  --rs-green: #23915F;
  --rs-green-soft: #DDF2E7;
  --rs-mint: #BFE7D4;
  --rs-peach: #F8D9A9;
  --rs-amber: #C77F00;
  --rs-amber-soft: #FDF0D4;
  --rs-red: #D2402F;

  --p-bg: #F4F5F7;
  --p-line: #E3E6EB;
  --p-ink: #1E2430;
  --p-ink-2: #444C5C;
  --p-muted: #6B7383;

  --font: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--rs-ink); background: #E9E4DD; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button[disabled] { cursor: default; opacity: .4; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
.muted { color: var(--rs-muted); font-weight: 500; }
.center { text-align: center; }

/* ---------- Stage (1440×900, scaled to fit) ---------- */
#viewport { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: center center; }
#stage.mode-hub { background: var(--rs-cream); }
#stage.mode-flowA, #stage.mode-flowB, #stage.mode-story {
  background: #EFEBE5 radial-gradient(circle at 1px 1px, rgba(26,20,16,.07) 1px, transparent 0) 0 0 / 22px 22px;
}
.proto-label {
  position: absolute; right: 18px; bottom: 12px; z-index: 50;
  font-size: 11.5px; font-weight: 600; letter-spacing: .02em; color: var(--rs-ink-2);
  background: rgba(255,255,255,.85); border: 1px dashed rgba(26,20,16,.25); border-radius: 999px; padding: 5px 11px;
}

/* ---------- Shared bits ---------- */
.partner-logo {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 104px; height: 34px; border: 1.5px dashed color-mix(in srgb, var(--partner-accent) 55%, #fff);
  color: var(--partner-accent); background: var(--partner-soft);
  border-radius: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}
.partner-logo.xs { width: 64px; height: 22px; font-size: 7.5px; border-radius: 4px; }
.partner-logo.on-dark { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.55); color: #fff; }
.rs-logo { flex: none; display: inline-block; vertical-align: middle; }

/* ---------- Top bar ---------- */
.topbar {
  position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 5;
  display: flex; align-items: center; gap: 20px; padding: 0 32px;
  background: rgba(255,255,255,.86); border-bottom: 1px solid rgba(26,20,16,.08); backdrop-filter: blur(6px);
}
.tb-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--rs-ink-2); padding: 8px 12px 8px 8px; border-radius: 10px; }
.tb-back:hover { background: rgba(26,20,16,.05); }
.tb-title { display: flex; align-items: center; gap: 14px; }
.tb-title b { display: block; font-size: 15px; }
.tb-title small { display: block; font-size: 12px; color: var(--rs-muted); margin-top: 1px; }
.tb-logos { display: inline-flex; align-items: center; gap: 6px; padding-right: 14px; border-right: 1px solid var(--rs-line); }
.tb-x { color: var(--rs-muted); font-size: 13px; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(26,20,16,.14); background: #fff; }
.tb-btn:hover { border-color: rgba(26,20,16,.3); }
.seg-tb { display: inline-flex; padding: 3px; background: rgba(26,20,16,.06); border-radius: 11px; }
.seg-tb button { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; color: var(--rs-ink-2); transition: background .2s, color .2s; }
.seg-tb button.on { background: #fff; color: var(--partner-accent); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

/* =========================================================================
   HUB
   ========================================================================= */
.hub { position: absolute; inset: 0; padding: 54px 96px 0; text-align: center; animation: fade .3s var(--ease); }
.hub-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--rs-muted); }
.hub-eyebrow em { font-style: normal; font-weight: 600; margin-left: 8px; padding: 4px 10px; border-radius: 999px; background: var(--rs-orange-soft); color: var(--rs-orange-dk); }
.hub h1 { font-size: 38px; letter-spacing: -.02em; margin-top: 18px; }
.hub-sub { font-size: 17px; color: var(--rs-ink-2); margin-top: 10px; }
.hub-diagram { display: grid; grid-template-columns: 270px 1fr 270px; align-items: center; gap: 26px; margin: 40px auto 0; max-width: 1180px; text-align: left; }
.hd-node { background: #fff; border-radius: 20px; padding: 22px 24px; border: 1.5px solid var(--rs-line); box-shadow: 0 10px 30px -18px rgba(26,20,16,.35); }
.hd-node.rs { border-color: color-mix(in srgb, var(--rs-orange) 40%, #fff); }
.hd-node.partner { border-color: var(--partner-mid); }
.hd-logo { height: 46px; display: flex; align-items: center; margin-bottom: 12px; }
.hd-node b { font-size: 18px; display: block; }
.hd-node small { display: block; color: var(--rs-muted); font-size: 13px; margin-top: 3px; }
.hd-node ul { margin-top: 12px; display: grid; gap: 5px; }
.hd-node li { font-size: 13px; color: var(--rs-ink-2); padding-left: 14px; position: relative; }
.hd-node li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--rs-orange); }
.hd-node.partner li::before { background: var(--partner-accent); }
.hd-flows { display: grid; gap: 16px; }
.hd-flow { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(255,255,255,.7); border-radius: 14px; }
.hd-flow b { font-size: 14.5px; display: block; }
.hd-flow small { font-size: 12.5px; color: var(--rs-muted); display: block; margin-top: 2px; }
.hd-num { flex: none; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.f1 .hd-num { background: var(--partner-accent); }
.f2 .hd-num { background: var(--rs-orange); }
.hd-arrow { position: absolute; left: 0; right: 0; width: 100%; height: 24px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.f1 .hd-arrow { top: -14px; stroke: var(--partner-accent); }
.f2 .hd-arrow { bottom: -14px; stroke: var(--rs-orange); }
.f1 { margin-top: 10px; } .f2 { margin-bottom: 10px; }
.hd-mid { justify-self: center; display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--rs-ink-2); padding: 7px 14px; border: 1px dashed rgba(26,20,16,.25); border-radius: 999px; background: #fff; }
.hub-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin: 44px auto 0; max-width: 1180px; text-align: left; }
.hub-card { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 24px; background: #fff; border-radius: 20px; border: 1.5px solid var(--rs-line); transition: transform .2s var(--ease), box-shadow .2s, border-color .2s; min-height: 220px; }
.hub-card:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -22px rgba(26,20,16,.45); border-color: rgba(26,20,16,.2); }
.hub-card.feature { background: var(--rs-ink); color: #fff; border-color: var(--rs-ink); }
.hub-card.feature small { color: rgba(255,255,255,.7); }
.hc-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 8px; }
.hc-ic.rs { background: var(--rs-orange-soft); color: var(--rs-orange-dk); }
.hc-ic.partner { background: var(--partner-soft); color: var(--partner-accent); }
.hc-ic.both { background: rgba(255,255,255,.12); color: #fff; }
.hc-tag { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--rs-muted); }
.feature .hc-tag { color: #F2A46E; }
.hub-card b { font-size: 19px; letter-spacing: -.01em; }
.hub-card small { font-size: 13.5px; color: var(--rs-ink-2); line-height: 1.5; }
.hc-go { margin-top: auto; padding-top: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--rs-orange-dk); }
.feature .hc-go { color: #fff; }
.hub-tip { margin-top: 28px; font-size: 12.5px; color: var(--rs-muted); }

/* =========================================================================
   FLOW A layout
   ========================================================================= */
.panel { position: absolute; top: 88px; width: 340px; background: rgba(255,255,255,.88); border: 1px solid rgba(26,20,16,.08); border-radius: 18px; padding: 20px; }
.fa-left { left: 32px; }
.fa-right { right: 32px; }
.panel-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--rs-muted); margin-bottom: 10px; }
.jump { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; font-size: 13.5px; color: var(--rs-ink-2); transition: background .15s; }
.jump em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--rs-muted); width: 24px; }
.jump:hover { background: rgba(26,20,16,.05); }
.jump.on { background: var(--rs-orange-soft); color: var(--rs-ink); font-weight: 600; }
.jump.on em { color: var(--rs-orange-dk); }
.fa-right h3 { font-size: 18px; margin-bottom: 12px; }
.fa-right ul { display: grid; gap: 10px; }
.fa-right li { position: relative; padding-left: 16px; font-size: 14px; line-height: 1.5; color: var(--rs-ink-2); }
.fa-right li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--rs-orange); }
.panel-hint { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rs-line); font-size: 12.5px; color: var(--rs-muted); line-height: 1.45; }
.fa-phone { position: absolute; top: 80px; left: 530px; }

/* =========================================================================
   FLOW B layout
   ========================================================================= */
.fb-browser { position: absolute; top: 80px; left: 32px; }

/* =========================================================================
   STORY layout
   ========================================================================= */
.st-lbl { position: absolute; top: 74px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--rs-ink-2); letter-spacing: .02em; }
.st-lbl.b { left: 34px; }
.st-lbl.a { left: 1058px; }
.st-browser { position: absolute; top: 98px; left: 32px; transition: opacity .25s, filter .25s; }
.st-phone { position: absolute; top: 98px; left: 1062px; transition: opacity .25s, filter .25s; }
.frame.is-dim { opacity: .55; filter: saturate(.6); }
.st-caption {
  position: absolute; left: 32px; right: 32px; top: 726px; height: 142px;
  display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center;
  background: #fff; border-radius: 18px; padding: 20px 26px; border: 1px solid rgba(26,20,16,.08); box-shadow: 0 10px 30px -22px rgba(26,20,16,.5);
}
.st-count { font-size: 12px; font-weight: 700; color: var(--rs-orange-dk); text-transform: uppercase; letter-spacing: .08em; }
.st-title { font-size: 21px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; }
.st-cap { font-size: 15px; color: var(--rs-ink-2); margin-top: 6px; line-height: 1.5; max-width: 900px; animation: fade .25s var(--ease); }
.st-side { display: grid; justify-items: end; gap: 14px; }
.st-ctrls { display: flex; gap: 10px; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 11px 16px; border-radius: 12px; border: 1px solid rgba(26,20,16,.16); font-weight: 600; font-size: 14px; }
.btn-next { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px; background: var(--rs-ink); color: #fff; font-weight: 700; font-size: 14px; }
.st-dots { display: flex; gap: 6px; }
.st-dots button { width: 22px; height: 6px; border-radius: 3px; background: rgba(26,20,16,.14); transition: background .2s, width .2s; }
.st-dots button.past { background: color-mix(in srgb, var(--rs-orange) 45%, #fff); }
.st-dots button.on { background: var(--rs-orange); width: 34px; }

/* =========================================================================
   PHONE FRAME
   ========================================================================= */
.phone-wrap { position: relative; }
.phone { width: 414px; height: 868px; transform-origin: 0 0; padding: 12px; border-radius: 64px; background: #17130F; box-shadow: 0 0 0 2px #3A332C inset, 0 40px 80px -30px rgba(26,20,16,.55), 0 10px 24px -10px rgba(26,20,16,.35); position: relative; }
.island { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 30; }
.phone-screen { position: relative; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; display: flex; flex-direction: column; background: var(--rs-cream); font-size: 15px; }
.phone-screen.th-white { background: #fff; }
.phone-screen.th-dark { background: #000; color: #fff; }
.phone-screen.th-lock { background: linear-gradient(160deg, #3B2A1E 0%, #8E4B22 45%, #E28A4C 100%); color: #fff; }
.sb { flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 38px; font-weight: 600; font-size: 16px; z-index: 25; }
.sb-ic { display: inline-flex; gap: 6px; align-items: center; }
.app-body { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.app-body::-webkit-scrollbar { display: none; }
.app-body.enter { animation: slideIn .26s var(--ease); }
.app-footer { flex: none; padding: 12px 18px 34px; background: inherit; border-top: 1px solid var(--rs-line); background: rgba(255,255,255,.96); }
.th-cream .app-footer { background: rgba(253,248,241,.97); }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #111; z-index: 40; }
.th-dark .home-ind, .th-lock .home-ind { background: #fff; }
.pad { padding: 0 18px 24px; }

/* toast */
.app-toast { position: absolute; left: 18px; right: 18px; top: 60px; z-index: 35; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--rs-ink); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5); animation: dropIn .25s var(--ease); }
.app-toast .ic { color: #7BE0AE; }

/* headings */
.ph-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 16px; }
.ph-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.ph-head-actions { display: flex; gap: 10px; }
.circle-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(26,20,16,.08); }
.nav-head { display: flex; align-items: center; padding: 4px 10px 10px; gap: 4px; }
.nav-title { flex: 1; text-align: center; font-weight: 700; font-size: 16px; margin-right: 40px; }
.nav-right { position: absolute; right: 14px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.icon-btn.floating { position: absolute; top: 8px; left: 12px; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.15); color: var(--rs-ink); }
.sec-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--rs-ink-2); margin: 18px 2px 10px; }

/* tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 10px 8px 30px; background: #fff; border-top: 1px solid var(--rs-line); box-shadow: 0 -4px 16px -10px rgba(26,20,16,.2); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--rs-ink-2); }
.tab.on { color: var(--rs-orange); }
.tab-ic { position: relative; }
.new-badge { position: absolute; top: -7px; left: 15px; font-style: normal; font-size: 9px; font-weight: 800; color: #fff; background: var(--rs-orange); padding: 2px 5px; border-radius: 6px; letter-spacing: .02em; box-shadow: 0 0 0 2px #fff; }
.fab { width: 48px; height: 48px; border-radius: 50%; background: var(--rs-orange); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px -6px rgba(226,106,27,.8); }

/* projects */
.proj { border-radius: 18px; margin-bottom: 14px; padding: 3px; }
.proj.tone-green { background: var(--rs-mint); }
.proj.tone-peach { background: var(--rs-peach); }
.proj-card { background: #fff; border-radius: 15px; padding: 14px 16px; }
.proj-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.proj-name { font-size: 18px; font-weight: 500; }
.pill-grey { font-size: 12.5px; padding: 4px 9px; border-radius: 8px; background: #EFEFEF; color: #6E6E6E; }
.proj-tags { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.tag { font-size: 13px; padding: 6px 9px; border: 1px solid #DCDCDC; border-radius: 8px; background: #fff; }
.tag.sm { font-size: 11px; padding: 3px 7px; }
.proj-more { margin-left: auto; color: #8C8C8C; }
.proj-foot { text-align: center; font-size: 13px; padding: 7px 0 5px; color: #3E6B57; }
.tone-peach .proj-foot { color: #7A5518; }
.proj-practice { display: block; width: 100%; border-radius: 18px; padding: 0 16px 14px; background: #fff; border: 1.5px dashed var(--rs-orange); position: relative; overflow: hidden; }
.pp-ribbon { display: flex; align-items: center; gap: 6px; margin: 0 -16px 12px; padding: 7px 16px; background: var(--rs-orange-soft); color: var(--rs-orange-dk); font-size: 12px; font-weight: 700; }
.pill-training { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--rs-orange-dk); background: var(--rs-orange-soft); border: 1px solid color-mix(in srgb, var(--rs-orange) 35%, #fff); padding: 3px 8px; border-radius: 7px; text-transform: uppercase; letter-spacing: .04em; }
.pp-prog { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rs-line); font-size: 13px; font-weight: 600; color: var(--rs-orange-dk); }
.promo { display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 14px; border-radius: 16px; background: #fff; border: 1px solid color-mix(in srgb, var(--rs-orange) 30%, #fff); cursor: pointer; }
.promo-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--rs-orange-soft); color: var(--rs-orange-dk); display: grid; place-items: center; flex: none; }
.promo-txt { flex: 1; }
.promo-txt b { display: block; font-size: 14.5px; }
.promo-txt small { display: block; font-size: 12.5px; color: var(--rs-muted); margin-top: 2px; line-height: 1.35; }

/* courses */
.partner-banner { border-radius: 18px; padding: 16px 16px 18px; color: #fff; background: linear-gradient(135deg, var(--partner-accent), var(--partner-dark)); position: relative; overflow: hidden; }
.partner-banner::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; border: 26px solid rgba(255,255,255,.07); }
.pb-top { display: flex; justify-content: space-between; align-items: center; }
.pb-pill { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.16); padding: 4px 8px; border-radius: 999px; }
.pb-title { font-size: 20px; font-weight: 700; margin-top: 14px; letter-spacing: -.01em; }
.pb-sub { display: flex; align-items: center; gap: 5px; font-size: 13px; opacity: .85; margin-top: 3px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -18px 0; padding: 0 18px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--rs-line); font-size: 13.5px; font-weight: 500; transition: background .2s, color .2s; }
.chip.on { background: var(--rs-ink); color: #fff; border-color: var(--rs-ink); }
.c-card { display: block; width: 100%; background: #fff; border-radius: 18px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(26,20,16,.06); border: 1px solid var(--rs-line); }
.c-card .thumb { height: 96px; }
.c-body { display: block; padding: 12px 14px 14px; }
.c-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.b-nrpp { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--rs-green); background: var(--rs-green-soft); padding: 3px 8px; border-radius: 6px; }
.b-practice { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--rs-orange); padding: 3px 8px 3px 4px; border-radius: 6px; }
.b-practice .rs-logo rect { fill: #fff; }
.b-practice .rs-logo path { stroke: var(--rs-orange); }
.b-practice .rs-logo circle { fill: var(--rs-orange); }
.b-practice.xs { font-size: 9.5px; padding: 1px 6px 1px 3px; vertical-align: 1px; }
.c-title { display: block; font-size: 16.5px; font-weight: 700; margin-top: 8px; line-height: 1.3; }
.c-meta { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--rs-muted); margin-top: 5px; }
.c-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.c-price { font-size: 17px; font-weight: 800; }
.c-rating { display: inline-flex; gap: 3px; align-items: center; font-size: 13px; font-weight: 600; color: var(--rs-ink-2); }
.c-rating .ic, .cd-stats .ic { color: #E8A317; }
.enrolled { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--rs-green); }
.mine { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; background: #fff; border-radius: 16px; border: 1px solid var(--rs-line); margin-bottom: 8px; }
.mine-thumb { width: 54px; height: 54px; border-radius: 12px; overflow: hidden; flex: none; }
.mine-thumb .thumb { height: 54px; }
.mine-thumb .thumb > :not(.thumb-glyph) { display: none; }
.mine-txt { flex: 1; min-width: 0; }
.mine-txt b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mine-txt small { display: block; font-size: 12px; color: var(--rs-muted); margin-top: 4px; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--rs-line); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; background: var(--rs-orange); border-radius: 3px; transition: width .4s var(--ease); }
.bar.big { height: 8px; margin-top: 12px; }

/* thumbnails (generic, not the partner's real imagery) */
.thumb { position: relative; display: block; overflow: hidden; color: #fff; }
.thumb.t-mit { background: linear-gradient(135deg, var(--partner-accent), var(--partner-dark)); }
.thumb.t-meas { background: linear-gradient(135deg, #1D6F7A, #0F4950); }
.thumb.t-ce { background: linear-gradient(135deg, #34507A, #1F3352); }
.thumb.t-exam { background: linear-gradient(135deg, #3E6B4E, #26442F); }
.thumb-glyph { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); opacity: .16; }
.thumb-cat { position: absolute; left: 14px; top: 12px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.thumb-hrs { position: absolute; left: 14px; bottom: 12px; font-size: 12px; opacity: .9; }
.thumb-hrs b { font-size: 26px; font-weight: 800; margin-right: 2px; }
.thumb-ce { position: absolute; right: 12px; top: 10px; width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.thumb.big { height: 200px; }
.thumb.big .thumb-hrs b { font-size: 40px; }
.thumb.big .thumb-cat { top: 64px; left: 18px; }
.thumb.big .thumb-hrs { left: 18px; bottom: 18px; }
.thumb.big .thumb-ce { top: 14px; right: 16px; width: 40px; height: 40px; font-size: 13px; }

/* course detail */
.cd-hero { position: relative; }
.cd-main { padding: 16px 18px 24px; }
.cd-provider { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--partner-accent); }
.cd-title { font-size: 22px; line-height: 1.25; letter-spacing: -.01em; margin: 8px 0 10px; }
.cd-title.sm { font-size: 19px; margin-top: 4px; }
.cd-stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 16px 0 4px; border: 1px solid var(--rs-line); border-radius: 14px; }
.cd-stats div { padding: 10px 6px; text-align: center; border-left: 1px solid var(--rs-line); }
.cd-stats div:first-child { border-left: 0; }
.cd-stats b { display: block; font-size: 14px; }
.cd-stats span { display: block; font-size: 11px; color: var(--rs-muted); margin-top: 2px; }
.cd-main h3, .pad > h3 { font-size: 16px; margin: 20px 0 8px; }
.body-p { font-size: 14.5px; line-height: 1.55; color: var(--rs-ink-2); }
.checks { display: grid; gap: 8px; }
.checks li { display: flex; gap: 8px; font-size: 14.5px; line-height: 1.4; color: var(--rs-ink-2); }
.checks .ic { color: var(--rs-green); margin-top: 1px; }
.instr { display: flex; gap: 12px; padding: 14px; border-radius: 14px; background: var(--rs-cream); }
.instr b { display: block; font-size: 15px; }
.instr small { display: block; color: var(--rs-muted); font-size: 12.5px; }
.instr p { font-size: 13.5px; color: var(--rs-ink-2); margin-top: 6px; line-height: 1.45; }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--partner-soft); color: var(--partner-accent); font-weight: 700; display: grid; place-items: center; font-size: 15px; }
.avatar.sm { width: 34px; height: 34px; font-size: 12.5px; }
.fine { font-size: 12px; color: var(--rs-muted); line-height: 1.45; margin-top: 16px; }
.cta-bar { display: flex; align-items: center; gap: 12px; }
.cta-bar.single { display: block; }
.cta-info { flex: 1; }
.cta-info b { display: flex; align-items: center; gap: 5px; font-size: 20px; }
.cta-info small { display: block; font-size: 12px; color: var(--rs-muted); }
.btn-primary, .btn-secondary, .btn-partner { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 14px; font-weight: 700; font-size: 15.5px; transition: background .2s, transform .1s; cursor: pointer; }
.btn-primary { background: var(--rs-orange); color: #fff; }
.btn-primary:hover { background: var(--rs-orange-dk); }
.btn-primary:active, .btn-partner:active { transform: scale(.985); }
.btn-primary.disabled { background: #E8C7B0; pointer-events: none; }
.btn-secondary { background: #fff; color: var(--rs-ink); border: 1.5px solid var(--rs-line); }
.btn-partner { background: var(--partner-accent); color: #fff; }
.block { display: flex; width: 100%; }
.grow { flex: 1; }

/* lesson rows */
.l-list { display: grid; gap: 8px; }
.l-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; background: #fff; border-radius: 14px; border: 1px solid var(--rs-line); }
.l-row.is-lab { background: #FFF6EE; border: 1.5px solid var(--rs-orange); box-shadow: 0 6px 16px -12px rgba(226,106,27,.7); }
.l-row.ls-locked { opacity: .7; }
.l-ic { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; }
.l-ic.t-video { background: #EAF1FB; color: #2F63B7; }
.l-ic.t-quiz { background: #EEF6EF; color: #2C7A47; }
.l-ic.t-lab { background: var(--rs-orange); color: #fff; }
.l-ic.t-exam { background: #F1EEF7; color: #5B4790; }
.l-txt { flex: 1; min-width: 0; display: block; }
.l-kicker { display: block; font-size: 11.5px; font-weight: 700; color: var(--rs-muted); text-transform: uppercase; letter-spacing: .04em; }
.l-title { display: block; font-size: 14.5px; font-weight: 600; margin-top: 2px; line-height: 1.3; }
.l-dur { display: block; font-size: 12px; color: var(--rs-muted); margin-top: 2px; }
.l-note { display: block; font-size: 11.5px; color: var(--rs-muted); margin-top: 3px; font-style: italic; }
.st { flex: none; display: inline-flex; align-items: center; }
.st-done { width: 24px; height: 24px; border-radius: 50%; background: var(--rs-green); color: #fff; justify-content: center; }
.st-current { font-size: 11px; font-weight: 700; color: var(--rs-orange-dk); background: var(--rs-orange-soft); padding: 3px 7px; border-radius: 6px; }
.st-upload { font-size: 10.5px; font-weight: 700; color: var(--rs-amber); background: var(--rs-amber-soft); padding: 3px 7px; border-radius: 6px; }
.st-locked, .st-todo { color: var(--rs-muted); }

/* player */
.pl-card { background: #fff; border-radius: 18px; padding: 16px; border: 1px solid var(--rs-line); }
.pl-title { font-size: 18px; font-weight: 700; margin-top: 8px; line-height: 1.3; }
.pl-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--rs-muted); margin-top: 8px; }
.pl-meta b { color: var(--rs-ink); }
.continue { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--rs-ink); color: #fff; }
.continue .l-kicker { color: #F2A46E; }
.continue .go { width: 34px; height: 34px; border-radius: 50%; background: var(--rs-orange); display: grid; place-items: center; flex: none; }
.cert { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 14px; border: 1px dashed #D9CFC3; color: var(--rs-muted); }
.cert span { flex: 1; }
.cert b { display: block; color: var(--rs-ink-2); font-size: 14px; }
.cert small { font-size: 12px; }

/* video */
.vid { position: relative; height: 216px; background: #0F0C0A; color: #fff; overflow: hidden; }
.vid-poster { position: absolute; inset: 0; padding: 18px 20px; background: radial-gradient(circle at 80% 20%, color-mix(in srgb, var(--partner-accent) 70%, transparent), transparent 60%), linear-gradient(140deg, #231A14, #0C0A08); display: flex; flex-direction: column; gap: 4px; }
.vid-chip { align-self: flex-start; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.14); padding: 3px 8px; border-radius: 6px; }
.vid-h { font-size: 19px; font-weight: 700; margin-top: 4px; max-width: 250px; line-height: 1.25; }
.vid-by { font-size: 12.5px; opacity: .7; }
.vid-sub { position: absolute; left: 24px; right: 24px; bottom: 54px; text-align: center; font-size: 12.5px; background: rgba(0,0,0,.6); padding: 5px 8px; border-radius: 6px; opacity: 0; transition: opacity .3s; }
.vid.playing .vid-sub { opacity: 1; }
.vid-big { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--rs-ink); display: grid; place-items: center; padding-left: 4px; transition: opacity .25s, transform .25s; }
.vid.playing .vid-big { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.85); }
.vid-ctrls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.75)); font-size: 12px; }
.vid-pp { color: #fff; display: grid; place-items: center; }
.vid-time { font-variant-numeric: tabular-nums; }
.vid-bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.vid-bar i { display: block; height: 100%; width: 0; background: var(--rs-orange); }
.vid + .pad { padding-top: 16px; }
.chapters { background: #fff; border-radius: 14px; border: 1px solid var(--rs-line); }
.chapters div { display: flex; gap: 12px; padding: 11px 14px; font-size: 14px; border-top: 1px solid var(--rs-line); }
.chapters div:first-child { border-top: 0; }
.chapters span { width: 38px; color: var(--rs-muted); font-variant-numeric: tabular-nums; }
.chapters .on { color: var(--rs-orange-dk); font-weight: 600; }

/* quiz */
.quiz-prog { display: flex; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 600; color: var(--rs-muted); margin: 4px 0 18px; }
.quiz-prog .bar { flex: 1; margin: 0; }
.quiz-q { font-size: 20px; line-height: 1.35; margin: 6px 0 18px; letter-spacing: -.01em; }
.opts { display: grid; gap: 10px; }
.opt-q { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #fff; border: 1.5px solid var(--rs-line); font-size: 14.5px; line-height: 1.4; transition: border-color .2s, background .2s; }
.opt-l { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--rs-cream); border: 1px solid var(--rs-line); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
.opt-q.picked { border-color: var(--rs-orange); background: #FFF6EE; }
.opt-q.picked .opt-l { background: var(--rs-orange); color: #fff; border-color: var(--rs-orange); }
.opt-q.right { border-color: var(--rs-green); background: var(--rs-green-soft); }
.opt-q.right .opt-l { background: var(--rs-green); color: #fff; border-color: var(--rs-green); }
.opt-q.wrong { border-color: var(--rs-red); background: #FBE9E6; }
.opt-q.wrong .opt-l { background: var(--rs-red); color: #fff; border-color: var(--rs-red); }
.feedback { display: flex; gap: 10px; margin-top: 16px; padding: 14px; border-radius: 14px; animation: fade .25s; }
.feedback.ok { background: var(--rs-green-soft); color: #165F3E; }
.feedback.bad { background: #FBE9E6; color: #8E2A1E; }
.feedback b { font-size: 15px; }
.feedback p { font-size: 13.5px; margin-top: 3px; line-height: 1.45; }

/* lab */
.lab-hero { margin-top: 2px; padding: 18px; border-radius: 18px; background: linear-gradient(150deg, #FFF3E8, #FFE4CF); border: 1px solid color-mix(in srgb, var(--rs-orange) 30%, #fff); }
.lab-hero h2 { font-size: 20px; line-height: 1.3; margin-top: 12px; letter-spacing: -.01em; }
.lab-meta { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--rs-ink-2); }
.lab-meta span { display: inline-flex; gap: 5px; align-items: center; }
.lab-status { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 10px; border-radius: 8px; background: var(--rs-green); color: #fff; font-size: 12.5px; font-weight: 700; }
.steps { counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; position: relative; padding: 11px 12px 11px 50px; background: #fff; border: 1px solid var(--rs-line); border-radius: 14px; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; background: var(--rs-ink); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.steps b { display: block; font-size: 14px; }
.steps small { display: block; font-size: 12.5px; color: var(--rs-muted); margin-top: 1px; }
.pp-mini { margin-top: 18px; border-radius: 16px; background: #fff; border: 1.5px dashed var(--rs-orange); overflow: hidden; padding: 0 14px 14px; }
.pp-mini .pp-ribbon { margin: 0 -14px 12px; }
.pp-mini-row { display: flex; gap: 12px; align-items: center; }
.pp-mini-plan { width: 112px; flex: none; background: var(--rs-cream); border-radius: 10px; padding: 4px; }
.pp-mini-row b { display: block; font-size: 15px; }
.pp-mini-row small { display: block; font-size: 12.5px; color: var(--rs-muted); }
.pp-mini-row .proj-tags { margin-top: 8px; }

/* practice project */
.pp-top { display: flex; align-items: center; gap: 6px; padding: 2px 10px 8px; }
.pp-ttl { flex: 1; text-align: center; }
.pp-ttl b { display: block; font-size: 16px; }
.pp-ttl small { display: block; font-size: 12px; color: var(--rs-muted); }
.pp-banner { display: flex; align-items: center; gap: 8px; margin: 0 18px; padding: 9px 12px; border-radius: 12px; background: repeating-linear-gradient(-45deg, #FFF1E4, #FFF1E4 10px, #FFE9D6 10px, #FFE9D6 20px); border: 1.5px dashed var(--rs-orange); color: var(--rs-orange-dk); font-size: 13px; }
.pp-banner span:nth-child(2) { flex: 1; }
.pp-banner b { color: var(--rs-ink); }
.seg { display: flex; margin: 12px 18px 14px; padding: 3px; background: #EDE5DA; border-radius: 12px; }
.seg button { flex: 1; text-align: center; padding: 8px 0; font-size: 13.5px; font-weight: 600; color: var(--rs-ink-2); border-radius: 9px; transition: background .2s; }
.seg button.on { background: #fff; color: var(--rs-ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.canvas-card { background: #fff; border-radius: 16px; border: 1px solid var(--rs-line); padding: 8px 8px 10px; background-image: radial-gradient(circle at 1px 1px, #EDE6DC 1px, transparent 0); background-size: 14px 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 6px 6px 0; font-size: 11.5px; color: var(--rs-ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 11px; height: 11px; }
.lg-tp { border-radius: 50%; background: var(--rs-red); }
.lg-th { background: #2F63B7; transform: rotate(45deg) scale(.8); }
.lg-sp { border-radius: 50%; border: 3px solid var(--rs-orange); }
.lg-pipe { height: 4px !important; width: 16px !important; background: var(--rs-orange); border-radius: 2px; }
.lg-fan { border-radius: 50%; background: var(--rs-ink); }
.lg-ex { border-radius: 50%; background: #2B8C9A; }
.readings { background: #fff; border-radius: 14px; border: 1px solid var(--rs-line); }
.rd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--rs-line); font-size: 14px; }
.rd:first-child { border-top: 0; }
.rd-id { font-size: 11.5px; font-weight: 800; color: #fff; background: var(--rs-red); padding: 2px 6px; border-radius: 6px; }
.rd-id.th { background: #2F63B7; }
.rd-room { flex: 1; }
.rd-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.rd-val.bad { color: var(--rs-red); }
.rd-val.good { color: var(--rs-green); }
.rd-note { display: flex; align-items: center; gap: 6px; padding: 9px 14px; font-size: 12px; color: var(--rs-muted); border-top: 1px solid var(--rs-line); }
.toolbar { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
.tool { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #fff; border: 1px solid var(--rs-line); color: var(--rs-ink-2); }
.tool.on { background: var(--rs-ink); color: #fff; border-color: var(--rs-ink); }
.bom-chip { margin-left: auto; font-size: 11.5px; font-weight: 700; padding: 6px 9px; border-radius: 8px; background: var(--rs-green-soft); color: var(--rs-green); white-space: nowrap; }
.comp { margin-top: 14px; background: #fff; border-radius: 16px; border: 1px solid var(--rs-line); overflow: hidden; }
.comp-head { padding: 12px 14px; border-bottom: 1px solid var(--rs-line); }
.comp-head b { display: block; font-size: 14px; }
.comp-sum { display: flex; gap: 6px; margin-top: 6px; }
.comp-sum span { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.comp-sum .ok { background: var(--rs-green-soft); color: var(--rs-green); }
.comp-sum .warn { background: var(--rs-amber-soft); color: var(--rs-amber); }
.comp-sum .pend { background: #EFEFEF; color: #6E6E6E; }
.ck { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--rs-line); }
.ck:first-of-type { border-top: 0; }
.ck-ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.ck.pass .ck-ic { background: var(--rs-green-soft); color: var(--rs-green); }
.ck.warn .ck-ic { background: var(--rs-amber-soft); color: var(--rs-amber); }
.ck.pending .ck-ic { background: #EFEFEF; color: #7A7A7A; }
.ck.warn { background: #FFFAF0; }
.ck.fixed { animation: flashGreen 1.2s var(--ease); }
.ck-txt { flex: 1; }
.ck-txt b { display: block; font-size: 13.5px; font-weight: 600; }
.ck-txt small { display: block; font-size: 12px; color: var(--rs-muted); margin-top: 1px; }
.ck.warn small { color: var(--rs-amber); font-weight: 600; }
.btn-warn { margin-top: 8px; padding: 7px 12px; border-radius: 9px; background: var(--rs-amber); color: #fff; font-size: 12.5px; font-weight: 700; }

/* plan SVG */
.plan { display: block; width: 100%; height: auto; font-family: var(--font); }
.pl-floor { fill: #FFFDF9; }
.pl-walls { fill: none; stroke: #3B322B; stroke-width: 3; stroke-linecap: square; }
.pl-outer { stroke-width: 5; }
.pl-win { stroke: #8CC6E8; stroke-width: 5; }
.pl-win.warn { stroke: var(--rs-amber); stroke-width: 7; }
.pl-room { font-size: 10px; font-weight: 600; fill: #9A8E83; text-transform: uppercase; letter-spacing: .06em; }
.pl-fixture { fill: #F1ECE5; stroke: #C9BEB2; stroke-width: 1.2; }
.pl-fx-t { font-size: 7.5px; font-weight: 700; fill: #8A7F75; }
.pl-stairs { stroke: #CFC5BA; stroke-width: 1.5; }
.pl-tp circle { fill: var(--rs-red); stroke: #fff; stroke-width: 2.5; }
.pl-tp text { font-size: 10px; font-weight: 800; fill: #fff; }
.pl-tag-bad { fill: #fff; stroke: color-mix(in srgb, var(--rs-red) 45%, #fff); stroke-width: 1.2; }
.pl-tp .pl-tag-t { font-size: 9.5px; font-weight: 700; fill: var(--rs-red); }
.pl-th rect { fill: #2F63B7; stroke: #fff; stroke-width: 2; }
.pl-th-t { font-size: 8.5px; font-weight: 700; fill: #2F63B7; }
.pl-tp-muted { fill: #E9B7B0; }
.pl-th-muted { fill: #B6C8E6; }

.rpt-title { font-size: 18px; font-weight: 800; margin-top: 10px; }

.rpt-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }

.rpt-stats b { display: block; font-size: 14px; }
.rpt-stats span { font-size: 7.5px; color: #777; }
.rpt-sec { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--rs-orange-dk); margin: 8px 0 4px; }

/* profile */

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 27; background: #fff; border-radius: 26px 26px 0 0; padding-bottom: 34px; box-shadow: 0 -12px 40px -10px rgba(0,0,0,.3); max-height: 92%; overflow-y: auto; }

.cam { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at 50% 40%, #3A3530, #0C0B0A 70%); }

.store { padding: 0 18px 24px; }
.store-nav { display: flex; align-items: center; gap: 2px; color: #0A7AFF; font-size: 16px; padding: 4px 0 14px; }

   BROWSER FRAME + PARTNER PORTAL
   ========================================================================= */

.br-bar { flex: none; height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #ECEDF0; border-bottom: 1px solid #DADDE2; color: #6B7280; }

/* QR placeholder pattern (not a real code) */
function qrSVG(size = 200, seed = 4821) {
  const n = 29;
  let s = seed;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280), s / 233280);
  const finder = (x, y) => x < 8 && y < 8 ? 1 : x > n - 9 && y < 8 ? 1 : x < 8 && y > n - 9 ? 1 : 0;
  const centre = (x, y) => x > 10 && x < 18 && y > 10 && y < 18;
  let cells = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (finder(x, y) || centre(x, y)) continue;
    if (rnd() > 0.5) cells += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  const fp = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#111"/>`;
  return `<svg class="qr" width="${size}" height="${size}" viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-label="QR code placeholder">
    <rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><g fill="#111">${cells}</g>
    ${fp(0, 0)}${fp(n - 7, 0)}${fp(0, n - 7)}
    <rect x="11" y="11" width="7" height="7" rx="1.6" fill="#E26A1B"/><path d="M12.6 15 14.5 13.4l1.9 1.6v1.6h-3.8z" fill="#fff" shape-rendering="geometricPrecision"/>
  </svg>`;
}

  submit(a, enter) {

        <span class="ok-circle">${ic("check", 34)}</span>
        <h3>Submitted to ${P.name}</h3><p class="muted">Your instructor will review it.</p>

          <div><span>Report</span><b>Training report · 4 pages</b></div>

          <small>Sends your report, design and compliance results straight to your course.</small>
          <span class="conn-pill"><i></i>Connected to ${P.name}</span></span></button>
        <button class="opt ${ch === "pdf" ? "on" : ""}" data-action="chooseSubmit" data-arg="pdf">
          <i class="radio ${ch === "pdf" ? "on" : ""}"></i>
          <span><b>Download PDF to upload myself</b><small>Save the training report and upload it on the course portal.</small></span></button>

function renderApp(a) {
  const scr = SCREENS[a.screen](a);
  const enter = a.screen !== LAST.phone ? "enter" : "";
  LAST.phone = a.screen;
  const sheetEnter = a.sheet && a.sheet !== LAST.sheet ? "enter" : "";
  LAST.sheet = a.sheet;
  const dismissable = (a.sheet === "checkout" && a.checkoutStep === "form") || (a.sheet === "submit" && a.submitStep === "choose");
  return `<div class="phone-screen th-${scr.theme || "cream"}">
    ${statusbar()}
    <div class="app-body ${enter}" data-scroll="app-${a.screen}">${scr.html}</div>
    ${scr.footer ? `<div class="app-footer">${scr.footer}</div>` : ""}
    ${scr.tab ? tabbar(scr.tab, a) : ""}
    ${a.sheet ? `<div class="scrim ${sheetEnter}" ${dismissable ? 'data-action="closeSheet"' : ""}></div>${SHEETS[a.sheet](a, sheetEnter)}` : ""}
    ${a.toast ? `<div class="app-toast">${ic("check", 16)}<span>${a.toast}</span></div>` : ""}
    <div class="home-ind"></div>
  </div>`;
}
function phoneFrame(inner, scale) {
  return `<div class="phone-wrap" style="width:${414 * scale}px;height:${868 * scale}px"><div class="phone" style="transform:scale(${scale})">${inner}<div class="island"></div></div></div>`;
}

function browserFrame(inner, w, h, naturalW, path) {
  const vh = h - 46, s = w / naturalW;
  return `<div class="browser" style="width:${w}px;height:${h}px">
    <div class="br-bar"><span class="br-dots"><i></i><i></i><i></i></span><span class="br-nav">${ic("arrow-left", 15)}${ic("arrow", 15)}${ic("refresh", 14)}</span>
      <span class="br-url">${ic("lock", 12)}<b>${P.portalDomain}</b>${path}</span><span class="br-end">${ic("more", 16)}</span></div>
    <div class="br-view" style="height:${vh}px"><div class="br-scale" style="width:${naturalW}px;height:${vh / s}px;transform:scale(${s})">${inner}</div></div>
  </div>`;
}

function portalLessonStatus(p, id) {
  const approved = p.submission === "approved";
  if (id === "l1" || id === "l2") return "done";
  if (id === "l3") return approved ? "done" : ["synced", "uploaded"].includes(p.submission) ? "review" : "current";
  return approved ? "open" : "locked";
}

function renderPortal(p) {
  const key = p.view + ":" + p.lesson;
  const enter = key !== LAST.portal ? "enter" : "";
  LAST.portal = key;
  const L = CONFIG.learner, I = CONFIG.instructor;
  const learner = p.view === "learner";
  const nav = learner ? ["Catalog", "My learning", "Certificates", "Help"] : ["Dashboard", "Courses", "Submissions", "Reports"];
  const on = learner ? "My learning" : "Submissions";
  return `<div class="portal" data-scroll="portal-${p.view}">
    <header class="p-head">
      <div class="p-brand">${partnerLogo()}<span class="p-name">${P.name}</span></div>
      <nav class="p-nav">${nav.map((n) => `<span class="${n === on ? "on" : ""}">${n}</span>`).join("")}</nav>
      <div class="p-right">${ic("search", 18)}${ic("bell", 18)}<span class="p-avatar">${learner ? L.initials : I.initials}</span><span class="p-uname">${learner ? L.name : I.name}<small>${learner ? "Learner" : "Instructor"}</small></span></div>
    </header>
    <div class="p-page ${enter}">${learner ? portalLearner(p) : portalInstructor(p)}</div>
    ${p.toast ? `<div class="p-toast">${ic("check", 16)} ${p.toast}</div>` : ""}
  </div>`;
}

function portalLearner(p) {
  const c = FEATURED();
  const doneCount = ["l1", "l2", "l3", "l4"].filter((l) => portalLessonStatus(p, l) === "done").length;
  const pct = Math.round((doneCount / 4) * 100);
  const stIcon = { done: ic("check", 14), review: ic("clock", 14), current: "", locked: ic("lock", 13), open: "" };
  const stText = { done: "Complete", review: "In review", current: "In progress", locked: "Locked", open: "Unlocked" };
  return `<div class="p-course-head" data-anchor="top">
      <div class="p-crumb">My learning <span>›</span> ${c.title}</div>
      <div class="p-ch-row">
        <div><h1>${c.title}</h1>
          <div class="p-ch-meta"><span class="p-badge">${ic("shield", 13)} NRPP-approved</span><span>${c.hours} CE hours</span><span>·</span><span>${c.format}</span><span>·</span><span>Instructor: ${CONFIG.instructor.name}</span></div></div>
        <div class="p-progress"><div class="p-prog-label"><span>Course progress</span><b>${pct}%</b></div><div class="p-bar"><i style="width:${pct}%"></i></div><small>${doneCount} of 4 lessons complete</small></div>
      </div>
    </div>
    <div class="p-body">
      <aside class="p-side">
        <div class="p-side-title">Course content</div>
        ${c.lessons.map((l, i) => {
          const st = portalLessonStatus(p, l.id);
          return `<button class="p-lesson pst-${st} ${p.lesson === l.id ? "sel" : ""}" data-action="pLesson" data-arg="${l.id}">
            <span class="p-l-st">${stIcon[st] || `<i>${i + 1}</i>`}</span>
            <span class="p-l-txt"><small>Lesson ${i + 1} · ${TYPE_LABEL[l.type]}</small><b>${l.type === "lab" ? "Practice Lab: Design a mitigation system in RadonSketch" : l.title}</b><em>${stText[st]}</em></span>
          </button>`;
        }).join("")}
        <div class="p-help">${ic("message", 16)}<span>Questions? <u>Message your instructor</u></span></div>
      </aside>
      <main class="p-main">${portalLessonContent(p)}</main>
    </div>`;
}

function portalLessonContent(p) {
  const c = FEATURED(), PP = CONFIG.practiceProject;
  if (p.lesson === "l1") {
    return `<div class="p-kicker">Lesson 1 · Video series</div><h2>${c.lessons[0].title}</h2>
      <div class="p-video"><span class="p-play">${ic("play", 30)}</span><span class="p-vcap">Part 1 of 14 · Why radon matters</span></div>
      <div class="p-done-line">${ic("check", 16)} Completed · 14 of 14 videos watched</div>`;
  }
  if (p.lesson === "l2") {
    return `<div class="p-kicker">Lesson 2 · Quiz</div><h2>${c.lessons[1].title}</h2>
      <div class="p-card p-score"><div class="p-score-big">${CONFIG.quiz.score}</div><div><b>Passed · 90%</b><small>Completed Nov 4 · passing score 70%</small></div></div>`;

        : `<div class="p-card p-locked">${ic("lock", 26)}<div><b>Locked</b><small>Complete the Practice Lab and get it approved to unlock the final exam.</small></div></div>`}`;
  }
  return `<div class="p-lab">
    <div class="p-kicker">Lesson 3 · Practice Lab <span class="p-powered">${rsLogo(16)} Powered by RadonSketch</span></div>
    <h2>Practice Lab: Design a mitigation system in RadonSketch</h2>
    <p class="p-lead">Apply what you learned in Lessons 1–2 to a realistic sample home. You'll work in the RadonSketch mobile app, then submit your design report here.</p>
    <div class="p-lab-grid">
      <div class="p-lab-left">
        <div class="p-card"><h4>What you'll practise</h4><ul class="p-ul">${PP.practise.map((x) => `<li>${ic("check", 15)}${x}</li>`).join("")}</ul>
          <div class="p-est">${ic("clock", 16)} Estimated time: <b>45 minutes</b> · graded by your instructor</div></div>
        <div class="p-card"><h4>How it works</h4>
          <ol class="p-steps">
            <li><i>1</i><div><b>Download RadonSketch</b><small>Scan the QR code or use the store buttons. Free for enrolled learners.</small></div></li>
            <li><i>2</i><div><b>Sign in</b><small>Use ${CONFIG.learner.email} so your course links automatically.</small></div></li>

        <div class="p-note">${ic("info", 17)}<span><b>Already use RadonSketch?</b> Your practice project is waiting under <b>Courses</b>.</span></div>

        <div class="p-qr">${qrSVG(196)}</div>
        <div class="p-stores"><span class="store-btn">${ic("download", 15)}<span><small>Download on the</small>App Store</span></span><span class="store-btn">${ic("play", 14)}<span><small>Get it on</small>Google Play</span></span></div>
        <div class="p-or"><span>or enter this code in the app</span></div>
        <div class="p-code"><span>Course code:</span><b>${CONFIG.courseCode}</b>${ic("copy", 15)}</div>
      </div>
    </div>
    ${portalSubmission(p)}
  </div>`;
}

function portalSubmission(p) {
  const cc = complianceCounts(true), L = CONFIG.learner, I = CONFIG.instructor;
  const sw = (id, label, match) => `<button class="${match.includes(p.submission) ? "on" : ""}" data-action="pState" data-arg="${id}">${label}</button>`;
  const segs = complianceItems(true).map((c) => `<i class="${c.status}"></i>`).join("");
  const checks = `<div class="p-checks"><div class="p-checks-head"><b>Auto-check summary from RadonSketch</b><span>${cc.pass} of ${cc.total} compliance checks passed</span></div>
    <div class="p-seg">${segs}</div>
    <ul><li class="pass">${ic("check", 13)} Suction point, pipe size & slope, fan location</li><li class="pass">${ic("check", 13)} Exhaust ≥ 10 ft from openings <em>(fixed by learner)</em></li><li class="pending">${ic("clock", 13)} Post-mitigation test — pending field verification</li></ul></div>`;
  let body = "";
  if (p.submission === "waiting") {
    body = `<div class="p-wait">
      <span class="p-wait-ic">${ic("hourglass", 26)}</span>
      <div><b>Waiting for your submission</b><small>When you submit from RadonSketch, your report and auto-check results appear here automatically.</small>
      <div class="p-conn ${p.connected ? "on" : ""}">${p.connected ? `<i></i>RadonSketch connected · ${L.email}` : `${ic("phone", 14)} RadonSketch not connected yet — scan the QR code above to start`}</div></div>
      <button class="p-link" data-action="pState" data-arg="manual">Prefer to upload a PDF?</button>
    </div>`;
  } else if (p.submission === "synced" || p.submission === "approved") {
    const approved = p.submission === "approved";
    body = `<div class="p-sub-grid">
      <div class="p-thumb">${scaled(reportDoc(true), 168, 420, 594)}</div>
      <div class="p-sub-info">
        <div class="p-status ${approved ? "ok" : "sub"}">${ic("check", 15)} ${approved ? `Approved by ${I.name}` : "Submitted"}</div>
        <div class="p-sync-line">${rsLogo(16)} Synced automatically from RadonSketch · ${CONFIG.submittedAt}</div>
        <div class="p-file">${ic("file", 16)} Training report — ${CONFIG.practiceProject.name}.pdf <span>· 4 pages</span></div>
        ${checks}
        ${approved
          ? `<div class="p-feedback"><span class="p-avatar sm">${I.initials}</span><div><b>${I.name}</b><p>“${I.feedback}”</p></div></div>
             <div class="p-actions"><button class="p-btn" data-action="pLesson" data-arg="l4">Lesson 4 unlocked — start final exam ${ic("arrow", 15)}</button></div>`
          : `<div class="p-review-line">${ic("clock", 15)} Awaiting instructor review · usually within 2 business days</div>
             <div class="p-actions"><button class="p-btn ghost" data-action="noop">${ic("eye", 15)} View report</button><button class="p-btn ghost" data-action="noop">Withdraw</button></div>`}
      </div></div>`;
  } else if (p.submission === "manual") {
    const up = p.upload === "uploading";
    body = `<div class="p-drop ${up ? "busy" : ""}" data-action="pUpload">
      ${ic("upload", 30)}<b>Upload your RadonSketch report (PDF)</b>
      <small>Drag and drop here, or <u>browse files</u> · PDF up to 20 MB</small>
      ${up ? `<div class="p-upbar"><i></i></div><small>Uploading Training-report_Prairie-View.pdf…</small>` : ""}
    </div>
    <div class="p-hint">${ic("info", 15)} Tip: submitting from the app syncs automatically and includes auto-check results.</div>`;
  } else if (p.submission === "uploaded") {
    body = `<div class="p-sub-grid">
      <div class="p-thumb">${scaled(reportDoc(true), 168, 420, 594)}</div>
      <div class="p-sub-info">
        <div class="p-status sub">${ic("check", 15)} Submitted</div>
        <div class="p-sync-line">${ic("upload", 15)} Uploaded manually · ${CONFIG.uploadedAt}</div>
        <div class="p-file">${ic("file", 16)} Training-report_Prairie-View.pdf <span>· 1.8 MB</span></div>
        <div class="p-hint warn">${ic("info", 15)} Auto-check results aren't available for manual uploads. Your instructor will review the PDF.</div>
        <div class="p-review-line">${ic("clock", 15)} Awaiting instructor review</div>
      </div></div>`;
  }
  return `<section class="p-sub" data-anchor="submission">
    <div class="p-sub-head"><h3>Your submission</h3>
      <div class="demo-switch"><span>Demo state</span>${sw("waiting", "Waiting", ["waiting"])}${sw("synced", "Synced", ["synced", "approved"])}${sw("manual", "Manual upload", ["manual", "uploaded"])}</div></div>
    ${body}
  </section>`;
}

function portalInstructor(p) {
  const rows = CONFIG.reviewQueue.map((r) => ({ ...r, status: p.reviews[r.id] || (r.id === "r1" && p.submission === "approved" ? "approved" : r.status) }));
  const sel = rows.find((r) => r.id === p.selected) || rows[0];
  const stLabel = { review: "Needs review", approved: "Approved", changes: "Changes requested" };
  const review = rows.filter((r) => r.status === "review").length;
  const checksFor = (r) => {
    if (r.source === "pdf") return `<div class="i-nochecks">${ic("info", 15)} Manual PDF upload — no auto-check data. Review the PDF directly.</div>`;
    const items = r.id === "r1" ? complianceItems(true) : CONFIG.compliance.map((c, i) => ({ ...c, status: c.status === "pending" ? "pending" : i < r.passed ? "pass" : "warn", detail: "" }));
    return `<ul class="i-checks">${items.map((c) => `<li class="${c.status}">${c.status === "pass" ? ic("check", 13) : c.status === "warn" ? ic("alert", 13) : ic("clock", 13)}<span>${c.label}</span></li>`).join("")}</ul>`;
  };
  return `<div class="p-course-head">
      <div class="p-crumb">Instructor <span>›</span> ${FEATURED().title} <span>›</span> Lesson 3</div>
      <div class="p-ch-row"><div><h1>Practice Lab submissions</h1><div class="p-ch-meta"><span class="p-badge">${rsLogo(14)} Auto-checks by RadonSketch</span><span>Lesson 3 · Design a mitigation system</span></div></div></div>
    </div>
    <div class="i-wrap">
      <div class="i-grid">
      <div class="i-leftcol">
      <div class="i-stats">
        <div><b>${rows.length + 7}</b><small>Submissions this month</small></div><div><b>${review}</b><small>Awaiting your review</small></div>
        <div><b>8.1 / 9</b><small>Average compliance score</small></div><div><b>83%</b><small>Synced from RadonSketch</small></div>
      </div>
        <div class="i-table">
          <div class="i-tr i-th"><span>Learner</span><span>Submitted</span><span>Source</span><span>Auto-checks</span><span>Status</span></div>
          ${rows.map((r) => `<button class="i-tr ${r.id === sel.id ? "sel" : ""}" data-action="pSelect" data-arg="${r.id}">
            <span class="i-name"><span class="p-avatar sm">${r.name.split(" ").map((x) => x[0]).join("")}</span>${r.name}</span>
            <span>${r.when}</span>
            <span>${r.source === "sync" ? `<em class="src sync">${rsLogo(13)} Synced</em>` : `<em class="src pdf">${ic("upload", 13)} Manual PDF</em>`}</span>
            <span>${r.passed == null ? `<span class="muted">—</span>` : `<b class="sc ${r.passed >= 8 ? "good" : r.passed >= 7 ? "mid" : "low"}">${r.passed} / 9</b>`}</span>
            <span><em class="rv-st ${r.status}">${stLabel[r.status]}</em></span>
          </button>`).join("")}
        </div>
      </div>
        <div class="i-detail">
          <div class="i-d-head"><span class="p-avatar">${sel.name.split(" ").map((x) => x[0]).join("")}</span><div><b>${sel.name}</b><small>${sel.when} · ${sel.source === "sync" ? "synced from RadonSketch" : "manual PDF upload"}</small></div><em class="rv-st ${sel.status}">${stLabel[sel.status]}</em></div>
          <div class="i-d-body">
            <div class="i-prev">${scaled(reportDoc(true), 150, 420, 594)}</div>
            <div class="i-d-checks"><b>Auto-check results</b>${checksFor(sel)}</div>
          </div>
          <textarea class="i-fb" placeholder="Feedback for the learner (optional)">${sel.status === "approved" && sel.id === "r1" ? CONFIG.instructor.feedback : ""}</textarea>
          <div class="i-acts">
            <button class="p-btn ghost" data-action="pRequest">Request changes</button>
            <button class="p-btn" data-action="pApprove">${ic("check", 15)} Approve</button>
          </div>
          <p class="i-fine">Approving marks Lesson 3 complete and unlocks Lesson 4 (Final exam) for the learner.</p>
        </div>
      </div>
    </div>`;
}

        <div class="hd-flow f1"><span class="hd-num">1</span><div><b>RadonSketch users → partner courses</b><small>A Courses tab in the app: browse, buy and take NRPP-approved courses</small></div><svg viewBox="0 0 300 24" class="hd-arrow"><path d="M4 12h284"/><path d="m280 4 10 8-10 8"/></svg></div>
        <div class="hd-mid">${ic("sync", 18)} Shared practice projects & report sync</div>
        <div class="hd-flow f2"><svg viewBox="0 0 300 24" class="hd-arrow"><path d="M296 12H12"/><path d="m20 4-10 8 10 8"/></svg><span class="hd-num">2</span><div><b>Partner learners → RadonSketch</b><small>Practice Lab steps introduce the app via QR code and a ready-made project</small></div></div>
      </div>
      <div class="hd-node partner">
        <div class="hd-logo">${partnerLogo()}</div><b>${P.name}</b><small>NRPP-approved online radon courses</small>
        <ul><li>Measurement & Mitigation</li><li>Continuing Education</li><li>Exam Prep</li></ul>
      </div>
    </div>
    <div class="hub-cards">
      <button class="hub-card" data-action="mode" data-arg="flowA"><span class="hc-ic rs">${ic("phone", 26)}</span><span class="hc-tag">Flow A · Phone</span><b>Courses inside the RadonSketch app</b><small>Browse, buy and take partner courses in the app, including the Practice Lab, report and submission.</small><span class="hc-go">Open ${ic("arrow", 16)}</span></button>
      <button class="hub-card" data-action="mode" data-arg="flowB"><span class="hc-ic partner">${ic("monitor", 26)}</span><span class="hc-tag">Flow B · Web</span><b>Practice Lab on the partner's course portal</b><small>QR code and course code, submission states, and instructor review with auto-checks.</small><span class="hc-go">Open ${ic("arrow", 16)}</span></button>
      <button class="hub-card feature" data-action="mode" data-arg="story"><span class="hc-ic both">${ic("split", 26)}</span><span class="hc-tag">Presenter mode · ${STORY.length} steps</span><b>Full story — both flows side by side</b><small>Portal and phone update together, one step at a time, with a caption for each step.</small><span class="hc-go">Start ${ic("arrow", 16)}</span></button>
    </div>
    <p class="hub-tip">Tips: In Full story, use ← → to move between steps. Press Esc to return to this hub at any time.</p>
  </div>`;
}

function renderFlowA() {
  const a = S.app, cur = currentAKey(a), note = NOTES[cur] || NOTES.projects;
  return `${topbar("Flow A · Courses inside the RadonSketch app", "RadonSketch mobile app · iOS / Android", `<button class="tb-btn" data-action="reset">${ic("refresh", 15)} Reset flow</button>`)}
  <aside class="fa-left panel">
    <div class="panel-title">Screens</div>
    ${A_JUMPS.map((j) => `<button class="jump ${cur === j.key ? "on" : ""}" data-action="aJump" data-arg="${j.key}"><em>${j.tag}</em><span>${j.label}</span></button>`).join("")}
  </aside>
  <div class="fa-phone frame">${phoneFrame(renderApp(a), 0.92)}</div>
  <aside class="fa-right panel">
    <div class="panel-title">Presenter notes</div>
    <h3>${note.title}</h3>
    <ul>${note.points.map((x) => `<li>${x}</li>`).join("")}</ul>
    <div class="panel-hint">${ic("pointer", 15)} Click inside the phone to move through the app. Use the list on the left to jump to any screen.</div>
  </aside>`;
}

function renderFlowB() {
  const p = S.portal;
  const right = `<div class="seg-tb"><button class="${p.view === "learner" ? "on" : ""}" data-action="pView" data-arg="learner">${ic("user", 15)} Learner view</button><button class="${p.view === "instructor" ? "on" : ""}" data-action="pView" data-arg="instructor">${ic("users", 15)} Instructor view</button></div>
    <button class="tb-btn" data-action="reset">${ic("refresh", 15)} Reset</button>`;
  const path = p.view === "learner" ? P.portalPath : "/instructor/submissions/lesson-3";
  return `${topbar("Flow B · Practice Lab on the partner's course portal", "Partner learning portal · desktop web", right)}
    <div class="fb-browser frame">${browserFrame(renderPortal(p), 1376, 774, 1376, path)}</div>`;
}

function renderStory() {
  const n = S.story.step, st = STORY[n];
  const dimP = st.focus === "app" ? "is-dim" : "", dimA = st.focus === "portal" ? "is-dim" : "";
  return `${topbar("Full story · both flows side by side", "Partner portal (web) + RadonSketch (phone)", `<button class="tb-btn" data-action="reset">${ic("refresh", 15)} Reset demo</button>`)}
    <div class="st-lbl b">${ic("monitor", 15)} ${P.name} · course portal (web)</div>
    <div class="st-lbl a">${ic("phone", 15)} RadonSketch app</div>
    <div class="st-browser frame ${dimP}">${browserFrame(renderPortal(S.portal), 940, 612, 1280, P.portalPath)}</div>
    <div class="st-phone frame ${dimA}">${phoneFrame(renderApp(S.app), 0.705)}</div>
    <div class="st-caption">
      <div class="st-text">
        <div class="st-count">Step ${n + 1} of ${STORY.length}</div>
        <div class="st-title">${st.title}</div>
        <div class="st-cap">${st.caption}</div>
      </div>
      <div class="st-side">
        <div class="st-ctrls">
          <button class="btn-ghost" data-action="prev" ${n === 0 ? "disabled" : ""}>${ic("arrow-left", 16)} Back</button>
          <button class="btn-next" data-action="next" ${n === STORY.length - 1 ? "disabled" : ""}>${n === STORY.length - 1 ? "Journey complete" : "Next step"} ${ic("arrow", 16)}</button>
        </div>
        <div class="st-dots">${STORY.map((s, i) => `<button class="${i === n ? "on" : i < n ? "past" : ""}" data-action="jump" data-arg="${i}" title="${s.title}"></button>`).join("")}</div>
      </div>
    </div>`;
}

/* ===========================================================================
   Render loop
   =========================================================================== */
function render() {
  const root = document.getElementById("stage");
  const scrolls = {};
  root.querySelectorAll("[data-scroll]").forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
  let html = "";
  if (S.mode === "hub") html = renderHub();
  else if (S.mode === "flowA") html = renderFlowA();
  else if (S.mode === "flowB") html = renderFlowB();
  else html = renderStory();
  root.className = "mode-" + S.mode;
  root.innerHTML = html + `<div class="proto-label">Prototype · sample data</div>`;
  root.querySelectorAll("[data-scroll]").forEach((el) => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  afterRender(root);
}

function afterRender(root) {
  // Video playback simulation
  const playing = S.mode === "flowA" && S.app.screen === "video" && S.app.video.playing;
  if (playing && !vidTimer) {
    vidTimer = setInterval(() => {
      const v = S.app.video; v.t = Math.min(768, v.t + 3);
      const f = document.getElementById("vidFill"), t = document.getElementById("vidTime");
      const fm = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
      if (f) f.style.width = (v.t / 768) * 100 + "%";
      if (t) t.textContent = fm(v.t) + " / 12:48";
      if (v.t >= 768) { v.playing = false; render(); }
    }, 120);
  } else if (!playing && vidTimer) { clearInterval(vidTimer); vidTimer = null; }

  // Story: scroll the portal to the part that matters for this step
  if (S.mode === "story" && LAST.story !== S.story.step) {
    LAST.story = S.story.step;
    const anchor = STORY[S.story.step].scroll;
    const sc = root.querySelector(".st-browser .portal");
    const el = sc && root.querySelector(`.st-browser [data-anchor="${anchor}"]`);
    if (sc && el) {
      const scale = 940 / 1280 * (root.getBoundingClientRect().width / 1440);
      const top = (el.getBoundingClientRect().top - sc.getBoundingClientRect().top) / scale + sc.scrollTop - 16;
      sc.scrollTo({ top: anchor === "top" ? 0 : top, behavior: "smooth" });
    }
  }
}

function later(ms, fn) {
  const e = EPOCH;
  setTimeout(() => { if (e !== EPOCH) return; fn(); render(); }, ms);
}
function toast(msg) {
  S.app.toast = msg;
  clearTimeout(toastTimer);
  const e = EPOCH;
  toastTimer = setTimeout(() => { if (e !== EPOCH) return; S.app.toast = null; render(); }, 2400);
}
function portalToast(msg) {
  S.portal.toast = msg;
  const e = EPOCH;
  setTimeout(() => { if (e !== EPOCH) return; S.portal.toast = null; render(); }, 2800);
}
function go(screen) { const a = S.app; a.history.push(a.screen); a.screen = screen; a.sheet = null; }
function back() { const a = S.app; a.video.playing = false; a.screen = a.history.pop() || "projects"; a.sheet = null; }
function markDone(cid, lid) { S.app.done[doneKey(cid, lid)] = true; }
function openMode(m) {
  EPOCH++; LAST.phone = LAST.sheet = LAST.portal = null; LAST.story = -1;
  S = m === "story" ? storyState(0) : freshState(m);
}

/* ===========================================================================
   Actions (data-action="…" on any element)
   =========================================================================== */
const ACTIONS = {
  noop() {},
  mode: (m) => openMode(m),
  hub() { EPOCH++; S = freshState("hub"); },
  reset() { openMode(S.mode); },

  // app navigation
  tab(t) { const a = S.app; a.screen = t; a.history = []; a.sheet = null; if (t === "courses") a.coursesSeen = true; },
  back,
  openCourse(id) { S.app.courseId = id; go("course"); },
  openPlayer(id) { S.app.courseId = id; go("player"); },
  cat(c) { S.app.category = c; },
  openPracticeCard() { S.app.lessonId = "l3"; S.app.courseId = CONFIG.featuredCourseId; go("pp-diag"); },

  // checkout
  enroll() { const a = S.app; a.sheet = "checkout"; a.checkoutStep = "form"; },
  closeSheet() { S.app.sheet = null; },
  pay() {
    const a = S.app; if (a.checkoutStep !== "form") return;
    a.checkoutStep = "paying";
    later(1000, () => { a.checkoutStep = "done"; a.enrolled[a.courseId] = true; });
  },
  startCourse() { const a = S.app; a.sheet = null; a.history = ["courses"]; a.screen = "player"; },

  // lessons
  openLesson(id) {
    const a = S.app, l = course(a.courseId).lessons.find((x) => x.id === id);
    a.lessonId = id;
    if (l.type === "video") { a.video = { playing: false, t: 0 }; go("video"); }
    else if (l.type === "quiz") { a.quiz = { picked: null, checked: false }; go("quiz"); }
    else if (l.type === "lab") go("lab");
    else toast("Final exam — not part of this prototype");
  },
  togglePlay() { S.app.video.playing = !S.app.video.playing; },
  completeLesson() { const a = S.app; markDone(a.courseId, a.lessonId); back(); toast("Lesson complete"); },
  quizPick(i) { const q = S.app.quiz; if (!q.checked) q.picked = +i; },
  quizCheck() { const q = S.app.quiz; if (q.picked != null) q.checked = true; },
  quizRetry() { S.app.quiz = { picked: null, checked: false }; },
  quizDone() { const a = S.app; markDone(a.courseId, a.lessonId); back(); toast(`Knowledge check passed · ${CONFIG.quiz.score}`); },

  // practice project
  openPractice() { S.app.practiceReady = true; go("pp-diag"); },
  ppTab(scr) {
    const a = S.app; a.screen = scr;
    if (scr === "pp-report") { a.generating = true; later(800, () => (a.generating = false)); }
  },
  fixExhaust() { S.app.fixed = true; toast("Exhaust moved: 23 ft from nearest opening"); },
  generate() { const a = S.app; go("pp-report"); a.generating = true; later(800, () => (a.generating = false)); },
  openSubmit() { const a = S.app; a.sheet = "submit"; a.submitStep = "choose"; },
  chooseSubmit(o) { if (S.app.submitStep === "choose") S.app.submitChoice = o; },
  doSubmit() {
    const a = S.app; if (a.submitStep !== "choose") return;
    a.submitStep = "sending";
    later(1100, () => { a.submitStep = "done"; if (a.submitChoice === "sync") S.portal.submission = "synced"; });
  },
  backToCourse() {
    const a = S.app, fid = CONFIG.featuredCourseId;
    a.sheet = null; a.courseId = fid; a.screen = "player"; a.history = ["courses"];
    if (a.submitChoice === "sync") { markDone(fid, "l3"); a.labState = "submitted"; toast("Lesson 3 marked complete"); }
    else { a.labState = "pdf"; toast("Upload your PDF on the course portal"); }
  },

  // Flow A jump list
  aJump(key) {
    const j = A_JUMPS.find((x) => x.key === key);
    EPOCH++; S.app = freshApp(); LAST.phone = LAST.sheet = null; j.set(S.app);
  },

  // portal
  pLesson(id) { S.portal.lesson = id; },
  pView(v) { S.portal.view = v; },
  pState(s) { S.portal.submission = s; S.portal.upload = "idle"; S.portal.lesson = "l3"; },
  pUpload() {
    const p = S.portal; if (p.upload !== "idle") return;
    p.upload = "uploading";
    later(1400, () => { p.upload = "idle"; p.submission = "uploaded"; });
  },
  pSelect(id) { S.portal.selected = id; },
  pApprove() {
    const p = S.portal; p.reviews[p.selected] = "approved";
    const r = CONFIG.reviewQueue.find((x) => x.id === p.selected);
    if (p.selected === "r1") { p.submission = "approved"; S.app.approved = true; }
    portalToast(`Approved · Lesson 4 unlocked for ${r.name}`);
  },
  pRequest() {
    const p = S.portal; p.reviews[p.selected] = "changes";
    if (p.selected === "r1" && p.submission === "approved") p.submission = "synced";
    const r = CONFIG.reviewQueue.find((x) => x.id === p.selected);
    portalToast(`Changes requested · ${r.name} has been notified`);
  },

  // story
  next() { if (S.story.step < STORY.length - 1) { EPOCH++; S = storyState(S.story.step + 1); } },
  prev() { if (S.story.step > 0) { EPOCH++; S = storyState(S.story.step - 1); } },
  jump(n) { EPOCH++; S = storyState(+n); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (S.mode === "story" && el.closest(".frame")) return; // story frames are driven by Next / Back
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset.arg, el);
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.mode !== "hub") { ACTIONS.hub(); render(); }
  if (S.mode !== "story") return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); ACTIONS.next(); render(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ACTIONS.prev(); render(); }
});

function fit() {
  const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
  document.getElementById("stage").style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener("resize", fit);
document.documentElement.style.setProperty("--partner-accent", P.accent);
document.title = `RadonSketch × ${P.name} — Partnership Prototype`;
fit();
render();

</script>
</body>
