.p-body { display: grid; grid-template-columns: 300px 1fr; gap: 28px; padding: 24px 32px 48px; align-items: start; }
.p-side { background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 10px; position: sticky; top: 84px; }
.p-side-title { font-size: 12px; font-weight: 700; color: var(--p-muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 10px; }
.p-lesson { display: flex; gap: 12px; width: 100%; padding: 12px 10px; border-radius: 10px; border-left: 3px solid transparent; transition: background .15s; }
.p-lesson:hover { background: var(--p-bg); }
.p-lesson.sel { background: var(--partner-soft); border-left-color: var(--partner-accent); }
.p-l-st { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #D0D5DD; color: var(--p-muted); font-size: 12px; font-weight: 700; }
.p-l-st i { font-style: normal; }
.pst-done .p-l-st { background: #1F9D61; border-color: #1F9D61; color: #fff; }
.pst-review .p-l-st { background: #FFF4DB; border-color: #E0A100; color: #B07A00; }
.pst-current .p-l-st, .pst-open .p-l-st { border-color: var(--partner-accent); color: var(--partner-accent); }
.pst-locked .p-l-st { background: #F2F4F7; border-color: #E4E7EC; }
.p-l-txt { flex: 1; min-width: 0; }
.p-l-txt small { display: block; font-size: 11.5px; color: var(--p-muted); }
.p-l-txt b { display: block; font-size: 13.5px; line-height: 1.35; margin-top: 1px; }
.p-l-txt em { display: block; font-style: normal; font-size: 11.5px; margin-top: 3px; color: var(--p-muted); }
.pst-done .p-l-txt em { color: #1F9D61; font-weight: 600; }
.pst-review .p-l-txt em { color: #B07A00; font-weight: 600; }
.pst-current .p-l-txt em, .pst-open .p-l-txt em { color: var(--partner-accent); font-weight: 600; }
.pst-locked { opacity: .75; }
.p-help { display: flex; gap: 8px; align-items: center; margin: 8px 10px 4px; padding-top: 12px; border-top: 1px solid var(--p-line); font-size: 12.5px; color: var(--p-muted); }
.p-main { min-width: 0; }
.p-kicker { display: flex; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 700; color: var(--partner-accent); text-transform: uppercase; letter-spacing: .06em; }
.p-powered { display: inline-flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--p-ink-2); background: #FFF3E8; border: 1px solid #F6CFAF; padding: 3px 9px 3px 4px; border-radius: 999px; font-size: 12px; }
.p-main h2 { font-size: 24px; letter-spacing: -.015em; margin-top: 6px; }
.p-lead { font-size: 15px; color: var(--p-ink-2); margin-top: 8px; line-height: 1.55; max-width: 760px; }
.p-lab-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; align-items: start; }
.p-lab-left { display: grid; gap: 16px; }
.p-card { background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 18px 20px; }
.p-card h4 { font-size: 15px; margin-bottom: 12px; }
.p-ul { display: grid; gap: 9px; }
.p-ul li { display: flex; gap: 8px; font-size: 14px; color: var(--p-ink-2); }
.p-ul .ic { color: #1F9D61; margin-top: 2px; }
.p-est { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--p-line); font-size: 13.5px; color: var(--p-ink-2); }
.p-steps { display: grid; gap: 14px; }
.p-steps li { display: flex; gap: 14px; }
.p-steps i { flex: none; font-style: normal; width: 30px; height: 30px; border-radius: 50%; background: var(--partner-accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.p-steps b { display: block; font-size: 14.5px; }
.p-steps small { display: block; font-size: 13px; color: var(--p-muted); margin-top: 2px; line-height: 1.4; }
.p-note { display: flex; gap: 10px; align-items: center; padding: 13px 16px; border-radius: 12px; background: #FFF6EC; border: 1px solid #F6D5B8; font-size: 14px; color: var(--p-ink-2); }
.p-note .ic { color: var(--rs-orange); }
.p-qr-card { background: #fff; border: 1px solid var(--p-line); border-radius: 16px; padding: 22px; display: grid; justify-items: center; gap: 14px; text-align: center; transition: box-shadow .3s, border-color .3s; }
.p-qr-card.pulse { border-color: var(--rs-orange); animation: pulse 1.6s ease-in-out infinite; }
.p-qr-title { font-weight: 800; font-size: 16px; }
.p-qr { padding: 10px; border: 1px solid var(--p-line); border-radius: 12px; }
.p-stores { display: flex; gap: 8px; }
.store-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 10px; border-radius: 9px; background: #111; color: #fff; font-size: 13px; font-weight: 700; text-align: left; line-height: 1.1; }
.store-btn small { display: block; font-size: 9px; font-weight: 500; opacity: .8; }
.p-or { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--p-muted); }
.p-or::before, .p-or::after { content: ""; flex: 1; height: 1px; background: var(--p-line); }
.p-code { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; background: var(--partner-soft); border: 1px dashed var(--partner-mid); font-size: 14px; color: var(--p-ink-2); }
.p-code b { font-size: 18px; letter-spacing: .06em; color: var(--partner-accent); font-variant-numeric: tabular-nums; }
.p-code .ic { color: var(--p-muted); }

.p-sub { margin-top: 22px; background: #fff; border: 1px solid var(--p-line); border-radius: 16px; padding: 18px 22px 22px; }
.p-sub-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.p-sub-head h3 { font-size: 17px; }
.demo-switch { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; border: 1px dashed #C7CCD5; background: #FAFBFC; }
.demo-switch > span { font-size: 10.5px; font-weight: 700; color: var(--p-muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 8px; }
.demo-switch button { font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 7px; color: var(--p-ink-2); }
.demo-switch button.on { background: var(--p-ink); color: #fff; }
.p-wait { display: flex; gap: 16px; align-items: center; padding: 20px; border-radius: 12px; border: 1.5px dashed #D0D5DD; background: #FAFBFC; }
.p-wait-ic { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #F0F2F5; color: var(--p-muted); display: grid; place-items: center; }
.p-wait > div { flex: 1; }
.p-wait b { display: block; font-size: 16px; }
.p-wait small { display: block; font-size: 13.5px; color: var(--p-muted); margin-top: 3px; }
.p-conn { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12.5px; font-weight: 600; color: var(--p-muted); background: #F0F2F5; padding: 5px 10px; border-radius: 999px; }
.p-conn.on { color: #1F9D61; background: #E3F5EC; animation: fade .3s; }
.p-conn i { width: 7px; height: 7px; border-radius: 50%; background: #1F9D61; box-shadow: 0 0 0 3px rgba(31,157,97,.2); }
.p-link { color: var(--partner-accent); font-weight: 600; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.p-sub-grid { display: grid; grid-template-columns: 168px 1fr; gap: 22px; animation: fade .3s var(--ease); }
.p-thumb { border-radius: 8px; overflow: hidden; border: 1px solid var(--p-line); box-shadow: 0 6px 16px -10px rgba(0,0,0,.35); align-self: start; }
.p-sub-info { display: grid; gap: 10px; align-content: start; }
.p-status { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 13.5px; }
.p-status.sub { background: #E8F0FE; color: #1E5BC6; }
.p-status.ok { background: #E3F5EC; color: #13804D; }
.p-sync-line { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.p-file { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--p-ink-2); }
.p-file span { color: var(--p-muted); }
.p-checks { border: 1px solid var(--p-line); border-radius: 12px; padding: 12px 14px; background: #FCFCFD; }
.p-checks-head { display: flex; justify-content: space-between; font-size: 13.5px; }
.p-checks-head span { font-weight: 700; color: #13804D; }
.p-seg { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin: 10px 0; }
.p-seg i { height: 7px; border-radius: 2px; }
.p-seg i.pass { background: #1F9D61; }
.p-seg i.warn { background: #E0A100; }
.p-seg i.pending { background: #D0D5DD; }
.p-checks ul { display: grid; gap: 5px; }
.p-checks li { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--p-ink-2); }
.p-checks li.pass .ic { color: #1F9D61; }
.p-checks li.pending .ic { color: var(--p-muted); }
.p-checks em { color: var(--p-muted); }
.p-review-line { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #B07A00; font-weight: 600; }
.p-actions { display: flex; gap: 8px; }
.p-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 10px; background: var(--partner-accent); color: #fff; font-weight: 700; font-size: 13.5px; }
.p-btn.ghost { background: #fff; color: var(--p-ink); border: 1px solid #D0D5DD; }
.p-feedback { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #F5F7FA; }
.p-feedback b { font-size: 13.5px; }
.p-feedback p { font-size: 13.5px; color: var(--p-ink-2); margin-top: 2px; line-height: 1.45; }
.p-drop { display: grid; justify-items: center; gap: 6px; padding: 30px; border-radius: 14px; border: 2px dashed color-mix(in srgb, var(--partner-accent) 40%, #fff); background: var(--partner-soft); color: var(--partner-accent); text-align: center; cursor: pointer; transition: background .2s; }
.p-drop:hover { background: color-mix(in srgb, var(--partner-accent) 13%, #fff); }
.p-drop b { font-size: 16px; color: var(--p-ink); }
.p-drop small { font-size: 13px; color: var(--p-muted); }
.p-upbar { width: 320px; height: 6px; border-radius: 3px; background: #fff; overflow: hidden; margin-top: 8px; }
.p-upbar i { display: block; height: 100%; width: 100%; background: var(--partner-accent); transform-origin: left; animation: grow 1.4s var(--ease) forwards; }
.p-hint { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--p-muted); }
.p-hint.warn { margin: 0; padding: 9px 12px; border-radius: 10px; background: #FFF7E6; color: #8A6100; }
.p-video { position: relative; margin-top: 18px; aspect-ratio: 16/8; border-radius: 14px; background: linear-gradient(135deg, var(--partner-accent), var(--partner-dark)); color: #fff; display: grid; place-items: center; }
.p-play { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--partner-accent); display: grid; place-items: center; padding-left: 4px; }
.p-vcap { position: absolute; left: 20px; bottom: 16px; font-weight: 600; }
.p-done-line { display: flex; gap: 8px; align-items: center; margin-top: 14px; color: #13804D; font-weight: 600; }
.p-score { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
.p-score-big { font-size: 34px; font-weight: 800; color: #13804D; }
.p-score b { display: block; font-size: 16px; }
.p-score small, .p-locked small, .p-exam small { display: block; color: var(--p-muted); margin-top: 3px; }
.p-locked, .p-exam { display: flex; align-items: center; gap: 18px; margin-top: 18px; padding: 26px; }
.p-locked { color: var(--p-muted); }
.p-locked b { color: var(--p-ink); font-size: 16px; }
.p-exam > div { flex: 1; }
.p-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-radius: 12px; background: var(--p-ink); color: #fff; font-weight: 600; box-shadow: 0 14px 30px -12px rgba(0,0,0,.5); animation: fade .25s; }
.p-toast .ic { color: #7BE0AE; }

/* instructor */
.i-wrap { padding: 22px 32px 48px; }
.i-leftcol { display: grid; gap: 16px; }
.i-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.i-stats div { background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 14px 18px; }
.i-stats b { display: block; font-size: 21px; letter-spacing: -.01em; }
.i-stats small { font-size: 12.5px; color: var(--p-muted); }
.i-grid { display: grid; grid-template-columns: 1fr 440px; gap: 18px; align-items: start; }
.i-table { background: #fff; border: 1px solid var(--p-line); border-radius: 14px; overflow: hidden; }
.i-tr { display: grid; grid-template-columns: 1.5fr 1.2fr 1.1fr .8fr 1.2fr; gap: 10px; align-items: center; width: 100%; padding: 13px 18px; border-top: 1px solid var(--p-line); font-size: 13.5px; color: var(--p-ink-2); }
.i-th { border-top: 0; background: #F9FAFB; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--p-muted); }
button.i-tr:hover { background: #FAFBFC; }
.i-tr.sel { background: var(--partner-soft); box-shadow: inset 3px 0 0 var(--partner-accent); }
.i-name { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--p-ink); }
.src { display: inline-flex; align-items: center; gap: 5px; font-style: normal; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
.src.sync { background: #FFF3E8; color: var(--rs-orange-dk); }
.src.pdf { background: #F0F2F5; color: var(--p-ink-2); }
.sc { font-variant-numeric: tabular-nums; }
.sc.good { color: #13804D; } .sc.mid { color: #B07A00; } .sc.low { color: #C2412F; }
.rv-st { font-style: normal; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.rv-st.review { background: #FFF4DB; color: #8A6100; }
.rv-st.approved { background: #E3F5EC; color: #13804D; }
.rv-st.changes { background: #FDECEA; color: #B4321F; }
.i-detail { background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.i-d-head { display: flex; align-items: center; gap: 12px; }
.i-d-head > div { flex: 1; }
.i-d-head b { display: block; font-size: 15.5px; }
.i-d-head small { font-size: 12.5px; color: var(--p-muted); }
.i-d-body { display: grid; grid-template-columns: 150px 1fr; gap: 16px; }
.i-prev { border: 1px solid var(--p-line); border-radius: 8px; overflow: hidden; align-self: start; }
.i-d-checks b { font-size: 13px; }
.i-checks { display: grid; gap: 4px; margin-top: 8px; }
.i-checks li { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--p-ink-2); }
.i-checks li.pass .ic { color: #1F9D61; }
.i-checks li.warn .ic { color: #E0A100; }
.i-checks li.pending .ic { color: var(--p-muted); }
.i-nochecks { display: flex; gap: 7px; margin-top: 8px; font-size: 12.5px; color: var(--p-muted); line-height: 1.45; }
.i-fb { width: 100%; height: 56px; resize: none; border: 1px solid #D0D5DD; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 13.5px; color: var(--p-ink); }
.i-acts { display: flex; justify-content: flex-end; gap: 8px; }
.i-fine { font-size: 12px; color: var(--p-muted); text-align: right; }

/* =========================================================================
   Motion (all under 300ms, calm)
   ========================================================================= */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(226,106,27,.0); } 50% { box-shadow: 0 0 0 8px rgba(226,106,27,.22); } }
@keyframes flashGreen { from { background: var(--rs-green-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* =========================================================================
   CERTI partner styles (colours come from CONFIG.partner.colors in app.js)
   ========================================================================= */
:root {
  --certi-topbar: #8E96B6; --certi-navy: #4B6094; --certi-banner: #9CA4BA; --certi-teal: #14B2BA;
  --certi-link: #1F4FB5; --certi-green-bg: #EAF4DF; --certi-green: #2E7D32; --certi-blue-bg: #E7E9F6;
  --certi-red: #E03A3A; --certi-section: #F6F6F6; --certi-footer: #CCCCCC; --certi-alert: #E4D9D8;
  --certi-font: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --certi-site-font: "Varela Round", Poppins, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
/* Partner logo (real CERTI logo image) */
.partner-logo-img { display: inline-block; flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: contain; background: #fff; vertical-align: middle; }
.partner-logo-img.xs { width: 26px; height: 26px; }
.partner-logo-img.hublogo { width: 52px; height: 52px; }
.partner-logo-img.on-dark { width: 30px; height: 30px; box-shadow: 0 0 0 2px rgba(255,255,255,.6); }
.partner-banner .partner-logo-img.on-dark { width: 40px; height: 40px; }
.logo-ph, .partner-logo { display: inline-flex; align-items: center; justify-content: center; border: 1.5px dashed #9CA4BA; border-radius: 6px; font-size: 9px; font-weight: 700; color: #4B6094; background: #fff; padding: 4px 6px; }
.hub-eyebrow .partner-logo-img { width: 28px; height: 28px; }
.tb-logos .partner-logo-img { width: 28px; height: 28px; }
.cd-provider .partner-logo-img, .pl-card .partner-logo-img { width: 24px; height: 24px; }

/* App-side tweaks */
.sample-tag { font-size: 10px; font-weight: 700; color: var(--rs-muted); border: 1px solid var(--rs-line); padding: 1px 5px; border-radius: 5px; vertical-align: 2px; text-transform: uppercase; letter-spacing: .04em; }
.empty-cat { display: grid; justify-items: center; gap: 4px; padding: 28px 16px; text-align: center; border: 1.5px dashed #DCD2C6; border-radius: 16px; color: var(--rs-muted); background: #fff; }
.empty-cat b { color: var(--rs-ink-2); font-size: 14.5px; }
.empty-cat small { font-size: 12.5px; }
.manual-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--rs-line); }
.manual-row > .ic:first-child { color: var(--certi-red); }
.manual-row span { flex: 1; }
.manual-row b { display: block; font-size: 13.5px; }
.manual-row small { font-size: 12px; color: var(--rs-muted); }
.quiz-rule { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; padding: 6px 10px; border-radius: 9px; background: var(--certi-blue-bg); color: var(--certi-navy); font-size: 12.5px; font-weight: 600; }
.cert.on { border-style: solid; border-color: var(--rs-green); background: var(--rs-green-soft); color: var(--rs-green); }
.cert.on b { color: #165F3E; }
.l-ic.t-eval { background: #EEF0F8; color: var(--certi-navy); }
.l-ic.t-cert { background: #FFF6E0; color: #9A6B00; }
.thumb-cat { right: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Shared portal wrapper */
.pwrap { height: 100%; position: relative; }
.pwrap.enter { animation: fade .25s var(--ease); }
.ext { color: var(--certi-link); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

/* ---------- 2a · Account site ---------- */
.acct { background: #fff; color: #333; font-family: var(--certi-site-font); font-size: 13.5px; }
.ac-top { display: flex; align-items: center; gap: 18px; height: 30px; padding: 0 0 0 250px; background: var(--certi-topbar); color: #fff; font-size: 11.5px; }
.ac-size { margin-left: auto; margin-right: 360px; color: #2F5BB3; letter-spacing: 2px; font-size: 13px; }
.ac-head { display: flex; align-items: center; height: 68px; padding: 0 140px 0 250px; background: var(--certi-navy); }
.ac-logo-btn { line-height: 0; }
.ac-logo { width: 50px; height: 50px; border-radius: 50%; background: #fff; object-fit: contain; }
.ac-nav { margin-left: auto; display: flex; gap: 18px; }
.ac-nav button { color: #fff; font-size: 14px; }
.ac-nav i { font-style: normal; font-size: 9px; margin-left: 3px; opacity: .8; }
.ac-nav .on { text-decoration: underline; text-underline-offset: 6px; }
.ac-banner { height: 82px; background: var(--certi-banner); display: grid; place-content: center; text-align: center; gap: 4px; }
.ac-banner h1 { font-size: 16px; color: #3F5AA8; font-weight: 700; }
.ac-banner div { font-size: 11.5px; color: #fff; }
.ac-banner b { color: #111; font-weight: 400; }
.ac-body { display: grid; grid-template-columns: 220px 1fr; gap: 22px; max-width: 940px; margin: 0 auto; padding: 46px 0 50px; min-height: 560px; }
.ac-side { padding-top: 60px; }
.ac-name { display: block; font-size: 14px; color: #111; }
.ac-logout { margin: 8px 0 14px; padding: 5px 12px; background: var(--certi-teal); color: #fff; border-radius: 3px; font-weight: 700; }
.ac-side li button { display: block; width: 100%; padding: 8px 0; border-top: 1px solid #DDD; color: var(--certi-teal); font-size: 13px; }
.ac-side li button.on { color: var(--certi-navy); font-weight: 700; }
.ac-main p { line-height: 1.6; margin-bottom: 10px; }
.ac-center { text-align: center; }
.ac-pill { margin: 6px 0 18px; padding: 8px 14px; border-radius: 999px; background: var(--certi-teal); color: #fff; font-size: 12.5px; }
.ac-h2 { font-size: 17px; color: #222; padding: 0 0 8px 4px; border-bottom: 2px solid #333; margin-bottom: 14px; }
.ac-grid { display: grid; grid-template-columns: repeat(4, 146px); gap: 10px; }
.ac-card { display: flex; flex-direction: column; gap: 8px; height: 118px; padding: 10px; border: 1px solid #E3E3E3; }
.ac-card.feat { border-color: var(--certi-teal); box-shadow: 0 0 0 2px rgba(20,178,186,.18); }
.ac-ctitle { color: #4B5FA6; font-size: 11.5px; line-height: 1.35; text-align: left; }
.ac-rs { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; font-weight: 700; color: var(--rs-orange-dk); }
.ac-done, .ac-start { margin-top: auto; padding: 4px; font-size: 10px; }
.ac-done { border: 1.5px solid #3CB53C; color: #3CB53C; background: #fff; }
.ac-start { background: var(--certi-navy); color: #fff; }
.ac-alert { margin-top: 18px; padding: 7px 12px; background: var(--certi-alert); border-left: 3px solid var(--certi-red); font-size: 12px; line-height: 1.5; }
.ac-table { width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid #E6E6E6; margin-bottom: 14px; }
.ac-table th { text-align: left; text-transform: uppercase; font-size: 11px; padding: 7px 8px; color: #222; border-bottom: 1px solid #E6E6E6; }
.ac-table td { padding: 7px 8px; border-top: 1px solid #EEE; vertical-align: middle; line-height: 1.4; }
.ac-a { color: var(--certi-teal); }
.ac-via { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 10px; font-weight: 700; color: var(--rs-orange-dk); background: var(--rs-orange-soft); padding: 2px 6px; border-radius: 4px; }
.ac-view { padding: 4px 11px; background: var(--certi-teal); color: #fff; border-radius: 3px; font-weight: 700; font-size: 12px; }
.ac-main mark { background: #FFF3C4; padding: 0 3px; }
.ac-via-box { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid #F6CFAF; background: #FFF6EE; border-radius: 6px; margin: 6px 0 16px; }
.ac-via-box b { display: block; }
.ac-via-box small { color: #666; }
.ac-info { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-top: 3px solid var(--certi-teal); background: #F7F6F7; }
.ac-foot { display: flex; justify-content: center; gap: 30px; padding: 22px; background: #2F3035; color: #BBB; font-size: 12px; }

/* ---------- 2b · Course area (Moodle-style) ---------- */
.cm { display: grid; grid-template-columns: 206px 1fr; height: 100%; overflow: hidden; background: #fff; color: #1D2125; font-family: var(--certi-font); font-size: 13px; }
.cm.no-side { grid-template-columns: 0 1fr; }
.cm-side { background: var(--certi-section); overflow-y: auto; padding: 14px 12px 20px; scrollbar-width: none; }
.cm.no-side .cm-side { padding: 0; }
.cm-logo { display: block; margin: 4px auto 18px; line-height: 0; }
.cm-logo-img { width: 124px; height: 124px; object-fit: contain; border-radius: 50%; }
.cm-panel { background: #fff; border-radius: 6px; padding: 8px 4px; margin-bottom: 12px; }
.cm-homes button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 8px; font-size: 12.5px; }
.cm-mini { width: 18px; height: 18px; border-radius: 50%; object-fit: contain; }
.cm-ph { display: flex; align-items: center; gap: 7px; padding: 6px 8px 8px; font-size: 13px; font-weight: 500; }
.cm-badge { margin-left: auto; font-size: 10.5px; color: var(--certi-link); background: var(--certi-blue-bg); padding: 1px 6px; border-radius: 4px; }
.cm-search { display: flex; align-items: center; gap: 6px; margin: 0 6px 6px; padding: 5px 8px; border: 1px solid #DEE2E6; border-radius: 4px; font-size: 11px; color: #333; background: #F8F9FA; }
.cm-toggle { display: flex; align-items: center; gap: 7px; padding: 4px 8px 8px; font-size: 10.5px; }
.cm-toggle i { width: 24px; height: 13px; border-radius: 7px; background: #DEE2E6; position: relative; transition: background .2s; }
.cm-toggle i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 9px; height: 9px; border-radius: 50%; background: #fff; transition: left .2s; }
.cm-toggle i.on { background: var(--certi-link); }
.cm-toggle i.on::after { left: 13px; }
.cm-ci { display: flex; gap: 6px; width: 100%; padding: 7px 8px; margin-bottom: 2px; font-size: 10.5px; line-height: 1.4; text-align: left; border-radius: 3px; color: #3B4A3A; }
.cm-ci .ic { margin-top: 2px; opacity: 0; }
.cm-ci.done { background: var(--certi-green-bg); color: #2E5E1E; }
.cm-ci.done .ic, .cm-ci.done-cur .ic { opacity: 1; }
.cm-ci.cur { background: var(--certi-blue-bg); color: var(--certi-link); font-weight: 500; }
.cm-link { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 7px 8px; font-size: 10.5px; color: #333; }
.cm-cert { display: flex; gap: 8px; width: 100%; padding: 6px 8px; text-align: left; border-radius: 4px; }
.cm-cert .ic { color: #555; margin-top: 2px; }
.cm-cert b { display: block; font-size: 10.5px; font-weight: 500; }
.cm-cert i { display: block; font-size: 10px; color: #555; }
.cm-cert em { font-style: normal; font-size: 9px; font-weight: 700; color: #fff; background: var(--certi-green); padding: 1px 5px; border-radius: 3px; }
.cm-cert.new { background: var(--certi-green-bg); animation: flashGreen 1.6s var(--ease); }
.cm-main { position: relative; overflow-y: auto; }
.cm-top { display: flex; align-items: center; height: 50px; padding: 0 14px; border-bottom: 1px solid #EEE; }
.cm-sbtn { width: 34px; height: 34px; border-radius: 6px; background: var(--certi-blue-bg); color: #333; display: grid; place-items: center; }
.cm-right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: #333; }
.cm-moon { width: 32px; height: 32px; border-radius: 6px; background: #FFF4D9; display: grid; place-items: center; }
.cm-avatar { flex: none; width: 32px; height: 32px; border-radius: 6px; background: var(--certi-navy); color: #fff; font-weight: 600; font-size: 12px; display: grid; place-items: center; }
.cm-avatar.sm { width: 26px; height: 26px; font-size: 10.5px; border-radius: 50%; }
.cm-index { position: absolute; left: 6px; top: 64px; width: 30px; height: 30px; border-radius: 4px; background: var(--certi-section); display: grid; place-items: center; }
.cm-content { padding: 18px 50px 36px 58px; }
.cm-crumb { font-size: 10.5px; color: #333; margin-bottom: 12px; }
.cm-tabs { display: inline-flex; background: var(--certi-section); border-radius: 4px; padding: 3px; gap: 2px; }
.cm-tabs button { padding: 6px 12px; font-size: 12px; border-radius: 3px; color: #1D2125; }
.cm-tabs button.on { background: var(--certi-blue-bg); color: var(--certi-link); }
.cm-title { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 18px 0 10px; line-height: 1.2; }
.cm-title.sm { font-size: 24px; margin-top: 4px; }
.cm-desc { font-size: 13px; line-height: 1.7; color: #1D2125; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
.cm-carow { display: flex; justify-content: flex-end; margin: 14px 0 8px; }
.cm-ca { padding: 7px 12px; background: var(--certi-section); border-radius: 4px; font-size: 11.5px; }
.cm-sec { margin-bottom: 12px; }
.cm-sec-h { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 11px 14px; background: var(--certi-section); border-radius: 4px; font-size: 13.5px; font-weight: 500; }
.cm-sec-h i { color: #555; transition: transform .2s; }
.cm-sec-h i.shut { transform: rotate(-90deg); }
.cm-sec.is-new .cm-sec-h { background: #FFF1E6; box-shadow: inset 3px 0 0 var(--rs-orange); }
.cm-new { font-style: normal; font-size: 9.5px; font-weight: 700; color: #fff; background: var(--rs-orange); padding: 2px 6px; border-radius: 3px; vertical-align: 2px; margin-left: 4px; letter-spacing: .04em; }
.cm-sec-b { padding: 12px 2px 4px; animation: fade .2s; }
.red { color: var(--certi-red); }
.cm-instr { width: 100%; border-collapse: collapse; border: 1.5px solid #222; font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; margin-bottom: 12px; }
.cm-instr td { border: 1px solid #222; padding: 6px 10px; vertical-align: middle; line-height: 1.55; }
.cm-icell { width: 150px; text-align: center; position: relative; }
.cm-icell .cm-thumb { width: 120px; height: 76px; margin: 0 auto; }
.cm-oval { display: inline-grid; place-items: center; width: 118px; height: 64px; border: 1.5px solid #3F5AA8; border-radius: 50%; font-size: 15px; line-height: 1.15; color: #333; }
.cm-arrow { color: #3F5AA8; font-size: 18px; margin-left: 2px; }
.cm-ul { padding-left: 18px; list-style: disc; }
.cm-ul ul { padding-left: 20px; list-style: circle; }
.cm-ul li { margin: 1px 0; }
.cm-hl { background: #FFF1E6; margin: 3px 0 3px -6px !important; padding: 3px 6px; border-left: 3px solid var(--rs-orange); list-style-position: inside; }
.cm-qh { color: var(--certi-red); font-weight: 700; margin: 6px 0 4px; }
.cm-sec-b > p { margin-bottom: 6px; }
.cm-topic { display: flex; gap: 10px; margin-bottom: 12px; font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; line-height: 1.6; }
.cm-th { display: block; font-size: 13px; margin-bottom: 4px; }
.cm-thumb { flex: none; width: 146px; height: 110px; border-radius: 3px; display: grid; place-items: center; overflow: hidden; position: relative; }
.cm-thumb.k-video { background: linear-gradient(135deg, #3B2E2A, #7A5A48); color: #F2D8C8; }
.cm-thumb.k-manual { background: #fff; border: 2px solid #222; color: #666; }
.cm-thumb.k-quiz { background: #EEF3FB; color: var(--certi-navy); }
.cm-thumb.k-eval { background: #EEF0F8; color: var(--certi-navy); }
.cm-thumb.k-cert { background: #FFF6E0; color: #9A6B00; }
.cm-thumb.lab { background: #FFF8F1; border: 1.5px solid #F6CFAF; padding: 6px; }
.cm-thumb.lab .plan { width: 100%; height: 100%; }
.cm-thumb.lab > span { position: absolute; right: 6px; bottom: 6px; }
.cm-acts { border: 1px solid #DEE2E6; border-radius: 4px; }
.cm-act { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #DEE2E6; }
.cm-act:first-child { border-top: 0; }
.cm-act.is-lab { background: #FFFAF5; }
.cm-done { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.cm-done.off { border: 1.5px dashed #6A737B; }
.cm-done.on { border: 1.5px solid var(--certi-green); color: var(--certi-green); background: var(--certi-green-bg); }
.cm-aic { flex: none; width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; }
.cm-aic.k-pdf { background: #FCE8E8; color: #D63B3B; }
.cm-aic.k-video, .cm-aic.k-res { background: #E7EEFB; color: #2563C9; }
.cm-aic.k-quiz { background: #FCEBE6; color: #D9531E; }
.cm-aic.k-lab { background: #FFF1E6; }
.cm-aic.k-eval { background: #F1E9FA; color: #7A3FC1; }
.cm-aic.k-cert { background: #FFF4D9; color: #9A6B00; }
.cm-atxt { display: grid; gap: 3px; }
.cm-alink { color: var(--certi-link); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; text-align: left; }
.cm-act.restricted .cm-alink { color: #6A737B; text-decoration: none; }
.cm-restr { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #6A737B; background: var(--certi-section); padding: 3px 8px; border-radius: 3px; }
.cm-pass { display: inline-flex; align-items: center; gap: 4px; justify-self: start; font-size: 10.5px; color: var(--certi-green); background: var(--certi-green-bg); padding: 2px 7px; border-radius: 3px; }
.cm-pass.todo { color: #6A737B; background: var(--certi-section); }
.cm-lab { display: grid; grid-template-columns: 1fr 290px; gap: 16px; margin: 4px 0 12px; }
.cm-steps { display: grid; gap: 10px; align-content: start; }
.cm-step { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid #DEE2E6; border-radius: 4px; }
.cm-step i { flex: none; font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--certi-navy); color: #fff; font-weight: 700; display: grid; place-items: center; }
.cm-step b { display: block; font-size: 13px; }
.cm-step small { display: block; font-size: 11.5px; color: #555; margin-top: 1px; }
.cm-note { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 4px; background: #FFF6EC; border: 1px solid #F6D5B8; font-size: 12px; }
.cm-note .ic { color: var(--rs-orange); }
.cm-qr { display: grid; justify-items: center; gap: 10px; padding: 14px; border: 1px solid #DEE2E6; border-radius: 4px; text-align: center; transition: box-shadow .3s; }
.cm-qr.pulse { border-color: var(--rs-orange); animation: pulse 1.6s ease-in-out infinite; }
.cm-qr-img { padding: 6px; border: 1px solid #EEE; border-radius: 6px; }
.cm-code { font-size: 12px; padding: 6px 10px; border: 1px dashed var(--certi-banner); border-radius: 4px; background: var(--certi-blue-bg); display: inline-flex; gap: 6px; align-items: center; }
.cm-code b { color: var(--certi-navy); letter-spacing: .05em; font-size: 14px; }
.cm-subm { margin-top: 12px; border: 1px solid #DEE2E6; border-radius: 4px; overflow: hidden; }
.cm-subm-h { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--certi-section); }
.cm-subm-h b { font-size: 14px; }
.cm-stable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cm-stable th { width: 170px; text-align: left; font-weight: 600; padding: 10px 14px; border-top: 1px solid #DEE2E6; vertical-align: top; background: #FCFCFC; }
.cm-stable td { padding: 10px 14px; border-top: 1px solid #DEE2E6; vertical-align: top; }
.cm-stable td.ok { background: #CFEFCF; }
.cm-conn { display: inline-flex; align-items: center; gap: 6px; color: #6A737B; }
.cm-conn.on { color: var(--certi-green); font-weight: 600; }
.cm-conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--certi-green); }
.cm-file { display: flex; gap: 12px; align-items: flex-start; }
.cm-fthumb { border: 1px solid #DEE2E6; line-height: 0; }
.cm-file small { display: block; color: #6A737B; margin-top: 3px; }
.cm-src { display: inline-flex !important; align-items: center; gap: 5px; color: var(--rs-orange-dk) !important; font-weight: 600; }
.cm-checks b { color: var(--certi-green); }
.cm-checks span { color: #6A737B; font-size: 11.5px; }
.cm-checks ul { display: grid; gap: 3px; }
.cm-checks li { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.cm-checks li.pass .ic { color: var(--certi-green); }
.cm-checks em { color: #6A737B; }
.cm-checks .p-seg { margin: 8px 0; max-width: 360px; }
.cm-fb { display: flex; gap: 10px; }
.cm-fb p { margin-top: 2px; color: #333; }
.cm-drop { display: grid; justify-items: center; gap: 4px; padding: 22px; border: 2px dashed #9CA4BA; border-radius: 4px; background: #F8F9FB; color: var(--certi-navy); cursor: pointer; text-align: center; }
.cm-drop:hover { background: var(--certi-blue-bg); }
.cm-drop b { color: #1D2125; font-size: 13.5px; }
.cm-drop small { color: #6A737B; }
.cm-drop .p-upbar { background: #E3E6EF; width: 280px; }
.cm-warn { display: inline-flex; gap: 6px; align-items: center; color: #8A6100; }
.cm-subm-f { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid #DEE2E6; font-size: 12px; color: #555; }
.cm-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 4px; background: var(--certi-teal); color: #fff; font-weight: 600; font-size: 12.5px; }
.cm-btn.ghost { background: #fff; color: #1D2125; border: 1px solid #CED4DA; }
.cm .demo-switch button.on { background: var(--certi-navy); }

/* 2d · Grades */
.cm-select { display: inline-flex; align-items: center; gap: 22px; margin: 6px 0 24px; padding: 10px 14px; border: 1px solid #CED4DA; border-radius: 6px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.cm-user { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13.5px; }
.cm-grades { background: var(--certi-section); border-radius: 4px; padding: 0 8px 8px; }
.g-row { display: grid; grid-template-columns: 2.4fr 1.2fr 1fr .8fr 1fr 1.9fr 1.4fr; gap: 10px; align-items: center; padding: 14px 10px; background: #fff; border-top: 1px solid #E6E6E6; font-size: 12px; }
.g-head { background: transparent; border: 0; font-size: 11px; color: #333; padding-top: 18px; }
.g-cat { grid-template-columns: 1fr; font-weight: 600; font-size: 11.5px; }
.g-item small { display: block; font-size: 9.5px; color: #555; letter-spacing: .03em; }
.g-item .ext { font-size: 13px; text-align: left; }
.g-grade { display: inline-flex; align-items: center; gap: 4px; color: var(--certi-green); }
.g-lab { background: #FFFAF5; box-shadow: inset 3px 0 0 var(--rs-orange); }
.g-fb { color: #333; line-height: 1.45; }
.g-total { background: #F1F1F1; }
.g-total b { font-size: 13px; }

/* Competencies */
.cm-filter { width: 230px; padding: 6px; border: 1px dashed #CED4DA; border-radius: 4px; margin-top: 8px; }
.cm-filter span { display: inline-flex; gap: 4px; align-items: center; font-size: 10.5px; background: var(--certi-blue-bg); color: var(--certi-link); padding: 3px 7px; border-radius: 3px; }
.cm-fsel { display: flex; justify-content: space-between; align-items: center; width: 290px; margin-top: 4px; padding: 8px 10px; border: 1px solid #CED4DA; border-radius: 4px; font-size: 12px; color: #555; }
.cm-h2 { font-size: 22px; font-weight: 700; margin: 18px 0 30px; }
.cm-empty { display: inline-block; padding: 5px 9px; background: #FBE5E5; color: #C0292B; font-size: 11.5px; border-radius: 3px; }

/* 2e · Instructor */
.cm-gsum { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid #DEE2E6; border-radius: 4px; margin: 14px 0 16px; }
.cm-gsum div { padding: 10px 14px; border-left: 1px solid #DEE2E6; }
.cm-gsum div:first-child { border-left: 0; }
.cm-gsum span { display: block; font-size: 11px; color: #555; }
.cm-gsum b { font-size: 20px; }
.cm .i-grid { grid-template-columns: 1fr 400px; gap: 16px; }
.cm-itable { border: 1px solid #DEE2E6; border-radius: 4px; overflow: hidden; }
.cm .i-tr { grid-template-columns: 1.5fr 1.2fr 1.1fr .8fr 1.3fr; padding: 11px 14px; font-size: 12px; border-top: 1px solid #DEE2E6; color: #1D2125; }
.cm .i-th { background: var(--certi-section); font-size: 10.5px; color: #333; }
.cm .i-tr.sel { background: var(--certi-blue-bg); box-shadow: inset 3px 0 0 var(--certi-link); }
.cm-idetail { border: 1px solid #DEE2E6; border-radius: 4px; padding: 14px; display: grid; gap: 12px; }
.cm .i-name { color: #1D2125; font-weight: 500; }
.cm .i-fb { border-color: #CED4DA; font-family: var(--certi-font); font-size: 12.5px; border-radius: 4px; }
.cm .rv-st { border-radius: 3px; font-size: 11px; }

/* ---------- 2f · Footer ---------- */
.cm-foot { margin: 10px 44px 30px 58px; padding: 34px 60px 24px; background: var(--certi-footer); border-top: 1px solid #4B6094; font-size: 12.5px; }
.cm-fcols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding-bottom: 26px; border-bottom: 1px solid #4B6094; }
.cm-fcols div { display: grid; gap: 8px; justify-items: start; align-content: start; }
.cm-fcols b { font-size: 13px; margin-bottom: 4px; }
.cm-fcols span { color: #555; }
.cm-foot .ext { color: #1A3FD6; text-decoration: none; }
.cm-fline { display: flex; gap: 26px; margin: 18px 0 10px; font-size: 11px; }

/* QR placeholder pattern (not a real code) */
function qrSVG(size = 200, seed = 4000) {
  const n = 29;
  let s = seed;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280), s / 233280);
  const finder = (x, y) => x < 8 && y < 8 ? 1 : x > n - 9 && y < 8 ? 1 : x < 8 && y > n - 9 ? 1 : 0;
  const centre = (x, y) => x > 10 && x < 18 && y > 10 && y < 18;
  let cells = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (finder(x, y) || centre(x, y)) continue;
    if (rnd() > 0.5) cells += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  const fp = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#111"/>`;
  return `<svg class="qr" width="${size}" height="${size}" viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-label="QR code placeholder">
    <rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><g fill="#111">${cells}</g>
    ${fp(0, 0)}${fp(n - 7, 0)}${fp(0, n - 7)}
    <rect x="11" y="11" width="7" height="7" rx="1.6" fill="#E26A1B"/><path d="M12.6 15 14.5 13.4l1.9 1.6v1.6h-3.8z" fill="#fff" shape-rendering="geometricPrecision"/>
  </svg>`;
}

function labSubmission(p) {
  const cc = complianceCounts(true), L = CONFIG.learner, I = CONFIG.instructor;
  const sw = (id, label, match) => `<button class="${match.includes(p.submission) ? "on" : ""}" data-action="pState" data-arg="${id}">${label}</button>`;
  const row = (k, v, cls = "") => `<tr><th>${k}</th><td class="${cls}">${v}</td></tr>`;
  const segs = complianceItems(true).map((c) => `<i class="${c.status}"></i>`).join("");
  const checks = `<div class="cm-checks"><b>${cc.pass} of ${cc.total} compliance checks passed</b> <span>(auto-checked by RadonSketch)</span><div class="p-seg">${segs}</div>
    <ul><li class="pass">${ic("check", 12)} Suction point, pipe size & slope, fan location</li><li class="pass">${ic("check", 12)} Exhaust ≥ 10 ft from openings <em>(fixed by learner)</em></li><li class="pending">${ic("clock", 12)} Post-mitigation test — pending field verification</li></ul></div>`;
  const file = (name, meta, source) => `<div class="cm-file"><span class="cm-fthumb">${scaled(reportDoc(true), 74, 420, 594)}</span><div>${ic("file", 15)} <button class="ext" data-action="ext" data-arg="Report PDF">${name}</button><small>${meta}</small><small class="cm-src">${source}</small></div></div>`;
  let rows = "";
  const s = p.submission;
  if (s === "waiting") {
    rows = row("Submission status", "No submissions have been made yet") + row("Grading status", "Not graded") +
      row("RadonSketch", p.connected ? `<span class="cm-conn on"><i></i>Connected · ${L.email}</span>` : `<span class="cm-conn">${ic("phone", 13)} Not connected yet — scan the QR code above to start</span>`);
  } else if (s === "synced" || s === "approved") {
    rows = row("Submission status", "Submitted for grading", "ok") +
      row("Grading status", s === "approved" ? "Graded · 8.89 / 10" : "Not graded", s === "approved" ? "ok" : "") +
      row("Last modified", CONFIG.submittedAt) +
      row("File submissions", file(`Training report — ${CONFIG.practiceProject.name}.pdf`, "4 pages · 1.8 MB", `${rsLogo(13)} Synced automatically from RadonSketch`)) +
      row("Auto-checks", checks) +
      (s === "approved" ? row("Feedback comments", `<div class="cm-fb"><span class="cm-avatar sm">${I.initials}</span><div><b>${I.name}</b><p>“${I.feedback}”</p></div></div>`) : "");
  } else if (s === "manual") {
    const up = p.upload === "uploading";
    rows = row("Submission status", "No submissions have been made yet") + row("File submissions", `<div class="cm-drop ${up ? "busy" : ""}" data-action="pUpload">
      ${ic("upload", 26)}<b>Upload your RadonSketch report (PDF)</b><small>You can drag and drop files here to add them. Maximum size 20 MB.</small>
      ${up ? `<div class="p-upbar"><i></i></div><small>Uploading Training-report_Prairie-View.pdf…</small>` : ""}</div>`);
  } else if (s === "uploaded") {
    rows = row("Submission status", "Submitted for grading", "ok") + row("Grading status", "Not graded") + row("Last modified", CONFIG.uploadedAt) +
      row("File submissions", file("Training-report_Prairie-View.pdf", "1.8 MB", `${ic("upload", 13)} Uploaded manually`)) +
      row("Auto-checks", `<span class="cm-warn">${ic("info", 13)} Not available for manual uploads — your instructor will review the PDF.</span>`);
  }
  return `<div class="cm-subm" data-anchor="submission">
    <div class="cm-subm-h"><b>Submission status</b><div class="demo-switch"><span>Demo state</span>${sw("waiting", "Waiting", ["waiting"])}${sw("synced", "Synced automatically", ["synced", "approved"])}${sw("manual", "Manual PDF upload", ["manual", "uploaded"])}</div></div>

}

function render() {
  const root = document.getElementById("stage");
  const scrolls = {};
  root.querySelectorAll("[data-scroll]").forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
  let html = "";
  if (S.mode === "hub") html = renderHub();
  else if (S.mode === "flowA") html = renderFlowA();
  else if (S.mode === "flowB") html = renderFlowB();
  else html = renderStory();
  root.className = "mode-" + S.mode;
  root.innerHTML = html + `<div class="proto-label">Prototype · sample data</div>`;
  root.querySelectorAll("[data-scroll]").forEach((el) => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  afterRender(root);
}

function afterRender(root) {
  // Video playback simulation
  const playing = S.mode === "flowA" && S.app.screen === "video" && S.app.video.playing;
  if (playing && !vidTimer) {
    vidTimer = setInterval(() => {
      const v = S.app.video; v.t = Math.min(VIDEO_LEN, v.t + 9);
      const f = document.getElementById("vidFill"), t = document.getElementById("vidTime");
      if (f) f.style.width = (v.t / VIDEO_LEN) * 100 + "%";
      if (t) t.textContent = hms(v.t) + " / " + hms(VIDEO_LEN);
      if (v.t >= VIDEO_LEN) { v.playing = false; render(); }
    }, 120);
  } else if (!playing && vidTimer) { clearInterval(vidTimer); vidTimer = null; }

  // Flow B: bring the newly issued certificate into view
  if (S.portal.scrollCerts) {
    S.portal.scrollCerts = false;
    const el = root.querySelector('[data-anchor="certs"]'), sc = el && el.closest("[data-scroll]");
    if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
  }
  // Story: scroll the portal to the part that matters for this step
  if (S.mode === "story" && LAST.story !== S.story.step) {
    LAST.story = S.story.step;
    const anchor = STORY[S.story.step].scroll;
    const el = root.querySelector(`.st-browser [data-anchor="${anchor}"]`);
    const sc = el && el.closest("[data-scroll]");
    if (sc && el) {
      const scale = 940 / 1280 * (root.getBoundingClientRect().width / 1440);
      const top = (el.getBoundingClientRect().top - sc.getBoundingClientRect().top) / scale + sc.scrollTop - 16;
      sc.scrollTo({ top: anchor === "top" ? 0 : top, behavior: "smooth" });
    }
  }
}

function hms(t) {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = Math.floor(t % 60);
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function later(ms, fn) {
  const e = EPOCH;
  setTimeout(() => { if (e !== EPOCH) return; fn(); render(); }, ms);
}
function toast(msg) {
  S.app.toast = msg;
  clearTimeout(toastTimer);
  const e = EPOCH;
  toastTimer = setTimeout(() => { if (e !== EPOCH) return; S.app.toast = null; render(); }, 2400);
}
function portalToast(msg) {
  S.portal.toast = msg;
  const e = EPOCH;
  setTimeout(() => { if (e !== EPOCH) return; S.portal.toast = null; render(); }, 2800);
}
function go(screen) { const a = S.app; a.history.push(a.screen); a.screen = screen; a.sheet = null; }
function back() { const a = S.app; a.video.playing = false; a.screen = a.history.pop() || "projects"; a.sheet = null; }
function markDone(cid, lid) { S.app.done[doneKey(cid, lid)] = true; }
function openMode(m) {
  EPOCH++; LAST.phone = LAST.sheet = LAST.portal = null; LAST.story = -1;
  S = m === "story" ? storyState(0) : freshState(m);
}

/* ===========================================================================
   Actions (data-action="…" on any element)
   =========================================================================== */
const ACTIONS = {
  noop() {},
  mode: (m) => openMode(m),
  hub() { EPOCH++; S = freshState("hub"); },
  reset() { openMode(S.mode); },

  // app navigation
  tab(t) { const a = S.app; a.screen = t; a.history = []; a.sheet = null; if (t === "courses") a.coursesSeen = true; },
  back,
  openCourse(id) { S.app.courseId = id; go("course"); },
  openPlayer(id) { S.app.courseId = id; go("player"); },
  cat(c) { S.app.category = c; },
  openPracticeCard() { S.app.lessonId = "t4"; S.app.courseId = CONFIG.featuredCourseId; go("pp-diag"); },

  // checkout
  enroll() { const a = S.app; a.sheet = "checkout"; a.checkoutStep = "form"; },
  closeSheet() { S.app.sheet = null; },
  pay() {
    const a = S.app; if (a.checkoutStep !== "form") return;
    a.checkoutStep = "paying";
    later(1000, () => { a.checkoutStep = "done"; a.enrolled[a.courseId] = true; });
  },
  startCourse() { const a = S.app; a.sheet = null; a.history = ["courses"]; a.screen = "player"; },

  // lessons
  openLesson(id) {
    const a = S.app, l = course(a.courseId).lessons.find((x) => x.id === id);
    a.lessonId = id;
    if (l.type === "video") { a.video = { playing: false, t: 0 }; go("video"); }
    else if (l.type === "quiz") { a.quiz = { picked: null, checked: false }; go("quiz"); }
    else if (l.type === "lab") go("lab");
    else if (l.type === "eval") { markDone(a.courseId, id); toast("Course evaluation submitted"); }
    else if (l.type === "cert") toast("Certificate PDF downloaded (sample)");
    else toast("Not part of this prototype");
  },
  togglePlay() { S.app.video.playing = !S.app.video.playing; },
  completeLesson() { const a = S.app; markDone(a.courseId, a.lessonId); back(); toast("Topic complete"); },
  quizPick(i) { const q = S.app.quiz; if (!q.checked) q.picked = +i; },
  quizCheck() { const q = S.app.quiz; if (q.picked != null) q.checked = true; },
  quizRetry() { S.app.quiz = { picked: null, checked: false }; },
  quizDone() { const a = S.app; markDone(a.courseId, a.lessonId); back(); toast(`Quiz passed · ${CONFIG.quiz.score}`); },

  // practice project
  openPractice() { S.app.practiceReady = true; go("pp-diag"); },
  ppTab(scr) {
    const a = S.app; a.screen = scr;
    if (scr === "pp-report") { a.generating = true; later(800, () => (a.generating = false)); }
  },
  fixExhaust() { S.app.fixed = true; toast("Exhaust moved: 23 ft from nearest opening"); },
  generate() { const a = S.app; go("pp-report"); a.generating = true; later(800, () => (a.generating = false)); },
  openSubmit() { const a = S.app; a.sheet = "submit"; a.submitStep = "choose"; },
  chooseSubmit(o) { if (S.app.submitStep === "choose") S.app.submitChoice = o; },
  doSubmit() {
    const a = S.app; if (a.submitStep !== "choose") return;
    a.submitStep = "sending";
    later(1100, () => { a.submitStep = "done"; if (a.submitChoice === "sync") S.portal.submission = "synced"; });
  },
  backToCourse() {
    const a = S.app, fid = CONFIG.featuredCourseId;
    a.sheet = null; a.courseId = fid; a.screen = "player"; a.history = ["courses"];
    if (a.submitChoice === "sync") { markDone(fid, "t4"); a.labState = "submitted"; toast("Topic 4 marked complete"); }
    else { a.labState = "pdf"; toast("Upload your PDF on your CERTI course page"); }
  },

  // Flow A jump list
  aJump(key) {
    const j = A_JUMPS.find((x) => x.key === key);
    EPOCH++; S.app = freshApp(); LAST.phone = LAST.sheet = null; j.set(S.app);
  },

  // portal — account site
  acPage(pg) { const p = S.portal; p.view = "learner"; p.site = "account"; p.page = pg; },
  viewOrder(id) { const p = S.portal; p.site = "account"; p.page = "order"; p.order = id; },
  openCourseArea() { const p = S.portal; p.view = "learner"; p.site = "course"; p.tab = "course"; },
  ext(label) { const p = S.portal; const msg = `“${label || "This link"}” — not part of this prototype`;
    if (S.mode === "flowA") toast(msg); else portalToast(msg); },
  fbJump(where) {
    const p = S.portal; p.view = "learner";
    if (where === "account") { p.site = "account"; p.page = "courses"; } else { p.site = "course"; p.tab = where; }
  },
  // portal — course area
  cmHome() { const p = S.portal; p.site = "account"; p.page = "dashboard"; },
  cmTab(t) { const p = S.portal; p.site = "course"; p.tab = t; },
  cmToggle(id) { const p = S.portal; p.collapsed[id] = !p.collapsed[id]; },
  cmCollapseAll() {
    const p = S.portal, ids = ["s0", "t1", "t2", "t3", "t4", "t5", "t6"], allShut = ids.every((k) => p.collapsed[k]);
    ids.forEach((k) => (p.collapsed[k] = !allShut));
  },
  cmSide() { S.portal.sidebar = !S.portal.sidebar; },
  cmOnly() { S.portal.onlyProgress = !S.portal.onlyProgress; },
  cmCourse(id) {
    const p = S.portal;
    if (id === CONFIG.featuredCourseId) { p.view = "learner"; p.site = "course"; p.tab = "course"; }
    else portalToast("Completed course — your certificate is under My Certificates");
  },
  pView(v) { S.portal.view = v; if (v === "learner" && S.portal.site !== "course") { S.portal.site = "course"; S.portal.tab = "course"; } },
  pState(s) { const p = S.portal; p.submission = s; p.upload = "idle"; if (s === "synced") p.connected = true; },
  pUpload() {
    const p = S.portal; if (p.upload !== "idle") return;
    p.upload = "uploading";
    later(1400, () => { p.upload = "idle"; p.submission = "uploaded"; });
  },
  pEval() {
    const p = S.portal; if (p.submission !== "approved") return;
    p.evalDone = true; p.certIssued = true; p.scrollCerts = true;
    portalToast("Course Evaluation submitted · C-102 certificate added to My Certificates");
  },
  pSelect(id) { S.portal.selected = id; },
  pApprove() {
    const p = S.portal; p.reviews[p.selected] = "approved";
    const r = CONFIG.reviewQueue.find((x) => x.id === p.selected);
    if (p.selected === "r1") { p.submission = "approved"; p.connected = true; S.app.approved = true; }
    portalToast(`Approved · Topic 5 (Course Evaluation) unlocked for ${r.name}`);
  },
  pRequest() {
    const p = S.portal; p.reviews[p.selected] = "changes";
    if (p.selected === "r1" && p.submission === "approved") { p.submission = "synced"; p.evalDone = false; p.certIssued = false; }
    const r = CONFIG.reviewQueue.find((x) => x.id === p.selected);
    portalToast(`Changes requested · ${r.name} has been notified`);
  },

  // story
  next() { if (S.story.step < STORY.length - 1) { EPOCH++; S = storyState(S.story.step + 1); } },
  prev() { if (S.story.step > 0) { EPOCH++; S = storyState(S.story.step - 1); } },
  jump(n) { EPOCH++; S = storyState(+n); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (S.mode === "story" && el.closest(".frame")) return; // story frames are driven by Next / Back
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset.arg, el);
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.mode !== "hub") { ACTIONS.hub(); render(); }
  if (S.mode !== "story") return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); ACTIONS.next(); render(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ACTIONS.prev(); render(); }
});

function fit() {
  const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
  document.getElementById("stage").style.transform = `translate(-50%, -50%) scale(${s})`;
}
window.addEventListener("resize", fit);
Object.entries(P.colors).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
document.title = `RadonSketch × ${P.name} — Partnership Prototype`;
fit();
render();

</script>
</body>
</html>
